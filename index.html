@font-face{font-family:'IBM Plex Sans';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/plex-sans-118b75.woff2) format('woff2');unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}
@font-face{font-family:'IBM Plex Sans';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/plex-sans-118b75.woff2) format('woff2');unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}
/* Layout: one phone-width column; home = list of section tiles, each section has its own hue. */
:root{
  /* type scale (6 steps) */
  --fs-xs:.8125rem; --fs-sm:.875rem; --fs-base:1rem; --fs-md:1.0625rem; --fs-lg:1.25rem; --fs-xl:1.5rem; --big:clamp(2rem,9vw,2.75rem);
  /* spacing & radius */
  --font-sans:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; --font-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --mon-bg:#0b1517; --mon-ink:#e6f1ef; --mon-muted:#8fa7a3; --mon-grid:rgba(255,255,255,.06); --etco2:#facc15;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --r-sm:10px; --r:14px;
  /* neutrals (slight teal bias) */
  --bg:#f3f6f6; --card:#ffffff; --ink:#14201f; --muted:#5a6866; --line:#dbe3e2; --field:#f3f6f6;
  --accent:#0f766e; --accent-ink:#ffffff; --accent-soft:#e3f3f1; --on:#ffffff;
  --warn-bg:#fff6dc; --warn-ink:#7a4b00; --warn-line:#efc35a;
  --danger-bg:#fde9e9; --danger-ink:#9b1c1c; --danger-line:#f0a3a3;
  --unv-bg:#edf0f2; --unv-ink:#4b5563;
  --emerg-solid:#b42318;
  /* section hues */
  --g-emerg:#b42318; --g-emerg-soft:#fde9e9;
  --g-obs:#be185d;   --g-obs-soft:#fce7f3;
  --g-paeds:#15803d; --g-paeds-soft:#dcfce7;
  --g-spinal:#0e7490; --g-spinal-soft:#cffafe;
  --g-airway:#b45309; --g-airway-soft:#fef3c7;
  --g-values:#5a6866; --g-values-soft:#eceff0;
  --gc:var(--accent); --gc-soft:var(--accent-soft);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1514; --card:#162120; --ink:#e4eeec; --muted:#9db0ad; --line:#2a3836; --field:#0e1514;
    --accent:#2dd4bf; --accent-ink:#04201c; --accent-soft:#11302c; --on:#0e1514;
    --warn-bg:#2e2410; --warn-ink:#f5cf7a; --warn-line:#6b5420;
    --danger-bg:#3a1414; --danger-ink:#ffb4b4; --danger-line:#7a2a2a;
    --unv-bg:#1f2a29; --unv-ink:#a8b8b5;
    --g-emerg:#ff9b93; --g-emerg-soft:#3a1414;
    --g-obs:#f472b6;   --g-obs-soft:#3a1028;
    --g-paeds:#4ade80; --g-paeds-soft:#0c2e1a;
    --g-spinal:#22d3ee; --g-spinal-soft:#08303a;
    --g-airway:#fbbf24; --g-airway-soft:#3a2a06;
    --g-values:#9db0ad; --g-values-soft:#1f2a29;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1514; --card:#162120; --ink:#e4eeec; --muted:#9db0ad; --line:#2a3836; --field:#0e1514;
  --accent:#2dd4bf; --accent-ink:#04201c; --accent-soft:#11302c; --on:#0e1514;
  --warn-bg:#2e2410; --warn-ink:#f5cf7a; --warn-line:#6b5420;
  --danger-bg:#3a1414; --danger-ink:#ffb4b4; --danger-line:#7a2a2a;
  --unv-bg:#1f2a29; --unv-ink:#a8b8b5;
  --g-emerg:#ff9b93; --g-emerg-soft:#3a1414;
  --g-obs:#f472b6;   --g-obs-soft:#3a1028;
  --g-paeds:#4ade80; --g-paeds-soft:#0c2e1a;
  --g-spinal:#22d3ee; --g-spinal-soft:#08303a;
  --g-airway:#fbbf24; --g-airway-soft:#3a2a06;
  --g-values:#9db0ad; --g-values-soft:#1f2a29;
  color-scheme:dark;
}
[data-group="emerg"]{--gc:var(--g-emerg);--gc-soft:var(--g-emerg-soft)}
[data-group="obs"]{--gc:var(--g-obs);--gc-soft:var(--g-obs-soft)}
[data-group="paeds"]{--gc:var(--g-paeds);--gc-soft:var(--g-paeds-soft)}
[data-group="spinal"]{--gc:var(--g-spinal);--gc-soft:var(--g-spinal-soft)}
[data-group="airway"],[data-group="ga"]{--gc:var(--g-airway);--gc-soft:var(--g-airway-soft)}
[data-group="regional"]{--gc:var(--g-spinal);--gc-soft:var(--g-spinal-soft)}

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:400 var(--fs-base)/1.5 var(--font-sans);-webkit-text-size-adjust:100%}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:640px;margin:0 auto;padding-block:0 var(--s5);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit}
p{margin:var(--s2) 0}
h1,h2,h3{text-wrap:balance}
:focus-visible{outline:3px solid var(--gc);outline-offset:2px}

/* header */
header{display:flex;align-items:center;gap:var(--s2);padding:var(--s3) 0}
header h1{font-size:var(--fs-lg);font-weight:700;margin:0;flex:1;display:flex;align-items:center;gap:var(--s2);line-height:1.2;min-width:0}
.hico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--gc-soft);color:var(--gc);flex:none}
.hico svg{width:22px;height:22px}
.iconbtn{background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);min-width:44px;height:44px;padding:0 var(--s3);cursor:pointer;font-size:var(--fs-sm);font-weight:600;white-space:nowrap}
.draft,.checked{border-radius:var(--r-sm);padding:var(--s2) var(--s3);font-size:var(--fs-xs);text-align:center;margin-bottom:var(--s3);line-height:1.35}
.draft{background:var(--danger-bg);color:var(--danger-ink);border:1px solid var(--danger-line);font-weight:700}
.checked{background:var(--accent-soft);color:var(--ink)}

/* home tiles */
.label{font-size:var(--fs-xs);font-weight:700;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin:var(--s4) 2px var(--s2)}
.tiles{display:grid;gap:var(--s2)}
.tile{--t:var(--accent);--t-soft:var(--accent-soft);display:flex;align-items:center;gap:var(--s3);width:100%;text-align:left;background:var(--card);
  border:1px solid var(--line);border-radius:var(--r);padding:var(--s3);cursor:pointer;color:var(--ink)}
.tile .ico{width:52px;height:52px;border-radius:var(--r);display:grid;place-items:center;background:var(--t-soft);color:var(--t);flex:none}
.tile .ico svg{width:30px;height:30px}
.tile .txt{flex:1;min-width:0}
.tile .tt{display:block;font-size:var(--fs-lg);font-weight:700;line-height:1.2}
.tile .ts{display:block;font-size:var(--fs-sm);color:var(--muted);margin-top:2px;line-height:1.35}
.tile .chev{color:var(--muted);font-size:var(--fs-xl);line-height:1}
.t-obs{--t:var(--g-obs);--t-soft:var(--g-obs-soft)} .t-paeds{--t:var(--g-paeds);--t-soft:var(--g-paeds-soft)}
.t-spinal,.t-regional{--t:var(--g-spinal);--t-soft:var(--g-spinal-soft)} .t-airway,.t-ga{--t:var(--g-airway);--t-soft:var(--g-airway-soft)}
.t-values{--t:var(--g-values);--t-soft:var(--g-values-soft)}
.qbtn.t-obs,.sq.t-obs{--t:var(--g-obs);--t-soft:var(--g-obs-soft)} .qbtn.t-paeds,.sq.t-paeds{--t:var(--g-paeds);--t-soft:var(--g-paeds-soft)}
.qbtn.t-ga,.sq.t-ga{--t:var(--g-airway);--t-soft:var(--g-airway-soft)} .sq.t-regional{--t:var(--g-spinal);--t-soft:var(--g-spinal-soft)}
.tile.t-emerg{background:var(--emerg-solid);border-color:var(--emerg-solid);color:#fff}
.tile.t-emerg .ico{background:rgba(255,255,255,.16);color:#fff}
.tile.t-emerg .ts,.tile.t-emerg .chev{color:rgba(255,255,255,.88)}

/* search */
.searchbox{position:relative}
.searchbox svg{position:absolute;left:12px;top:14px;width:20px;height:20px;color:var(--muted)}
.search{width:100%;height:48px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:var(--fs-base);padding:0 var(--s3) 0 40px}
#results:not(:empty){margin-top:var(--s2);background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);padding:0 var(--s3)}
.hit{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:var(--s3) 0;font-weight:600;font-size:var(--fs-base);cursor:pointer}
.hit:last-child{border-bottom:0}
.hit small{display:block;color:var(--muted);font-weight:400;font-size:var(--fs-xs);margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:var(--s2)}
.chip{padding:var(--s2) var(--s3);border-radius:999px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:var(--fs-sm);font-weight:600;text-align:left}

/* generic buttons kept for in-card links */
.homebtn{display:block;box-sizing:border-box;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:var(--r-sm);
  padding:var(--s3);font-size:var(--fs-base);font-weight:700;cursor:pointer;margin:var(--s2) 0}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:var(--s4);margin:var(--s3) 0}
.card h2{font-size:var(--fs-md);font-weight:700;margin:0 0 var(--s2);line-height:1.3}
.card h3{font-size:var(--fs-sm);font-weight:700;color:var(--gc);margin:var(--s4) 0 var(--s1);letter-spacing:.01em}
.hint{font-size:var(--fs-sm);color:var(--muted);margin:var(--s4) 2px var(--s1)}

/* controls */
.seg{display:flex;gap:var(--s2);flex-wrap:wrap;margin:var(--s2) 0 var(--s3)}
.seg button{flex:1 1 auto;min-height:44px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--card);cursor:pointer;padding:0 var(--s3);font-size:var(--fs-sm);font-weight:600}
.seg button[aria-pressed="true"]{background:var(--gc);color:var(--on);border-color:var(--gc);font-weight:700}
.emtabs{margin-top:0;flex-wrap:nowrap}
.emtabs button{flex:1 1 0;padding:0 var(--s1);min-width:0}
.emtabs button{min-height:48px;font-size:var(--fs-base)}
.emtabs.five{gap:4px}.emtabs.five button{font-size:var(--fs-xs);padding:0 2px;letter-spacing:-.01em}
.step{display:flex;align-items:center;gap:var(--s2);margin:var(--s2) 0}
.step label{flex:1;font-weight:600;font-size:var(--fs-base);min-width:0}
.step button{width:48px;height:48px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--card);font-size:var(--fs-xl);line-height:1;cursor:pointer}
.step input{font-family:var(--font-mono);width:80px;height:48px;text-align:center;font-size:var(--fs-lg);font-weight:700;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--field);color:var(--ink);font-variant-numeric:tabular-nums}
.step .unit{width:30px;color:var(--muted);font-size:var(--fs-sm)}

/* results */
.result{background:var(--gc-soft);border-radius:var(--r);padding:var(--s4);margin:var(--s3) 0}
.big{font-family:var(--font-mono);font-size:var(--big);font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:var(--fs-sm);line-height:1.4}
.row{display:flex;gap:var(--s4);flex-wrap:wrap}
.row>div{flex:1 1 140px;min-width:0}
.trio{display:flex;gap:var(--s2);margin-top:var(--s2)}
.trio span{flex:1;text-align:center;border:1px solid var(--line);border-radius:var(--r-sm);padding:var(--s1) 0;background:var(--card);color:var(--muted);font-size:var(--fs-sm);font-variant-numeric:tabular-nums}
.trio span.main{border:2px solid var(--gc);color:var(--ink);font-weight:800}
.src{color:var(--muted);font-size:var(--fs-xs);margin-top:var(--s3);line-height:1.4}
.warn,.danger,.unv{border-radius:var(--r-sm);padding:var(--s2) var(--s3);margin:var(--s2) 0;font-size:var(--fs-sm);line-height:1.45}
.warn{background:var(--warn-bg);color:var(--warn-ink);border:1px solid var(--warn-line)}
.danger{background:var(--danger-bg);color:var(--danger-ink);border:1px solid var(--danger-line);font-weight:700}
.unv{background:var(--unv-bg);color:var(--unv-ink);border:1px dashed var(--line)}
.unv b{letter-spacing:.03em}

/* tables & lists */
table{width:100%;border-collapse:collapse;font-size:var(--fs-sm);line-height:1.4}
th,td{border-bottom:1px solid var(--line);padding:var(--s2) var(--s1);text-align:left;vertical-align:top;font-variant-numeric:tabular-nums}
th{color:var(--muted);font-weight:600}
td.hl{font-weight:700}
.mono,b.dose,.trio span{font-family:var(--font-mono)}
tr.hl td{background:var(--gc-soft);font-weight:700}
ol,ul{margin:var(--s1) 0;padding-left:22px}
li{margin:var(--s1) 0}

/* accordion */
details.acc{padding:0;margin:var(--s2) 0}
details.acc>summary{list-style:none;cursor:pointer;padding:var(--s3) var(--s4);font-weight:700;font-size:var(--fs-md);display:flex;align-items:center;gap:var(--s3);min-height:52px;line-height:1.3}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary .st{flex:1;min-width:0}
details.acc>summary::after{content:"›";color:var(--muted);font-size:var(--fs-xl);line-height:1;transition:transform .15s}
details.acc[open]>summary::after{transform:rotate(90deg)}
details.acc[open]>summary{border-bottom:1px solid var(--line)}
details.acc>:not(summary){margin-left:var(--s4);margin-right:var(--s4)}
details.acc[open]{padding-bottom:var(--s3)}
.stepno{min-width:34px;height:28px;padding:0 var(--s2);border-radius:8px;background:var(--gc-soft);color:var(--gc);font-weight:800;font-size:var(--fs-sm);display:inline-grid;place-items:center;flex:none;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion: reduce){details.acc>summary::after{transition:none}}

/* crisis */
ol.crisis{padding-left:26px;margin:var(--s2) 0}
ol.crisis li{margin:var(--s2) 0;font-size:var(--fs-md);line-height:1.45;padding-left:2px}
ol.crisis li::marker{font-weight:800;color:var(--g-emerg)}
b.dose{font-weight:800}
.emlinks{padding:var(--s3) var(--s4)}
.emlink{display:block;box-sizing:border-box;text-align:left;margin:var(--s2) 0;padding:var(--s3);border-radius:var(--r-sm);border:1px solid var(--danger-line);background:var(--danger-bg);color:var(--danger-ink);font-weight:700;font-size:var(--fs-sm);cursor:pointer}

.themebtn{min-width:44px;width:44px;padding:0;font-size:var(--fs-lg)}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s2)}
.qbtn,.sq{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--s1);background:var(--card);border:1px solid var(--line);border-radius:var(--r);cursor:pointer;color:var(--ink);text-align:center}
.qbtn{padding:var(--s3) var(--s1);font-size:var(--fs-sm);font-weight:700;min-height:88px}
.qi{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--t-soft);color:var(--t)}
.qi svg{width:26px;height:26px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:var(--s2)}
.sq{padding:var(--s4) var(--s2);min-height:120px}
.sq .qi{width:52px;height:52px}.sq .qi svg{width:30px;height:30px}
.sqt{font-size:var(--fs-md);font-weight:700;line-height:1.2}
.sqs{font-size:var(--fs-xs);color:var(--muted);line-height:1.2}
.t-emerg{margin-top:var(--s3)}
.linkbtn{display:flex;align-items:center;justify-content:center;gap:var(--s2);width:100%;margin-top:var(--s4);background:none;border:0;color:var(--muted);font-size:var(--fs-sm);font-weight:600;cursor:pointer;min-height:44px}
.linkbtn svg{width:18px;height:18px}
.lamax{background:var(--gc-soft);border-radius:var(--r-sm);padding:var(--s2) var(--s3);font-size:var(--fs-sm);margin:var(--s2) 0;line-height:1.45}
tr.over td{background:var(--danger-bg)}
/* home hero (monitor) */
.hero{position:relative;overflow:hidden;background:var(--mon-bg);color:var(--mon-ink);border-radius:var(--r);padding:var(--s3) var(--s4) var(--s4);margin:var(--s3) 0 var(--s3)}
.hero::before{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--mon-grid) 1px,transparent 1px),linear-gradient(90deg,var(--mon-grid) 1px,transparent 1px);background-size:16px 16px;pointer-events:none}
.capno{position:absolute;left:0;right:0;bottom:8px;width:100%;height:44px;opacity:.85}
.capno .trace{animation:sweep 6s linear infinite}
.capno path{fill:none;stroke:var(--etco2);stroke-width:2;vector-effect:non-scaling-stroke;stroke-linejoin:round}
@keyframes sweep{from{transform:translateX(0)}to{transform:translateX(-100px)}}
@media (prefers-reduced-motion: reduce){.capno .trace{animation:none}}
.hero-top{position:relative;display:flex;align-items:center;justify-content:space-between;gap:var(--s2)}

table.blk th{width:32%;font-size:var(--fs-xs);text-transform:uppercase;letter-spacing:.04em}
.bad{color:var(--danger-ink);font-weight:700}

.activebar{display:flex;justify-content:space-between;align-items:center;gap:var(--s2);box-sizing:border-box;width:100%;text-align:left;margin:0 0 var(--s3);padding:var(--s2) var(--s3);border-radius:var(--r-sm);border:1px solid var(--accent);background:var(--accent-soft);color:var(--ink);font-size:var(--fs-sm);cursor:pointer}

.casecard.on{border-color:var(--accent)}
.caseact{display:flex;gap:var(--s2)}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-size:var(--fs-xs);font-weight:700}
.homebtn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);text-align:center}
.step.sample input{color:var(--muted);font-style:italic;border-style:dashed}
.stag{display:inline-block;font-size:var(--fs-xs);font-weight:700;color:var(--warn-ink);background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:6px;padding:0 5px;margin-left:4px;font-style:normal;vertical-align:1px}
.samplewarn{background:var(--warn-bg);color:var(--warn-ink);border:1px solid var(--warn-line);border-radius:var(--r-sm);padding:var(--s2) var(--s3);margin:0 0 var(--s3);font-size:var(--fs-sm)}

.namebtn{background:none;border:0;color:var(--mon-muted);font-size:var(--fs-base);cursor:pointer;padding:0 4px;vertical-align:2px}
.abxopt{margin:var(--s1) 0}
.abxrow{display:flex;justify-content:space-between;gap:var(--s2);padding:var(--s2) 0;border-bottom:1px solid var(--line);font-size:var(--fs-sm)}

.abxrow b .sub{display:block;font-family:var(--font-sans);font-weight:400}
.or{display:block;font-size:var(--fs-xs);font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:var(--s2) 0 0}
details.endo{margin-top:var(--s3);border:1px solid var(--line);border-radius:var(--r-sm);padding:var(--s2) var(--s3)}
details.endo summary{cursor:pointer;font-weight:600;font-size:var(--fs-sm)}
.disc{color:var(--muted);font-size:var(--fs-xs);text-align:center;margin-top:var(--s5);line-height:1.5}
a{color:var(--accent)}
.vs label{display:flex;gap:var(--s3);align-items:flex-start;padding:var(--s2) 0;border-bottom:1px solid var(--line);font-size:var(--fs-sm)}

</head>
<body>
<main id="app"></main>
<script>
"use strict";
/* ================= CONFIG ================= */
// Set to e.g. "2026-11-20" after the values sheet has been signed off.
const VALUES_CHECKED = "14 Nov 2026";
const APP_VERSION = "2.5.0";
const APP_DATE = "14 Nov 2026";
const PROTO = {name:"Departmental obstetric anaesthesia protocol", review:"2026-09-01"};

/* ================= HELPERS ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const r05 = x => Math.round(x*2)/2;               // nearest 0.5
const floor05 = x => Math.floor(x*2+1e-9)/2;      // round down to 0.5
const f1 = x => (Math.round(x*10)/10).toFixed(1);
const fmt = x => { const v = Math.round(x*100)/100; return String(v); };
const store = {
  get(k,d){ try{ const v = localStorage.getItem("ic."+k); return v===null?d:JSON.parse(v);}catch(e){return d;} },
  set(k,v){ try{ localStorage.setItem("ic."+k, JSON.stringify(v)); }catch(e){} }
};
// Inputs are not remembered between uses (per plan): state lives in memory only.
const S = { ettMode:"adult", sex:"F", height:158, ageY:4, ageM:0, wt:3.0,
            touched:{}, abxSp:"general", spOp:"lscs", spHt:155, morWt:60, pw:10, pY:1, pM:0, pHt:75, pBE:-5, aw:70, emTab:"adult", obTab:"labour", pTab:"pre", gaTab:"pre", raTab:"safety", laA:[], laP:[], cSex:"F", cY:40, cM:0, cH:160, cW:60, cNick:"", laD:"bupi", laC:"0.5", laMl:15, laBi:"1", age:45, apfel:0, pump:"pcea_cse", topup:"lig" };

function src(text){ return `<div class="src">Source: ${text}</div>`; }
function protoSrc(){
  const past = new Date() > new Date(PROTO.review+"T00:00:00");
  return src(esc(PROTO.name)+" · review due 1 Sep 2026") +
    (past ? `<div class="warn">⚠ Protocol review date (1 Sep 2026) has passed — check for a newer version.</div>` : "");
}
function unv(what, why){ return `<div class="unv"><b>UNVERIFIED — HIDDEN.</b> ${what}<br><span>${why}</span></div>`; }
function seg(key, opts){
  return `<div class="seg">` + opts.map(([v,l]) =>
    `<button aria-pressed="${S[key]===v}" data-seg="${key}" data-val="${v}">${l}</button>`).join("") + `</div>`;
}
const SAMPLE_KEYS = ["height","aw","age","pw","pY","pM","spHt","morWt","sex"];
const isSample = k => SAMPLE_KEYS.includes(k) && !S.touched[k];
function step(key, label, unit, min, max, stp){
  return `<div class="step ${isSample(key)?"sample":""}"><label for="in-${key}">${label}${isSample(key)?` <span class="stag">sample</span>`:""}</label>
    <button aria-label="decrease" data-step="${key}" data-d="${-stp}" data-min="${min}" data-max="${max}">−</button>
    <input id="in-${key}" inputmode="decimal" data-in="${key}" data-min="${min}" data-max="${max}" value="${S[key]}">
    <button aria-label="increase" data-step="${key}" data-d="${stp}" data-min="${min}" data-max="${max}">+</button>
    <span class="unit">${unit}</span></div>`;
}
function trio(a,b,c){ return `<div class="trio"><span>${a}</span><span class="main">${b}</span><span>${c}</span></div>`; }
const disc = `<div class="disc">${VALUES_CHECKED ? `Values checked ${VALUES_CHECKED}` : `<b>DRAFT – values not checked</b>`}<br>Memory aid only — clinical judgement decides. Cases are anonymous, kept on this phone only, auto-deleted after 36 h.<br><b>Version ${APP_VERSION} · updated ${APP_DATE}</b></div>`;

/* ================= SCREENS ================= */
function banner(){
  return VALUES_CHECKED
    ? `<div class="checked">Values checked: ${esc(VALUES_CHECKED)} · items marked UNVERIFIED stay hidden</div>`
    : `<div class="draft">DRAFT – not checked. Do not rely on these values yet.</div>`;
}
const ICONS = {
  emerg:'<path d="M12 3.5 2.8 19.5h18.4z"/><path d="M12 9.5v4.5"/><circle cx="12" cy="16.8" r=".9" fill="currentColor" stroke="none"/>',
  obs:'<circle cx="11" cy="3.8" r="2.3" fill="currentColor" stroke="none"/><path fill="currentColor" stroke="none" d="M9.4 7.2h2.6c1 0 1.7.7 1.8 1.6l.2 1.3c2.5.9 4 2.9 4 5.1 0 2-1.5 3.5-3.8 3.8l-.4 3.5h-2.3l-.2-3.4h-.5l-.4 3.4H8.1l.4-6.6-.8-4.5c-.2-1.2.5-2.2 1.7-2.2z"/>',
  paeds:'<circle cx="12" cy="13" r="7.5"/><path d="M12 5.5c0-1.7 1.3-2.7 2.8-2.2"/><circle cx="9.3" cy="12.5" r=".9" fill="currentColor" stroke="none"/><circle cx="14.7" cy="12.5" r=".9" fill="currentColor" stroke="none"/><path d="M9.8 16c1.3 1.1 3.1 1.1 4.4 0"/>',
  spinal:'<rect x="8.5" y="2" width="7" height="3.6" rx="1.4"/><rect x="8.5" y="7.2" width="7" height="3.6" rx="1.4"/><rect x="8.5" y="12.4" width="7" height="3.6" rx="1.4"/><rect x="8.5" y="17.6" width="7" height="3.6" rx="1.4"/><path d="M5.5 3.8h3M15.5 3.8h3M5.5 9h3M15.5 9h3M5.5 14.2h3M15.5 14.2h3M5.5 19.4h3M15.5 19.4h3"/>',
  airway:'<path d="M12 3v7"/><path d="M12 10c-1-.8-2.4-1-3.4 0C6.9 11.8 5.5 15.5 5.5 18.5c0 1.6 1.3 2.2 2.8 1.6 1.9-.8 3.2-2.6 3.7-5.6V10"/><path d="M12 10c1-.8 2.4-1 3.4 0 1.7 1.8 3.1 5.5 3.1 8.5 0 1.6-1.3 2.2-2.8 1.6-1.9-.8-3.2-2.6-3.7-5.6"/>',
  values:'<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1"/><path d="m8.5 13 2.5 2.5 4.5-5"/>',
  capno:'<path d="M2 16h4l1.5-9c3 0 6-.6 8.5-1.2L17.5 16H22"/>',
  search:'<circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/>'};
ICONS.ga = ICONS.airway; ICONS.regional = ICONS.spinal;
const svg = k => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[k]}</svg>`;
function head(title, back, icon){
  const th = store.get("theme","auto");
  const thLabel = th==="auto" ? "◐" : th==="dark" ? "☾" : "☀";
  return `<header>${back?`<button class="iconbtn" data-go="${back}" aria-label="Back">‹ Back</button>`:""}
    <h1>${icon?`<span class="hico">${svg(icon)}</span>`:""}<span>${title}</span></h1><button class="iconbtn themebtn" data-theme-toggle aria-label="Theme: ${th}" title="Theme: ${th}">${thLabel}</button></header>` + (VALUES_CHECKED ? "" : banner());
}

const screens = {};

const tile = (cls, icon, title, sub, attrs) => `<button class="tile ${cls}" ${attrs}><span class="ico">${svg(icon)}</span><span class="txt"><span class="tt">${title}</span><span class="ts">${sub}</span></span><span class="chev">›</span></button>`;
const DOCTOR = "Dr X";
const PEARLS = [
  ["Exactly 150 cm → 1.8 mL heavy bupivacaine for LSCS.","A1. Spinal: dose by height","obs","lscs"],
  ["IT morphine is 1 mg/mL diluted: 0.1 mL = 0.1 mg. Never straight from the 10 mg/mL ampoule.","A2. Spinal: IT morphine & fentanyl","obs","lscs"],
  ["Sugammadex 16 mg/kg (total weight) for immediate reversal after RSI rocuronium.","2. RSI","ga","ind"],
  ["Rocuronium is dosed on ideal weight; suxamethonium on total weight.","3. Muscle relaxants","ga","ind"],
  ["Chula formula: oral ETT depth = 4 + height/10 cm.","4. Tube & airway kit","ga","ind"],
  ["Paeds ETT anchor: term 9 cm, 1 year 12 cm, then age/2 + 12.","1. Tube: size, depth, blade, suction","paeds","ind"],
  ["Caudal: more than 1.2 mL/kg of 0.25% bupivacaine = toxicity.","9. Block: caudal","paeds","intra"],
  ["Neonatal epidural: never exceed 0.2 mg/kg/h of local anaesthetic.","12. Block: lumbar / thoracic epidural","paeds","intra"],
  ["LAST: Intralipid 20% 1.5 mL/kg over 1 min, then 15 mL/kg/h.","LA toxicity (LAST)","emerg","adult"],
  ["It is easier to manage hypotension than an inadequate block.","A1. Spinal: dose by height","obs","lscs"],
  ["Do NOT flush a dural-puncture catheter before removal — residual LA.","4. Problem: accidental dural puncture","obs","labour"],
  ["Remi PCA not working? Adjust the background rate, not the bolus.","5. No epidural: IV PCA","obs","labour"],
  ["4/2/1: a 10 kg child needs 40 mL/h maintenance.","1. Fluids: maintenance & insensible loss","paeds","intra"],
  ["Apfel 2 risk factors = 39% PONV risk → give 2 agents.","2. PONV: Apfel score","ga","post"],
  ["SGLT2 inhibitors: stop 3 days before surgery (ertugliflozin 4).","2. Regular drugs: stop or continue","ga","pre"],
  ["Laryngospasm: suxamethonium 0.5 mg/kg with atropine 0.02 mg/kg.","Laryngospasm","emerg","paeds"]];
const CAPNO = (() => { let d = "M0 40"; for (let i=0;i<6;i++){ const x=i*100; d += ` L${x+18} 40 L${x+23} 13 Q${x+40} 10 ${x+58} 8 L${x+63} 40 L${x+100} 40`; } return d; })();
function greet(){ const h = new Date().getHours(); return h<5 ? "Night shift" : h<12 ? "Good morning" : h<17 ? "Good afternoon" : "Good evening"; }
function clockTxt(){ const d = new Date(); return d.toLocaleTimeString("en-GB", {hour:"2-digit", minute:"2-digit", hour12:false}); }
function dateTxt(){ return new Date().toLocaleDateString("en-GB", {weekday:"long", day:"numeric", month:"long"}); }
function quickLive(){
  const h = Math.round(S.spHt), row = LSCS.find(r => h <= r[0]);
  const ah = S.height, depth = r05(4 + ah/10), sz = S.sex==="F" ? "6.5–7.0" : "7.0–7.5";
  const e = paedEtt(), main = e.useCuff ? f1(e.cuffed) : e.plainTxt;
  const ac = activeCase(), child = ac && ac.y < 16, male = ac && ac.sex === "M";
  const na = why => `—<small>${why}</small>`;
  return [
    ["obs","LSCS spinal",`${h} cm`,(child||male) ? na(child?"not for a child case":"male case") : `${row[1]===row[2]?fmt(row[1]):fmt(row[1])+"–"+fmt(row[2])}<small>mL heavy bupi</small>`,"A1. Spinal: dose by height","obs","lscs","t-obs"],
    ["airway","Adult ETT",`${S.sex==="F"?"♀":"♂"} ${ah} cm`,child ? na("child case — see Paeds") : `${sz}<small>${f1(depth)} cm at mouth corner</small>`,"4. Tube & airway kit","ga","ind","t-ga"],
    ["paeds","Paeds ETT",`${sig(S.pw)} kg · ${S.pY} y${S.pM?` ${S.pM} m`:""}`,(ac && !child) ? na("adult case") : `${main}<small>${e.useCuff?"cuffed · ":""}${fmt(e.depth)} cm</small>`,"1. Tube: size, depth, blade, suction","paeds","ind","t-paeds"]];
}
screens.home = () => {
  const th = store.get("theme","auto"), thLabel = th==="auto" ? "◐" : th==="dark" ? "☾" : "☀";
  const pearl = PEARLS[Math.floor(Date.now()/86400000) % PEARLS.length];
  const secs = ["ga","regional","paeds","obs"].map(id=>GROUPS.find(g=>g.id===id));
  const short = {ga:"General anaesthesia", regional:"Regional anaesthesia", paeds:"Paediatric", obs:"Obstetric"};
  return `<section class="hero">
    <svg class="capno" viewBox="0 0 400 48" preserveAspectRatio="none" aria-hidden="true"><g class="trace"><path d="${CAPNO}"/></g></svg>
    <div class="hero-top"><span class="brand">${svg("capno")} Induction Card</span>
      <span class="hero-r"><span id="clock" class="clock">${clockTxt()}</span><button class="iconbtn themebtn herobtn" data-theme-toggle aria-label="Theme: ${th}">${thLabel}</button></span></div>
    <h1 class="hello">${greet()},<br>${esc(doctorName())} <button class="namebtn" data-go="settings" aria-label="Change display name">✎</button></h1>
    <div class="date">${dateTxt()}</div>
  </section>
  <div class="searchbox">${svg("search")}<input id="q" class="search" type="search" placeholder="Search caudal, remi, LSCS…" autocomplete="off" aria-label="Search cards"></div><div id="results"></div>
  ${tile("t-emerg","emerg","Emergencies","Crisis steps with doses",'data-go="g-emerg"')}
  ${caseStrip()}
  <div class="label">Quick</div>
  <div class="quick">${quickLive().map(([ic,lab,inp,ans,t,g,tb,cls],i)=>`<button class="qbtn ${cls}" data-open="${esc(t)}" data-g="${g}" data-tab="${tb}"><span class="qi qmini">${svg(ic)}</span><span class="qlab">${lab}</span><span class="qin">${inp}${(i===0&&isSample("spHt"))||(i===1&&isSample("height"))||(i===2&&isSample("pw"))?' <span class="stag">sample</span>':""}</span><span class="qans">${ans}</span></button>`).join("")}</div>
  <button class="pearl" data-open="${esc(pearl[1])}" data-g="${pearl[2]}" data-tab="${pearl[3]}"><span class="plab">Pearl of the day</span><span class="ptxt">${pearl[0]}</span><span class="pgo">Open card ›</span></button>
  <div class="label">Sections</div>
  <div class="grid2">${secs.map(g=>`<button class="sq t-${g.id}" data-go="g-${g.id}"><span class="qi">${svg(g.id)}</span><span class="sqt">${short[g.id]}</span><span class="sqs">${g.tabs.map(t=>t.label).join(" · ")}</span></button>`).join("")}</div>
  <button class="linkbtn" data-go="values">${svg("values")} Values sheet</button>` + disc;
};
setInterval(() => { const c = document.getElementById("clock"); if (c) c.textContent = clockTxt(); }, 30000);

/* ---------- ETT ---------- */
const ettCalc = (adultOnly, noInputs) => {
  if (adultOnly) S.ettMode = "adult";
  let inputs = adultOnly ? "" : seg("ettMode",[["adult","Adult"],["child","Child / infant / neonate"]]);
  let out = "";
  if (S.ettMode==="adult"){
    inputs += seg("sex",[["F","♀ Female"],["M","♂ Male"]]) + step("height","Height","cm",130,210,1);
    const h = S.height, depth = r05(4 + h/10);
    const sz = S.sex==="F" ? ["6.0","6.5 – 7.0","7.5"] : ["6.5","7.0 – 7.5","8.0"];
    out = `<div class="result"><div class="row">
      <div><div class="sub">Tube ID (mm)</div><div class="big">${sz[1]}</div>${trio(sz[0],sz[1],sz[2])}</div>
      <div><div class="sub">Oral depth at mouth corner</div><div class="big">${f1(depth)} cm</div>
        <div class="sub">4 + height/10 = 4 + ${h}/10</div></div></div>
      <div class="sub" style="margin-top:8px">Western 21/23 rule would give ${S.sex==="F"?"21":"23"} cm (21/23 is measured at the incisors).</div>
      ${src("Depth: Chula formula (Thai adults; measured at the upper canine ≈ mouth corner). Size: my practice, Malaysian adults.")}</div>`;
  } else {
    inputs += pInputs(true);
    out = ettBlock(paedEtt());
  }
  return noInputs ? out : `<div class="card">${inputs}</div>` + out;
};

/* ---------- SPINAL ---------- */
const LSCS = [ // [maxHeight inclusive, bupi mL lo, hi, total lo, hi, label]
  [150, 1.8,1.8, 2.1,2.1, "≤ 150"],

const PSRC = "My paeds notes (Jan 2024).";
const sig = x => Number(Number(x).toPrecision(3));
const W = () => S.pw;
const AGEM = () => S.pY*12 + S.pM;
// per-kg dose: per = number or [lo,hi]; returns "x unit" or "x – y unit", capped at max
function pk(per, unit, max){
  const w = W(), lo = Array.isArray(per)?per[0]:per, hi = Array.isArray(per)?per[1]:per;
  let a = lo*w, b = hi*w, capped = false;
  if (max!=null){ if (a>max){a=max;capped=true;} if (b>max){b=max;capped=true;} }
  const t = a===b ? `${sig(a)} ${unit}` : `${sig(a)} – ${sig(b)} ${unit}`;
  return capped ? `${t} <span class="sub">(max ${max} ${unit} applied)</span>` : t;
}
const perTxt = (per, unit) => (Array.isArray(per)?`${per[0]}–${per[1]}`:per) + ` ${unit}/kg`;
// table row: name, rule, result, note
const R = (name, rule, res, note) => `<tr><td>${name}${note?`<div class="sub">${note}</div>`:""}</td><td class="sub">${rule}</td><td class="hl">${res}</td></tr>`;
const T = rows => `<div style="overflow-x:auto"><table><tr><th>Drug / item</th><th>Rule</th><th>For ${sig(W())} kg</th></tr>${rows.join("")}</table></div>`;
const DR = (name, per, unit, note, max) => R(name, perTxt(per,unit), pk(per,unit,max), note);
function unvP(what, why, prop){ return `<div class="unv"><b>UNVERIFIED — HIDDEN.</b> ${what}<br>${why}${prop?`<br><b>Proposed:</b> ${prop}`:""}</div>`; }
const psrc = () => src(PSRC);
const LA_MAX = {bupi:2.5, ropi:3, lido:3, lidoAdr:7};
function laLine(){ const w=W(); return `<div class="lamax"><b>LA max for ${sig(w)} kg:</b> bupi / levobupi 2.5 mg/kg = <b>${sig(2.5*w)} mg</b> (${sig(w)} mL of 0.25%) · ropi 3 mg/kg = <b>${sig(3*w)} mg</b> · lignocaine 3 mg/kg = ${sig(3*w)} mg (7 with adrenaline = ${sig(7*w)} mg). <b>Doses from different blocks add up</b> — use "+ add" and the LA dose calculator (card 7).</div>`; }
// LA row: ml = [lo,hi] mL/kg, mgml = mg per mL, max = mg/kg, capml = absolute mL cap
function LAR(name, ml, mgml, max, note, capml){
  const w = W(); let a = ml[0]*w, b = ml[1]*w, cap = false;
  if (capml!=null){ if (a>capml){a=capml;cap=true;} if (b>capml){b=capml;cap=true;} }
  const mgkg = b*mgml/w, over = mgkg > max + 1e-9;
  const add = `<button class="addla mini" data-addla="${esc(JSON.stringify({d:"bupi",c:String(mgml/10),ml:+sig(b),bi:1,l:name.split(" · ")[0]}))}" data-lt="p">+ add</button>`;
  return `<tr class="${over?"over":""}"><td>${name}${note?`<div class="sub">${note}</div>`:""}${add}</td><td class="sub">${ml[0]===ml[1]?ml[0]:ml.join("–")} mL/kg · ${sig(mgkg)} mg/kg</td><td class="hl">${a===b?sig(a):sig(a)+"–"+sig(b)} mL${cap?` <span class="sub">(max ${capml} mL)</span>`:""}${over?`<div class="danger" style="margin:4px 0 0">Above max ${max} mg/kg</div>`:""}</td></tr>`;
}

function pInputs(forEtt){
  const y = S.pY, est = (y>=1 && y<=10) ? (y+4)*2 : null;
  return `${step("pw","Weight","kg",0.4,90,0.5)}${step("pY","Age","y",0,16,1)}${step("pM","+ months","m",0,11,1)}
    ${est?`<div class="sub">Estimated weight for age: (age + 4) × 2 = <b>${est} kg</b> <button class="iconbtn" style="height:34px;min-width:0" data-setw="${est}">Use</button></div>`:""}
    ${forEtt?`<div class="sub" style="margin-top:4px">Neonate &lt; 28 days: set age 0 y 0 m and enter weight.</div>`:""}`;
}

function paedEtt(){
  const w = W(), mo = AGEM(), y = S.pY;
  let plain, plainTxt, cuffed = null, depth, depthRule, sizeRule, conv = false;
  if (mo >= 24){
    plain = floor05(y/4 + 4); cuffed = floor05(y/4 + 3.5);
    sizeRule = "> 1 y: plain age/4 + 4, cuffed age/4 + 3.5 (rounded down to 0.5)";
    depth = y/2 + 12; depthRule = "age/2 + 12";
  } else if (mo >= 12){
    plain = 4.5; cuffed = floor05(1/4 + 3.5);
    sizeRule = "1 y: 4.5 plain; cuffed age/4 + 3.5";
    depth = 12; depthRule = "1 y: 12 cm";
  } else {
    if (w < 1){ plain = 2.5; plainTxt = "2.5"; sizeRule = "< 1 kg: 2.5 plain"; }
    else if (w < 2){ plain = 2.5; plainTxt = "2.5 – 3.0"; sizeRule = "1–2 kg: 2.5–3.0 plain (gap in notes, agreed)"; }
    else if (w < 3.5){ plain = 3.0; sizeRule = "> 2 kg: 3.0 plain"; }
    else if (mo < 4){ plain = 3.5; plainTxt = "3.5"; sizeRule = "> 3.5 kg: 3.5 plain (neonate 3.0–3.5)"; }
    else if (mo < 8){ plain = 4.0; sizeRule = "4 months: 4.0 plain"; }
    else { plain = 4.0; plainTxt = "4.0 – 4.5"; sizeRule = "8 months: 4.0–4.5 plain"; }
    if (w > 5){ cuffed = plain - 0.5; conv = true; }
    if (mo < 1){ depth = w < 1.5 ? 7 : w < 2.5 ? 8 : 9; depthRule = "Premature ~1 kg 7 cm, ~2 kg 8 cm; term 9 cm"; }
    else { depth = 3*plain; depthRule = "3 × ETT (term 9 cm → 1 y 12 cm)"; }
  }
  const useCuff = cuffed!==null && w > 5;
  return {w, mo, y, plain, plainTxt: plainTxt || f1(plain), cuffed, useCuff, depth, depthRule, sizeRule, conv};
}
function ettBlock(e){
  const main = e.useCuff ? e.cuffed : e.plain;
  const mainTxt = e.useCuff ? f1(e.cuffed) : e.plainTxt;
  return `<div class="result">
    <div class="sub">${e.useCuff?"Cuffed ID (mm) — weight > 5 kg":"Plain (uncuffed) ID (mm)"}</div>
    <div class="big">${mainTxt}</div>${trio(f1(main-0.5), mainTxt, f1(main+0.5))}
    ${e.useCuff?`<div class="sub" style="margin-top:8px">Plain alternative: <b>${e.plainTxt}</b></div>`:""}
    <div class="row" style="margin-top:10px">
      <div><div class="sub">Oral depth (anchor)</div><div class="big">${fmt(e.depth)} cm</div><div class="sub">${e.depthRule}</div></div>
      <div><div class="sub">Nasal</div><div class="big">${fmt(e.depth+2)}–${fmt(e.depth+3)} cm</div><div class="sub">oral + 2–3 cm</div></div>
    </div>

  <div class="card"><h2>Paeds ventilation</h2>

const mlh10 = (r, w) => sig(r*w*60/10);  // remi mcg/kg/min -> mL/h at 10 mcg/mL
pCards.tiva = () => {
  const w = W(), y = S.pY + S.pM/12;
  const pf = (y>=1 && y<=16 && w>5), kt = (y>=3 && y<=16 && w>=15 && w<=60);
  const remiR = (a,b) => `${a}–${b} mcg/kg/min = <b>${mlh10(a,w)}–${mlh10(b,w)} mL/h</b>`;
  return `<div class="card"><h2>TCI model check</h2>
  <p>Paedfusor (age 1–16 y, weight &gt; 5 kg): <b>${pf?"✓ eligible":"✗ not eligible"}</b><br>Kataria (age 3–16 y, 15–60 kg): <b>${kt?"✓ eligible":"✗ not eligible"}</b></p>
  <h3>Propofol TCI (Paedfusor, Alaris)</h3><ul><li>GA induction: at least <b>5 mcg/mL</b> (high Vd)</li><li>GA maintenance: &gt; <b>3.5 mcg/mL</b></li><li>Spontaneous breathing (dynamic airway): 2.5–4 mcg/mL</li></ul></div>
  <div class="card"><h2>Remifentanil 10 mcg/mL</h2><p class="sub">1 mg in 100 mL NS; 20 mL syringe. ${w>30?"Weight &gt; 30 kg: <b>Minto</b>.":"Weight &lt; 30 kg: <b>mass rate</b>."}</p>
  <ul><li>Induction ${remiR(0.15,0.3)} over 90 s (neonate: no induction time). Faster = severe bradycardia.</li>
  <li>Maintenance ${remiR(0.3,1)}</li><li>Sedation ${remiR(0.05,0.2)}</li></ul>
  <p>Start remi first, then propofol (reduces propofol use). Propofol 1% in 20 mL.</p>
  <h3>Items</h3><ul><li>Tubing 210 cm × 2</li><li>One-way valve (white) × 2</li><li>Three-way valve</li></ul>
  <h3>Adrenaline 1:10 000 (dilute in 10 mL)</h3><p>1 mL per 10 kg = <b>${sig(w/10)} mL</b> (${sig(w*10)} mcg)</p>
  <h3>Deep extubation on TIVA</h3><ol><li>Off remi / propofol</li><li>Flush NS 5 mL</li><li>Wait RR &gt; 14/min, then extubate</li></ol>${psrc()}</div>
  <div class="card"><h2>Emergence delirium</h2>${T([
    DR("IV dexmedetomidine","1","mcg"," over 10 min"),
    DR("Dexmedetomidine in recovery",[0.3,0.5],"mcg","diluted in 10 mL, slow bolus"),
    R("IV clonidine","1–2 mcg/kg over 10 min",`${pk([1,2],"mcg")}<div class="sub">= ${sig(W()/150)}–${sig(2*W()/150)} mL (0.1 mL = 15 mcg)</div>`,"sedation, analgesia, antiemetic, antisialogue, antihypertensive")])}</div>
  <div class="card"><h2>MRI under sedation</h2>
  <p>&lt; 6 months: tube. &gt; 6 months: consider sedation. Drip + FM5L + capnography.<br>Snoring, difficult airway, enlarged tonsils: try to avoid sedation.</p>
  <h3>Option 1 — propofol single pump</h3><p>150–180 mcg/kg/min = <b>${sig(150*w*60/10000)}–${sig(180*w*60/10000)} mL/h</b> of 1%<br>+ bolus 2 mg/kg = <b>${sig(2*w)} mg (${sig(2*w/10)} mL)</b></p>
  <h3>Option 2 — ketofol 3:1 (single pump)</h3><p>Propofol 150 mg + ketamine 50 mg in 20 mL = <b>propofol 7.5 + ketamine 2.5 mg/mL</b>.<br>Run 1–1.5 mL/kg/h = <b>${sig(w)}–${sig(1.5*w)} mL/h</b> (propofol 125–190 mcg/kg/min).</p>
  <h3>Option 3 — double pumps</h3><p>Dexmedetomidine 4 mcg/mL (0.8 mL in 20 mL): loading 1 mcg/kg over 10 min = <b>${sig(w)} mcg (${sig(w/4)} mL)</b>, then 0.5–1 mcg/kg/h = <b>${sig(w*0.5/4)}–${sig(w/4)} mL/h</b><br>
  Propofol 1 mg/kg bolus if anxious = <b>${sig(w)} mg</b>, then 2 mL/h.</p>${psrc()}</div>
  <div class="card"><h2>Dynamic airway assessment (spontaneous breathing)</h2>
  <p>Flexible scope: vocal cord movement, tracheomalacia. Maintain spontaneous breathing — <b>no paralysis</b>.<br>Airway options: NPO₂ with capno; nasal airway to universal port.</p>
  ${T([DR("IV glycopyrrolate","4","mcg"), DR("Ketamine (optional)",[1,2],"mg"),
    R("Remifentanil (mass rate)","0.05–0.3 mcg/kg/min; induction 0.1, maintenance 0.05",`${mlh10(0.05,W())}–${mlh10(0.3,W())} mL/h at 10 mcg/mL`,"run with Sterofundin 50 mL/h; consider lower concentration for faster rate"),
    R("Lignocaine 2% spray (cords, carina)","max 4 mg/kg",`${sig(4*W())} mg = ${sig(4*W()/20)} mL`,"ideally by surgeon; consider atomiser")])}
  <div class="warn">Remi max 1 mcg/kg/min. Above 0.3 mcg/kg/min may cause apnoea.</div>
  <ol><li>Sevoflurane down, then TIVA (TCI propofol Paedfusor 2.5–4 mcg/mL)</li><li>Jaw thrust to assess depth</li><li>Once deep, spray cords and carina</li><li>Taper sevoflurane</li><li>Once breathing spontaneously, insert NPA (preferably right nostril), connect to circuit, hold circuit to avoid kinking</li><li>Ensure spontaneous breathing (chest movement); bag if desaturating</li></ol>
  <p>Unable to oxygenate: consider LMA — smallest size 1.5 to allow flexible bronchoscope.</p>
  <h3>Rigid bronchoscopy</h3><ul><li>Deepen (increase remi/propofol)</li><li>May consider relaxant — <b>NOT for foreign body removal</b> (risk of distal movement)</li><li>Connect circuit to 22 mm port; controlled ventilation</li><li>Allow CO₂ retention, SpO₂ &gt; 80%</li><li>Consider intubation to proceed further</li></ul>${psrc()}</div>`;
};

    R("… neonate, fluid-limited (× 5)","1.5 mg/kg in 50 mL",`${sig(1.5*w)} mg in 50 mL`,"1 mL/h = 0.5 mcg/kg/min"),

pCards.fluids = () => {
  const w = W();
  const maint = w<=10 ? 4*w : w<=20 ? 40 + 2*(w-10) : 60 + (w-20);
  return `<div class="card"><h2>Maintenance (4/2/1)</h2><div class="big">${sig(maint)} mL/h</div>

  <div class="card"><h2>Paeds lumbar / thoracic epidural</h2>
  <p>&gt; 3 months: consider lumbar/thoracic. &lt; 3 months: caudal epidural.</p>
  ${laLine()}${T([R("Skin to space","1 mm/kg",`${sig(w)} mm`),R("Max air (LOR)","0.1 mL/kg",pk(0.1,"mL")),LAR("Bolus · levobupi 0.25%",[0.5,0.5],2.5,2.5)])}
  <ul><li>Do not flush catheter (avoid confusion with CSF)</li><li>Anchor: dermatome level parallel to skin + skin-to-space; &lt; 3 months max anchor 12 cm</li></ul>
  <h3>Infusion</h3>${(()=>{ const bands=[["&lt; 5 kg (neonate / &lt; 3 months)","0.1% LA, no opioid",[0.1,0.2],0.2,w<5],["5–10 kg","0.1% + fentanyl 1 mcg/mL",[0.2,0.3],0.4,w>=5&&w<=10],["&gt; 10 kg","0.1% + fentanyl 2 mcg/mL",[0.2,0.4],0.4,w>10]];

    <div class="danger">Never exceed ${w<5?"0.2":"0.4"} mg/kg/h of LA = ${sig((w<5?0.2:0.4)*w)} mL/h of 0.1%.</div>`; })()}

const GA_CHECKED = true;

function wts(){
  const w = S.aw, h = S.height, m = S.sex === "M";
  const bmi = w / Math.pow(h/100, 2);
  let ibw = (m ? 50 : 45.5) + 0.91*(h - 152.4); ibw = Math.max(ibw, 30);
  const lbw = m ? 9270*w/(6680 + 216*bmi) : 9270*w/(8780 + 244*bmi);
  const ibwU = Math.min(ibw, w);                       // if actual < ideal, use actual
  const adj = w < ibw ? w : ibw + 0.4*(w - ibw);
  return {tbw:w, ibw:ibwU, ibwRaw:ibw, lbw:Math.min(lbw,w), adj, bmi};
}
const WN = {tbw:"TBW", ibw:"IBW", lbw:"LBW", adj:"AdjBW"};
// dose row: name, per-kg [lo,hi], unit, weight key, concentration per mL (same unit) or null, note, max
function GD(name, per, unit, wk, conc, note, max){
  const W2 = wts(), w = W2[wk], lo = Array.isArray(per)?per[0]:per, hi = Array.isArray(per)?per[1]:per;
  let a = lo*w, b = hi*w, capped = false;
  if (max!=null){ if (a>max){a=max;capped=true;} if (b>max){b=max;capped=true;} }
  const dose = a===b ? `${sig(a)} ${unit}` : `${sig(a)}–${sig(b)} ${unit}`;
  const ml = conc ? (a===b ? `${sig(a/conc)} mL` : `${sig(a/conc)}–${sig(b/conc)} mL`) : "";
  return `<tr><td>${name}${note?`<div class="sub">${note}</div>`:""}</td><td class="sub">${Array.isArray(per)?per.join("–"):per} ${unit}/kg<br><b>${WN[wk]} ${sig(w)} kg</b></td><td class="hl">${dose}${capped?` <span class="sub">(max ${max})</span>`:""}${ml?`<div class="sub">${ml}</div>`:""}</td></tr>`;
}

/* ---------- REGIONAL ANAESTHESIA (adult) + LA dose calculator — DRAFT from standard sources ---------- */
const RA_CHECKED = true;
const raDraft = () => RA_CHECKED ? "" : `<div class="warn" style="margin-top:0">DRAFT — from standard sources (NYSORA, ASRA, RA-UK), not yet ticked by you.</div>`;
const RSRC = "NYSORA / RA-UK Plan A blocks / ASRA.";
const LAD = {
  bupi:{n:"Bupi / levobupi", max:2, pmax:2.5, cap:150, concs:["0.25","0.5"]},
  ropi:{n:"Ropivacaine", max:3, pmax:3, cap:225, concs:["0.2","0.375","0.5","0.75"]},
  lido:{n:"Lignocaine plain", max:3, pmax:3, cap:200, concs:["1","2"]},
  lidoA:{n:"Lignocaine + adrenaline", max:7, pmax:7, cap:500, concs:["1","2"]}};
function laWeight(lt){
  if (lt==="p") return {w:W(), why:`paeds weight ${sig(W())} kg`};
  const x = wts(); return x.bmi >= 30 ? {w:x.lbw, why:`LBW ${sig(x.lbw)} kg (BMI ${sig(x.bmi)} ≥ 30)`} : {w:x.tbw, why:`actual weight ${sig(x.tbw)} kg`};
}
function laMaxMg(d, lt){ const {w} = laWeight(lt), D = LAD[d]; return Math.min((lt==="p"?D.pmax:D.max)*w, D.cap); }
const laKey = lt => lt==="p" ? "laP" : "laA";
function laAddBtn(lt, d, conc, ml, sides, label){
  const spec = esc(JSON.stringify({d, c:String(conc), ml:+sig(ml), bi:sides, l:label}));
  return `<button class="addla" data-addla="${spec}" data-lt="${lt}">+ Add ${sig(ml)} mL ${conc}%${sides===2?" × 2 sides":""} to LA calculator</button>`;
}
function laCalc(lt){
  const list = S[laKey(lt)] || [], D = LAD[S.laD] || LAD.bupi;
  if (!D.concs.includes(S.laC)) S.laC = D.concs[D.concs.length > 2 ? 1 : 0];
  const {why} = laWeight(lt);
  let total = 0;
  const rows = list.map((it,i) => { const mg = it.ml * it.bi * (+it.c) * 10, pct = mg / laMaxMg(it.d, lt) * 100; total += pct;
    return `<tr><td>${esc(it.l||LAD[it.d].n)}<div class="sub">${LAD[it.d].n} ${it.c}% · ${sig(it.ml)} mL${it.bi===2?" × 2":""}</div></td><td class="hl">${sig(mg)} mg</td><td class="hl">${Math.round(pct)}%</td><td><button class="rmla" data-rmla="${lt}:${i}" aria-label="Remove">×</button></td></tr>`; }).join("");
  const state = total > 100 ? "over" : total > 80 ? "near" : "ok";
  const maxLine = Object.entries(LAD).map(([k,v]) => `${v.n} ${sig(laMaxMg(k,lt))} mg`).join(" · ");
  return `<p class="sub">Max for this patient (${why}): ${maxLine}</p>
    <div class="sub">Add a block</div>${seg("laD",Object.entries(LAD).map(([k,v])=>[k,v.n]))}${seg("laC",D.concs.map(c=>[c,c+"%"]))}
    ${step("laMl","Volume","mL",1,60,1)}${seg("laBi",[["1","One side"],["2","Both sides"]])}
    <button class="homebtn" data-addla="form" data-lt="${lt}">+ Add ${S.laMl} mL ${D.n} ${S.laC}%${S.laBi==="2"?" × 2":""}</button>
    ${list.length ? `<div style="overflow-x:auto"><table><tr><th>Block</th><th>Dose</th><th>% max</th><th></th></tr>${rows}</table></div>` : `<p class="sub">No blocks added yet. Use the form above or the "+ Add" button on any block card.</p>`}
    <div class="meter ${state}"><span style="width:${Math.min(total,100)}%"></span></div>
    <div class="${state==="over"?"danger":state==="near"?"warn":"result"}" style="margin-top:var(--s2)"><b>Total: ${Math.round(total)}% of maximum</b>${state==="over"?" — ABOVE MAXIMUM. Reduce volume or concentration.":state==="near"?" — close to maximum.":""}</div>
    ${list.length?`<button class="linkbtn" data-clrla="${lt}">Clear list</button>`:""}
    <p class="sub">Different drugs combine as % of each one's own maximum. Doses apply to one sitting.</p>`;
}

/* block card builder */
function blk(o){
  const x = wts(), conc = o.anal ? 0.25 : 0.5, bi = o.bilat ? 2 : 1;
  const mgLo = o.vol[0]*conc*10*bi, mgHi = o.vol[1]*conc*10*bi, pct = mgHi / laMaxMg("bupi","a") * 100;
  return `<div class="card"><h2>${o.t}</h2>${raDraft()}

  <tr><th>Position &amp; probe</th><td>${o.pos}</td></tr>

  <tr><th>Needle</th><td>${o.needle}</td></tr>
  <tr><th>Drug &amp; volume</th><td><b>${o.vol[0]}–${o.vol[1]} mL${o.bilat?" per side":""}</b> bupi/levobupi <b>${conc}%</b> (${o.anal?"analgesia":"surgical"})<br>= ${sig(mgLo)}–${sig(mgHi)} mg${o.bilat?" both sides":""} · <span class="${pct>100?"bad":""}">${Math.round(pct)}% of max</span></td></tr>
  <tr><th>Cautions</th><td>${o.caut}</td></tr></table>
  ${laAddBtn("a","bupi",conc,o.vol[1],bi,o.t)}${src(RSRC)}</div>`;
}

/* ---------- ANTIBIOTIC PROPHYLAXIS (adult + paeds) — DRAFT: Malaysian NAG 2019 / ASHP-IDSA 2013 ---------- */
const ABX_CHECKED = false;
const abxDraft = () => ABX_CHECKED ? "" : `<div class="warn" style="margin-top:0">DRAFT — Malaysian National Antimicrobial Guideline 2019 / ASHP-IDSA 2013, not yet ticked by you. Follow local policy.</div>`;
// adult: fixed dose or per-kg; paeds: per kg with max (mg)
const ABX = {
  cefazolin:{n:"Cefazolin", a:w=>w>=120?"3 g":"2 g", p:[30,2000], re:"4 h"},
  cefuroxime:{n:"Cefuroxime", a:()=> "1.5 g", p:[50,1500], re:"4 h"},
  unasyn:{n:"Unasyn (ampicillin–sulbactam)", a:()=> "3 g", p:[75,3000], pnote:"50 mg/kg ampicillin component", re:"2 h"},
  augmentin:{n:"Augmentin IV (amoxicillin–clavulanate)", a:()=> "1.2 g", p:[30,1200], re:"2 h"},
  metronidazole:{n:"Metronidazole", a:()=> "500 mg", p:[15,500], re:"—"},
  gentamicin:{n:"Gentamicin", a:null, p:[2.5,null], re:"—"},
  clindamycin:{n:"Clindamycin", a:()=> "900 mg", p:[10,900], re:"6 h"},
  vancomycin:{n:"Vancomycin", a:null, p:[15,2000], re:"—", note:"infuse over ≥ 60 min, start 60–120 min before incision"},
  azithromycin:{n:"Azithromycin", a:()=> "500 mg", p:[10,500], re:"—"}};
function abxDose(k, paeds){
  const d = ABX[k];
  if (paeds){ const w = W(), mg = Math.min(d.p[0]*w, d.p[1] ?? Infinity); return `${sig(mg)} mg <span class="sub">(${d.p[0]} mg/kg${d.p[1]?`, max ${d.p[1]>=1000?d.p[1]/1000+" g":d.p[1]+" mg"}`:""}${d.pnote?`; ${d.pnote}`:""})</span>`; }
  const x = wts();
  if (k==="gentamicin"){ const dw = x.tbw > 1.2*x.ibwRaw ? x.adj : x.tbw; return `${sig(5*dw)} mg <span class="sub">(5 mg/kg ${x.tbw > 1.2*x.ibwRaw ? "AdjBW" : "TBW"} ${sig(dw)} kg)</span>`; }
  if (k==="vancomycin"){ return `${sig(Math.min(15*x.tbw,2000))} mg <span class="sub">(15 mg/kg TBW, max 2 g)</span>`; }
  return d.a(x.tbw);
}
const ABX_SP = {
  general:{n:"General / upper GI", first:[["cefazolin"]], allergy:[["clindamycin","gentamicin"]], note:"Low-risk laparoscopic procedures may need none."},
  hpb:{n:"HPB / biliary", first:[["cefazolin"],["unasyn"]], allergy:[["clindamycin","gentamicin"]], note:"Low-risk elective lap chole: none. Biliary obstruction, stents, Whipple: add metronidazole or use Unasyn."},
  colorectal:{n:"Colorectal / appendix", first:[["cefazolin","metronidazole"],["unasyn"]], allergy:[["clindamycin","gentamicin"],["metronidazole","gentamicin"]], note:"Perforation / peritonitis = treatment course, not prophylaxis."},
  uro:{n:"Urology", first:[["cefazolin"],["gentamicin"]], allergy:[["gentamicin"],["clindamycin","gentamicin"]], note:"Bowel opened (cystectomy, conduit): cefazolin + metronidazole. Treat a positive urine culture before surgery."},
  gynae:{n:"Gynae (hysterectomy)", first:[["cefazolin"]], allergy:[["clindamycin","gentamicin"]], note:"Add metronidazole if bowel involved or per local policy."},
  lscs:{n:"LSCS", first:[["cefazolin"]], allergy:[["clindamycin","gentamicin"]], note:"Give before incision. In labour or ruptured membranes: add azithromycin 500 mg."},
  ortho:{n:"Ortho", first:[["cefazolin"]], allergy:[["vancomycin"],["clindamycin"]], note:"MRSA colonised: add vancomycin. Open fracture: start ASAP; add gentamicin for type III. Arthroplasty: may continue ≤ 24 h."},
  dental:{n:"Dental / maxfax / head & neck", first:[["cefazolin","metronidazole"],["unasyn"],["augmentin"]], allergy:[["clindamycin"]], note:"Clean-contaminated (mucosa breached). Routine dental extraction or clean neck surgery (thyroid, parotid): usually none."},
  clean:{n:"Clean (hernia, breast)", first:[["cefazolin"]], allergy:[["clindamycin"],["vancomycin"]], note:"Without mesh or implant and low risk: usually none."},
  nvc:{n:"Neuro / vascular / cardiac", first:[["cefazolin"],["cefuroxime"]], allergy:[["vancomycin"],["clindamycin"]], note:"MRSA colonised: add vancomycin."}};
function abxCard(paeds){
  if (!ABX_SP[S.abxSp]) S.abxSp = "general";
  const sp = ABX_SP[S.abxSp];
  const opt = list => list.map((combo,i) => `<div class="abxopt">${i?`<span class="or">or</span>`:""}${combo.map(k=>`<div class="abxrow"><span>${ABX[k].n}</span><b>${abxDose(k,paeds)}</b></div>`).join("")}</div>`).join("");
  const used = [...new Set([...sp.first.flat(), ...sp.allergy.flat()])];
  const extra = S.abxSp==="lscs" ? `<div class="abxrow"><span>+ Azithromycin (labour / ROM)</span><b>${abxDose("azithromycin",paeds)}</b></div>` : "";
  return `${seg("abxSp", Object.entries(ABX_SP).map(([k,v])=>[k,v.n]))}
    <h3>First-line</h3>${opt(sp.first)}${extra}
    <h3>Penicillin allergy</h3>${opt(sp.allergy)}
    <div class="warn">${sp.note}</div>
    <h3>Timing</h3><ul><li>IV within <b>60 min before incision</b> (vancomycin: start 60–120 min before)</li>
      <li>Redose: ${used.filter(k=>ABX[k].re!=="—").map(k=>`${ABX[k].n.split(" (")[0]} every ${ABX[k].re}`).join(" · ") || "single dose"}; and after blood loss &gt; ${paeds?"25 mL/kg":"1.5 L"}</li>
      <li>Stop within 24 h (most cases: single dose)</li></ul>
    <details class="endo"><summary>Endocarditis prophylaxis (high-risk cardiac only)</summary>
      <p class="sub">Prosthetic valve, previous endocarditis, some congenital heart disease — for dental work breaching gingiva.</p>
      <table><tr><td>Amoxicillin PO</td><td class="hl">${paeds?`${sig(Math.min(50*W(),2000))} mg (50 mg/kg)`:"2 g"}</td></tr>
      <tr><td>Ampicillin IV</td><td class="hl">${paeds?`${sig(Math.min(50*W(),2000))} mg (50 mg/kg)`:"2 g"}</td></tr>
      <tr><td>Cefazolin IV (allergy, not anaphylaxis)</td><td class="hl">${paeds?`${sig(Math.min(50*W(),1000))} mg (50 mg/kg)`:"1 g"}</td></tr>
      <tr><td>Azithromycin (severe allergy)</td><td class="hl">${paeds?`${sig(Math.min(15*W(),500))} mg (15 mg/kg)`:"500 mg"}</td></tr></table>
      <p class="sub">30–60 min before. AHA 2021 (clindamycin no longer recommended).</p></details>
    ${src("Malaysian National Antimicrobial Guideline 2019; ASHP/IDSA/SIS/SHEA 2013; AHA 2021 (draft).")}`;
}

/* ---------- ANONYMOUS CASES (phone only, 36 h) ---------- */
const CASE_TTL = 36*3600*1000, CASE_MAX = 6;
function validCase(c){ return c && typeof c==="object" && /^\d{1,16}$/.test(String(c.id)) && /^Case [1-6]$/.test(c.label) && (c.sex==="F"||c.sex==="M")
  && Number.isFinite(c.y) && c.y>=0 && c.y<=100 && Number.isFinite(c.m) && c.m>=0 && c.m<=11 && Number.isFinite(c.h) && c.h>=30 && c.h<=210
  && Number.isFinite(c.w) && c.w>=0.4 && c.w<=250 && Number.isFinite(c.created) && typeof (c.nick||"")==="string" && (c.nick||"").length<=12; }
function getCases(){ const now = Date.now(); let all = store.get("cases",[]); if (!Array.isArray(all)) all = []; const live = all.filter(c => validCase(c) && now - c.created < CASE_TTL && c.created <= now + 60000); if (live.length !== all.length) store.set("cases", live); return live; }
const caseName = c => c.nick ? `${esc(c.label)} · ${esc(c.nick)}` : esc(c.label);
const caseAge = c => c.y < 1 ? `${c.m} m` : c.y < 16 && c.m ? `${c.y} y ${c.m} m` : `${c.y} y`;
const caseLine = c => `${c.sex==="F"?"♀":"♂"} ${sig(c.w)} kg · ${c.h} cm · ${caseAge(c)}`;
function activeCase(){ const id = store.get("active", null); return getCases().find(c => c.id === id) || null; }
function applyCase(c){
  ["sex","height","aw","age","morWt"].forEach(k=>S.touched[k]=true); if (c.y<16) ["pw","pY","pM"].forEach(k=>S.touched[k]=true); if (c.sex==="F") S.touched.spHt=true;
  S.sex = c.sex; S.height = c.h; S.aw = c.w; S.age = Math.max(16, c.y); S.morWt = c.w;
  if (c.y < 16){ S.pw = c.w; S.pY = c.y; S.pM = c.m; S.pHt = c.h; }
  if (c.sex === "F") S.spHt = Math.min(200, Math.max(140, c.h));
}
const SAMPLE_BY = {emerg:{adult:["aw"], paeds:["pw","pY"]}, ga:{"*":["height","aw"]}, regional:{"*":["height","aw"]}, paeds:{"*":["pw","pY"]}, obs:{lscs:["spHt"], post:["morWt"]}};
function sampleWarn(keys){ const k = keys.filter(isSample); if (!k.length) return "";
  const names = {height:"height", aw:"weight", pw:"weight", pY:"age", spHt:"height", morWt:"weight"};
  return `<div class="samplewarn"><b>Sample values</b> — ${[...new Set(k.map(x=>names[x]))].join(" and ")} not entered. Enter the patient or tap a case.</div>`; }
function activeBar(){ const c = activeCase(); return c ? `<button class="activebar" data-go="cases"><span>Active: <b>${caseName(c)}</b> · ${caseLine(c)}</span><span class="sub">change ›</span></button>` : ""; }
function caseStrip(){
  const cs = getCases(), act = store.get("active", null);
  return `<div class="label">Today's list</div><div class="chips">${cs.map(c => `<button class="chip ${c.id===act?"on":""}" data-case="${c.id}">${caseName(c)} · ${c.sex==="F"?"♀":"♂"} ${sig(c.w)} kg</button>`).join("")}
    ${cs.length < CASE_MAX ? `<button class="chip add" data-go="cases">+ Add case</button>` : ""}${cs.length ? `<button class="chip ghost" data-go="cases">Edit</button>` : ""}</div>`;
}
screens.cases = () => {
  const cs = getCases(), act = store.get("active", null), now = Date.now();
  const list = cs.length ? cs.map(c => { const left = Math.max(0, Math.round((CASE_TTL - (now - c.created))/3600000));
    return `<div class="card casecard ${c.id===act?"on":""}"><div><b>${caseName(c)}</b>${c.id===act?` <span class="pill">active</span>`:""}<div class="sub">${caseLine(c)} · deletes in ${left} h</div></div>
      <div class="caseact"><button class="iconbtn" data-case="${c.id}">${c.id===act?"✓ In use":"Use"}</button><button class="iconbtn" data-delcase="${c.id}" aria-label="Delete">Delete</button></div></div>`; }).join("")
    : `<p class="sub">No cases yet.</p>`;
  const form = cs.length >= CASE_MAX ? `<p class="sub">Maximum ${CASE_MAX} cases. Delete one to add another.</p>` : `<div class="card"><h2>Add case ${cs.length+1}</h2>
    <label class="sub" for="cNick">Nickname (optional, max 12)</label>
    <input id="cNick" class="search" style="padding-left:12px" maxlength="12" autocomplete="off" placeholder="e.g. Bed 4, LSCS am" value="${esc(S.cNick||"")}">
    <div class="warn">No names, IC or MRN — anonymous only.</div>
    ${seg("cSex",[["F","♀ Female"],["M","♂ Male"]])}${step("cY","Age","y",0,100,1)}${S.cY<16?step("cM","+ months","m",0,11,1):""}${step("cH","Height","cm",30,210,1)}${step("cW","Weight","kg",0.5,250,0.5)}
    <button class="homebtn primary" data-savecase="1">Save case</button></div>`;
  return head("Today's list","home") + `<p class="sub">Saved on this phone only. Each case deletes itself 36 h after it is added.</p>` + list + form + disc;
};
screens.values = () => {
  const ticks = store.get("ticks",{});
  let i=0, total=0, done=0;
  const body = VALUES.map(([sec,items]) => `<div class="card vs"><h2>${sec}</h2>${items.map(t=>{const id="v"+(i++); total++; if(ticks[id])done++;
    return `<label><input type="checkbox" data-tick="${id}" ${ticks[id]?"checked":""}><span>${esc(t)}</span></label>`;}).join("")}</div>`).join("");
  return head("Values sheet","home") + `<div class="card"><p>Tick each line you agree with. Tell Claude about anything that needs changing.
    When everything is ticked, tell Claude and the DRAFT banner will be replaced by the check date.</p>
    <p class="sub">Ticked: <b>${done} / ${total}</b> (saved on this phone only)</p></div>` + body + disc;
};

function accordion(c, t, gid, label){
  const cl = c.cloneNode(true), h = cl.querySelector("h2"), sum = label ? esc(label) : h.innerHTML; h.remove();
  const mm = sum.match(/^([A-C]?\d+[a-z]?)\.\s+(.*)$/s);
  const summ = mm ? `<span class="stepno">${mm[1]}</span><span class="st">${mm[2]}</span>` : `<span class="st">${sum}</span>`;
  return `<details class="card acc" name="acc" data-t="${esc(t)}" data-g="${gid}"><summary>${summ}</summary>${cl.innerHTML}</details>`;
}
function groupScreen(g){
  const m = cardMap();
  const acc = list => list.map(it => { const [o,l] = Array.isArray(it) ? it : [it,it];
    return m[o] ? accordion(m[o], l, g.id, l!==o ? l : null) : `<div class="danger">Missing card: ${esc(o)}</div>`; }).join("");
  if (g.tabs){
    const tab = g.tabs.find(t=>t.id===S[g.tabKey]) || g.tabs[0];
    const ab = activeBar() + sampleWarn(SAMPLE_BY[g.id] ? (SAMPLE_BY[g.id][tab.id] || SAMPLE_BY[g.id]["*"] || []) : []);
    const links = (tab.links||[]).map(([t,tb,label])=>`<button class="emlink" data-open="${esc(t)}" data-g="emerg" data-tab="${tb}">⚠ ${esc(label)} → Emergencies</button>`).join("");
    return head(g.name,"home",g.id) + ab + (g.tabs.length>1 ? `<div class="seg emtabs${g.tabs.length>=5?" five":""}">${g.tabs.map(t=>`<button aria-pressed="${t===tab}" data-seg="${g.tabKey}" data-val="${t.id}">${t.label}</button>`).join("")}</div>` : `<div class="label" style="margin-top:0">${tab.label}</div>`) +
      (tab.input ? `<div class="card">${tab.input()}</div>` : "") + (tab.top ? tab.top() : "") +
      (tab.cards.length ? `<div class="hint">${tab.hint || "Tap a heading to open it."}</div>` + acc(tab.cards) : "") +
      (links ? `<div class="card emlinks"><div class="sub">If it goes wrong</div>${links}</div>` : "") + disc;
  }
  return head(g.name,"home",g.id) + (g.calc ? g.calc() : "") + (g.weight ? `<div class="card">${pInputs()}</div>` : "") +
    (g.cards.length?`<div class="hint">Tap a heading to open it.</div>`:"") + acc(g.cards) + disc;
}
function searchIndex(){
  if (searchIndex.cache) return searchIndex.cache;
  const m = cardMap(), idx = [], seen = {};
  const order = GROUPS.filter(g=>g.id!=="emerg").concat(GROUPS.filter(g=>g.id==="emerg"));
  for (const g of order){
    if (CALC_TITLES[g.id]) idx.push({t:CALC_TITLES[g.id], g:g.id, calc:true, tab:g.id==="regional"?"neuraxial":(g.tabs?g.tabs[0].id:null), text:(CALC_TITLES[g.id]+" "+CALC_KW[g.id]).toLowerCase()});
    const lists = g.tabs ? g.tabs.map(t=>[t.id,t.cards]) : [[null,g.cards]];
    for (const [tab,list] of lists) for (const it of list){ const [o,t] = Array.isArray(it) ? it : [it,it]; if (seen[t] || !m[o]) continue; seen[t]=1; idx.push({t, g:g.id, tab, text:(t+" "+o+" "+m[o].textContent+" "+(SEARCH_EXTRA[t]||"")+(g.id==="emerg"?" emergency crisis":"")).toLowerCase()}); }
  }
  return (searchIndex.cache = idx);
}
function runSearch(q){
  const el = $("#results"); if (!el) return;
  q = q.trim().toLowerCase(); if (!q){ el.innerHTML = ""; return; }
  const words = q.split(/\s+/);
  const hits = searchIndex().map(e => ({e, score: words.every(w=>e.text.includes(w)) ? (words.every(w=>e.t.toLowerCase().includes(w))?2:1) : 0}))
    .filter(x=>x.score).sort((a,b)=>b.score-a.score).slice(0,12);
  el.innerHTML = hits.length ? hits.map(({e})=>`<button class="hit" data-open="${esc(e.t)}" data-g="${e.g}" ${e.tab?`data-tab="${e.tab}"`:""} ${e.calc?'data-calc="1"':""}>${esc(e.t)}<small>${(()=>{const g=GROUPS.find(g=>g.id===e.g), tb=g.tabs&&e.tab?g.tabs.find(t=>t.id===e.tab):null; return esc(g.name+(tb?" › "+tb.label:""));})()}</small></button>`).join("")
    : `<div class="sub" style="padding:6px">No card matches "${esc(q)}".</div>`;
}
function remember(g, t){ const r = store.get("recent",[]).filter(x=>x.t!==t); r.unshift({g,t}); store.set("recent", r.slice(0,5)); }

function render(){
  let h = (location.hash||"#home").slice(1);
  if (h==="ett"||h==="g-airway") h="g-ga"; if (h==="spinal"||h==="g-spinal") h="g-regional";
  let html;
  if (h.startsWith("g-")){ const g = GROUPS.find(x=>x.id===h.slice(2)); html = g ? groupScreen(g) : screens.home(); }
  else html = (screens[h]||screens.home)();
  const app = $("#app"), active = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.in : null;
  const y = window.scrollY;
  app.dataset.group = h.startsWith("g-") ? h.slice(2) : "";
  app.innerHTML = html;
  if (S.open){ const d = app.querySelector(`details[data-t="${CSS.escape(S.open)}"]`); if (d){ d.open = true; if (S.scrollTo){ d.scrollIntoView({block:"start"}); } } }
  if (!S.scrollTo) window.scrollTo(0, y);
  S.scrollTo = false;
  if (active){ const el = app.querySelector(`[data-in="${active}"]`); if (el){ el.focus(); const v=el.value; el.value=""; el.value=v; } }
}
document.addEventListener("toggle", e => {
  const d = e.target; if (!d.matches || !d.matches("details.acc")) return;
  if (d.open){ S.open = d.dataset.t; remember(d.dataset.g, d.dataset.t);
    document.querySelectorAll("details.acc[open]").forEach(o => { if (o!==d) o.open = false; }); }
  else if (S.open === d.dataset.t) S.open = null;
}, true);
document.addEventListener("input", e => { if (e.target.id==="q") runSearch(e.target.value); if (e.target.id==="cNick") S.cNick = e.target.value.slice(0,12); if (e.target.id==="dname") S.dname = e.target.value.slice(0,24); });
function clamp(v,min,max){ return Math.min(max, Math.max(min, v)); }
document.addEventListener("click", e => {
  const b = e.target.closest("button, input[type=checkbox]"); if (!b) return;
  const d = b.dataset;
  if (d.open){ const og = GROUPS.find(x=>x.id===d.g); if (og && og.tabs) S[og.tabKey] = d.tab || (og.tabs.find(t=>t.cards.some(c=>(Array.isArray(c)?c[1]:c)===d.open))||og.tabs[0]).id;
    S.open = d.calc ? null : d.open; S.scrollTo = !d.calc; if (!d.calc) remember(d.g, d.open);
    const target = "#g-"+d.g; if (location.hash===target) render(); else { location.hash = target; } if (d.calc) window.scrollTo(0,0); return; }
  if (d.lscs){ S.spOp="lscs"; S.open=null; location.hash="#g-spinal"; window.scrollTo(0,0); return; }
  if (d.go){ S.open = null; location.hash = "#"+d.go; window.scrollTo(0,0); return; }
  if (d.savename){ const v = cleanName(S.dname ?? doctorName()); store.set("doctor", v || "Dr X"); S.dname = undefined; location.hash = "#home"; return; }
  if (d.case){ const c = getCases().find(x=>x.id===d.case); if (c){ store.set("active", c.id); applyCase(c); } if ((location.hash||"#home")==="#cases") render(); else render(); return; }
  if (d.delcase){ const cs = getCases().filter(x=>x.id!==d.delcase); store.set("cases", cs); if (store.get("active",null)===d.delcase) store.set("active", null); render(); return; }
  if (d.savecase){ const cs = getCases(); if (cs.length >= CASE_MAX) return;
    const used = cs.map(c=>+c.label.replace("Case ","")); let n = 1; while (used.includes(n)) n++;
    const nick = (S.cNick||"").trim().slice(0,12);
    const c = {id: String(Date.now()), label: "Case "+n, nick, sex:S.cSex, y:+S.cY, m:+S.cY<16?+S.cM:0, h:+S.cH, w:+S.cW, created: Date.now()};
    cs.push(c); store.set("cases", cs); store.set("active", c.id); applyCase(c); S.cNick = ""; render(); return; }
  if (d.addla){ const lt = d.lt, k = laKey(lt); S[k] = S[k] || [];
    const it = d.addla==="form" ? {d:S.laD, c:S.laC, ml:+S.laMl, bi:+S.laBi, l:LAD[S.laD].n} : JSON.parse(d.addla);
    S[k].push(it); b.textContent = "✓ Added"; setTimeout(render, 350); return; }
  if (d.rmla){ const [lt,i] = d.rmla.split(":"); S[laKey(lt)].splice(+i,1); render(); return; }
  if (d.clrla){ S[laKey(d.clrla)] = []; render(); return; }
  if (d.apf!==undefined){ S.apfel = (S.apfel||0) ^ (1<<(+d.apf)); render(); return; }
  if (d.goTab){ const [gid,tid] = d.goTab.split(":"); const og = GROUPS.find(x=>x.id===gid); if (og) S[og.tabKey]=tid; S.open=null; const tg="#g-"+gid; if (location.hash===tg) render(); else location.hash=tg; window.scrollTo(0,0); return; }
  if (d.setw){ S.pw = parseFloat(d.setw); render(); return; }
  if (d.seg){ S.touched[d.seg]=true; S[d.seg] = d.val; render(); return; }
  if (d.step){ S.touched[d.step]=true; const k=d.step, st=parseFloat(d.d); let v=parseFloat(S[k])||0; v=clamp(Math.round((v+st)*10)/10, +d.min, +d.max); S[k]=v; render(); return; }
  if (d.tick!==undefined){ const t=store.get("ticks",{}); t[d.tick]=b.checked; store.set("ticks",t); render(); return; }
  if (b.hasAttribute("data-theme-toggle")){ const cur=store.get("theme","auto"); const nxt = cur==="auto"?"dark":cur==="dark"?"light":"auto"; store.set("theme",nxt); applyTheme(); render(); }
});
document.addEventListener("change", e => {
  const el = e.target; if (!el.dataset || !el.dataset.in) return;
  const k = el.dataset.in; S.touched[k]=true; let v = parseFloat(el.value.replace(",", "."));
  if (isNaN(v)) v = S[k];
  S[k] = clamp(v, +el.dataset.min, +el.dataset.max); render();
});
function applyTheme(){ const t=store.get("theme","auto"); if (t==="auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", t); }
window.addEventListener("hashchange", render);
applyTheme(); { const c = activeCase(); if (c) applyCase(c); } render();
if ("serviceWorker" in navigator && (location.protocol==="https:" || location.hostname==="localhost" || location.hostname==="127.0.0.1")) {
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register("sw.js").catch(()=>{});
  navigator.serviceWorker.addEventListener("controllerchange", () => { if (!hadController || document.getElementById("updbar")) return;
    const bar = document.createElement("button"); bar.id = "updbar"; bar.className = "updbar"; bar.textContent = "Update downloaded — tap to load the new version";
    bar.addEventListener("click", () => location.reload()); document.body.appendChild(bar); });
}
</script>
