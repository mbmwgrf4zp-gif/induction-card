/* Layout: one phone-width column; home = list of section tiles, each section has its own hue. */
:root{
  /* type scale (6 steps) */
  --fs-xs:.8125rem; --fs-sm:.875rem; --fs-body:.9375rem; --fs-base:1rem; --fs-md:1.0625rem; --fs-lg:1.25rem; --fs-xl:1.5rem; --big:clamp(2rem,9vw,2.75rem);
  /* spacing & radius */
  --font-sans:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; --font-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --mon-bg:#0b1517; --mon-ink:#e6f1ef; --mon-muted:#8fa7a3; --mon-grid:rgba(255,255,255,.06); --etco2:#facc15;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --r-sm:10px; --r:14px;
  /* neutrals (slight teal bias) */
  --bg:#f3f6f6; --card:#ffffff; --ink:#14201f; --muted:#5a6866; --line:#dbe3e2; --field:#f3f6f6;
  --accent:#0f766e; --accent-ink:#ffffff; --accent-soft:#e3f3f1; --on:#ffffff;
  --warn-bg:#fff6dc; --warn-ink:#7a4b00; --warn-line:#efc35a; --rt-bg:#eef2f4; --rt-ink:#334155; --rt-line:#cbd5e1;
  --danger-bg:#fde9e9; --danger-ink:#9b1c1c; --danger-line:#f0a3a3;
  --unv-bg:#edf0f2; --unv-ink:#4b5563;
  --emerg-solid:#b42318;
  /* section hues */
  --g-emerg:#b42318; --g-emerg-soft:#fde9e9;
  --g-obs:#be185d;   --g-obs-soft:#fce7f3;
  --g-tx:#6d28d9;    --g-tx-soft:#ede9fe;
  --g-premed:#1d4ed8; --g-premed-soft:#dbeafe;
  --g-paeds:#15803d; --g-paeds-soft:#dcfce7;
  --g-spinal:#0e7490; --g-spinal-soft:#cffafe;
  --g-airway:#b45309; --g-airway-soft:#fef3c7;
  --g-values:#5a6866; --g-values-soft:#eceff0;
  --dim:#e3e7e8; --dim2:#eceff0;
  --gc:var(--accent); --gc-soft:var(--accent-soft);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1514; --card:#162120; --ink:#e4eeec; --muted:#9db0ad; --line:#2a3836; --field:#0e1514;
    --accent:#2dd4bf; --accent-ink:#04201c; --accent-soft:#11302c; --on:#0e1514;
    --warn-bg:#2e2410; --warn-ink:#f5cf7a; --warn-line:#6b5420; --rt-bg:#1e293b; --rt-ink:#e2e8f0; --rt-line:#475569;
    --danger-bg:#3a1414; --danger-ink:#ffb4b4; --danger-line:#7a2a2a;
    --unv-bg:#1f2a29; --unv-ink:#a8b8b5;
    --g-emerg:#ff9b93; --g-emerg-soft:#3a1414;
    --g-obs:#f472b6;   --g-obs-soft:#3a1028;
  --g-tx:#a78bfa;    --g-tx-soft:#251a40;
  --g-premed:#60a5fa; --g-premed-soft:#14233f;
    --g-paeds:#4ade80; --g-paeds-soft:#0c2e1a;
    --g-spinal:#22d3ee; --g-spinal-soft:#08303a;
    --g-airway:#fbbf24; --g-airway-soft:#3a2a06;
    --g-values:#9db0ad; --g-values-soft:#1f2a29;
    --dim:#24302f; --dim2:#1d2827;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1514; --card:#162120; --ink:#e4eeec; --muted:#9db0ad; --line:#2a3836; --field:#0e1514;
  --accent:#2dd4bf; --accent-ink:#04201c; --accent-soft:#11302c; --on:#0e1514;
  --warn-bg:#2e2410; --warn-ink:#f5cf7a; --warn-line:#6b5420; --rt-bg:#1e293b; --rt-ink:#e2e8f0; --rt-line:#475569;
  --danger-bg:#3a1414; --danger-ink:#ffb4b4; --danger-line:#7a2a2a;
  --unv-bg:#1f2a29; --unv-ink:#a8b8b5;
  --g-emerg:#ff9b93; --g-emerg-soft:#3a1414;
  --g-obs:#f472b6;   --g-obs-soft:#3a1028;
  --g-tx:#a78bfa;    --g-tx-soft:#251a40;
  --g-premed:#60a5fa; --g-premed-soft:#14233f;
  --g-paeds:#4ade80; --g-paeds-soft:#0c2e1a;
  --g-spinal:#22d3ee; --g-spinal-soft:#08303a;
  --g-airway:#fbbf24; --g-airway-soft:#3a2a06;
  --g-values:#9db0ad; --g-values-soft:#1f2a29;

}
[data-group="emerg"]{--gc:var(--g-emerg);--gc-soft:var(--g-emerg-soft)}
[data-group="obs"]{--gc:var(--g-obs);--gc-soft:var(--g-obs-soft)}
[data-group="tx"]{--gc:var(--g-tx);--gc-soft:var(--g-tx-soft)}
[data-group="paeds"]{--gc:var(--g-paeds);--gc-soft:var(--g-paeds-soft)}
[data-group="spinal"]{--gc:var(--g-spinal);--gc-soft:var(--g-spinal-soft)}
[data-group="airway"],[data-group="ga"]{--gc:var(--g-airway);--gc-soft:var(--g-airway-soft)}
[data-group="regional"]{--gc:var(--g-spinal);--gc-soft:var(--g-spinal-soft)}

*{box-sizing:border-box}
html{touch-action:manipulation}
button,input,select,summary,a,label{touch-action:manipulation}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:400 var(--fs-base)/1.5 var(--font-sans);-webkit-text-size-adjust:100%}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:640px;margin:0 auto;padding-block:0 var(--s5);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit}
p{margin:var(--s2) 0}
h1,h2,h3{text-wrap:balance}
:focus-visible{outline:3px solid var(--gc);outline-offset:2px}

/* header */
header{display:flex;align-items:center;gap:var(--s2);padding:var(--s3) 0}
header h1{font-size:var(--fs-lg);font-weight:700;margin:0;flex:1;display:flex;align-items:center;gap:var(--s2);line-height:1.2;min-width:0}
.hico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--gc-soft);color:var(--gc);flex:none}
.hico svg{width:22px;height:22px}
.iconbtn{background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);min-width:44px;height:44px;padding:0 var(--s3);cursor:pointer;font-size:var(--fs-sm);font-weight:600;white-space:nowrap}
.draft,.checked{border-radius:var(--r-sm);padding:var(--s2) var(--s3);font-size:var(--fs-xs);text-align:center;margin-bottom:var(--s3);line-height:1.35}
.draft{background:var(--danger-bg);color:var(--danger-ink);border:1px solid var(--danger-line);font-weight:700}
.checked{background:var(--accent-soft);color:var(--ink)}

/* home tiles */
.label{font-size:var(--fs-xs);font-weight:700;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin:var(--s4) 2px var(--s2)}
.tiles{display:grid;gap:var(--s2)}
.tile{--t:var(--accent);--t-soft:var(--accent-soft);display:flex;align-items:center;gap:var(--s3);width:100%;text-align:left;background:var(--card);
  border:1px solid var(--line);border-radius:var(--r);padding:var(--s3);cursor:pointer;color:var(--ink)}
.tile .ico{width:52px;height:52px;border-radius:var(--r);display:grid;place-items:center;background:var(--t-soft);color:var(--t);flex:none}
.tile .ico svg{width:30px;height:30px}
.tile .txt{flex:1;min-width:0}
.tile .tt{display:block;font-size:var(--fs-lg);font-weight:700;line-height:1.2}
.tile .ts{display:block;font-size:var(--fs-sm);color:var(--muted);margin-top:2px;line-height:1.35}
.tile .chev{color:var(--muted);font-size:var(--fs-xl);line-height:1}
.t-obs{--t:var(--g-obs);--t-soft:var(--g-obs-soft)} .t-paeds{--t:var(--g-paeds);--t-soft:var(--g-paeds-soft)}
.t-spinal,.t-regional{--t:var(--g-spinal);--t-soft:var(--g-spinal-soft)} .t-airway,.t-ga{--t:var(--g-airway);--t-soft:var(--g-airway-soft)}
.t-values{--t:var(--g-values);--t-soft:var(--g-values-soft)} .t-tx,.qbtn.t-tx,.sq.t-tx{--t:var(--g-tx);--t-soft:var(--g-tx-soft)} .t-premed,.sq.t-premed{--t:var(--g-premed);--t-soft:var(--g-premed-soft)}
.awtag{display:inline-block;font-size:.72em;font-weight:600;padding:0 .45em;margin-left:.3em;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.rt{display:inline-block;margin-left:.35em;padding:0 .4em;border-radius:4px;font-size:.78em;font-weight:700;letter-spacing:.02em;background:var(--rt-bg);color:var(--rt-ink);border:1px solid var(--rt-line);white-space:nowrap;vertical-align:1px}.rt.rtmiss{background:#b91c1c;color:#fff}
.txck{display:flex;flex-direction:column;gap:6px}.txci{display:flex;gap:10px;align-items:center;text-align:left;min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--card);color:var(--ink);font:inherit;font-size:var(--fs-sm);cursor:pointer}
.txci .box{flex:0 0 22px;height:22px;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center;font-weight:700;color:var(--on)}.txci.on .box{background:var(--gc);border-color:var(--gc)}.txci.on{color:var(--muted)}
.grid2 .sq:last-child:nth-child(odd){grid-column:1/-1}
@media (max-width:1099px){.grid2 .sq:last-child:nth-child(odd){display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:var(--s3);row-gap:0;align-items:center;padding:var(--s2) var(--s3)}
.grid2 .sq:last-child:nth-child(odd) .qi{grid-row:1/3;width:40px;height:40px}.grid2 .sq:last-child:nth-child(odd) .qi svg{width:24px;height:24px}
.grid2 .sq:last-child:nth-child(odd) .sqt{margin:0;align-self:end}.grid2 .sq:last-child:nth-child(odd) .sqs{align-self:start}}
.qbtn.t-obs,.sq.t-obs{--t:var(--g-obs);--t-soft:var(--g-obs-soft)} .qbtn.t-paeds,.sq.t-paeds{--t:var(--g-paeds);--t-soft:var(--g-paeds-soft)}
.qbtn.t-ga,.sq.t-ga{--t:var(--g-airway);--t-soft:var(--g-airway-soft)} .sq.t-regional{--t:var(--g-spinal);--t-soft:var(--g-spinal-soft)}
.tile.t-emerg{background:var(--emerg-solid);border-color:var(--emerg-solid);color:#fff}
.tile.t-emerg .ico{background:rgba(255,255,255,.16);color:#fff}
.tile.t-emerg .ts,.tile.t-emerg .chev{color:rgba(255,255,255,.88)}

/* search */
.searchbox{position:relative}
.searchbox svg{position:absolute;left:12px;top:14px;width:20px;height:20px;color:var(--muted)}
.search{width:100%;height:48px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:var(--fs-base);padding:0 var(--s3) 0 40px}
#results:not(:empty){margin-top:var(--s2);background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);padding:0 var(--s3)}
.hit{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:var(--s3) 0;font-weight:600;font-size:var(--fs-base);cursor:pointer}
.hit:last-child{border-bottom:0}
.hit small{display:block;color:var(--muted);font-weight:400;font-size:var(--fs-xs);margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:var(--s2)}
.chip{padding:var(--s2) var(--s3);border-radius:999px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:var(--fs-sm);font-weight:600;text-align:left}

/* generic buttons kept for in-card links */
.homebtn{display:block;box-sizing:border-box;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:var(--r-sm);
  padding:var(--s3);font-size:var(--fs-base);font-weight:700;cursor:pointer;margin:var(--s2) 0}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:var(--s4);margin:var(--s3) 0}
.card h2{font-size:var(--fs-md);font-weight:700;margin:0 0 var(--s2);line-height:1.3}
.card h3{font-size:var(--fs-sm);font-weight:700;color:var(--gc);margin:var(--s4) 0 var(--s1);letter-spacing:.01em}
.hint{font-size:var(--fs-sm);color:var(--muted);margin:var(--s4) 2px var(--s1)}

/* controls */
.seg{display:flex;gap:var(--s2);flex-wrap:wrap;margin:var(--s2) 0 var(--s3)}
.seg button{flex:1 1 auto;min-height:44px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--card);cursor:pointer;padding:0 var(--s3);font-size:var(--fs-sm);font-weight:600}
.seg button[aria-pressed="true"]{background:var(--gc);color:var(--on);border-color:var(--gc);font-weight:700}
.emtabs{margin-top:0;flex-wrap:nowrap}
.emtabs button{flex:1 1 0;padding:0 var(--s1);min-width:0}
.emtabs button{min-height:48px;font-size:var(--fs-base)}
.emtabs.six{flex-wrap:wrap}@media (min-width:700px){.emtabs.six{flex-wrap:nowrap}.emtabs.five.six button{flex:1 1 0}}.emtabs.five.six button{flex:1 1 30%;font-size:var(--fs-sm);padding:0 var(--s1)}.acchead{margin:var(--s4) 2px var(--s1)}.rellink{display:block;width:calc(100% - 2*var(--s4));box-sizing:border-box;text-align:left;margin-top:var(--s3);padding:var(--s2) var(--s3);border:1px dashed var(--line);border-radius:var(--r-sm);background:none;color:var(--muted);font:inherit;font-size:var(--fs-sm);font-weight:600;cursor:pointer}.emtabs.five{gap:4px}.emtabs.five button{font-size:var(--fs-xs);padding:0 2px;letter-spacing:-.01em}
.step{display:flex;align-items:center;gap:var(--s2);margin:var(--s2) 0}
.step label{flex:1;font-weight:600;font-size:var(--fs-base);min-width:0}
.step button{width:48px;height:48px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--card);font-size:var(--fs-xl);line-height:1;cursor:pointer}
.step input{font-family:var(--font-mono);width:80px;height:48px;text-align:center;font-size:var(--fs-lg);font-weight:700;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--field);color:var(--ink);font-variant-numeric:tabular-nums}
.step .unit{width:30px;color:var(--muted);font-size:var(--fs-sm)}

/* results */
.result{background:var(--gc-soft);border-radius:var(--r);padding:var(--s4);margin:var(--s3) 0}
.big{font-family:'DSEG7',var(--font-mono);font-size:calc(var(--big)*.92);font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:var(--fs-sm);line-height:1.4}
.row{display:flex;gap:var(--s4);flex-wrap:wrap}
.row>div{flex:1 1 140px;min-width:0}
.trio{display:flex;gap:var(--s2);margin-top:var(--s2)}
.trio span{flex:1;text-align:center;border:1px solid var(--line);border-radius:var(--r-sm);padding:var(--s1) 0;background:var(--card);color:var(--muted);font-size:var(--fs-sm);font-variant-numeric:tabular-nums}
.trio span.main{border:2px solid var(--gc);color:var(--ink);font-weight:800}
.src{color:var(--muted);font-size:var(--fs-xs);margin-top:var(--s3);line-height:1.4}
.warn,.danger,.unv{border-radius:var(--r-sm);padding:var(--s2) var(--s3);margin:var(--s2) 0;font-size:var(--fs-sm);line-height:1.45}
.warn{background:var(--warn-bg);color:var(--warn-ink);border:1px solid var(--warn-line)}
.danger{background:var(--danger-bg);color:var(--danger-ink);border:1px solid var(--danger-line);font-weight:400}
.unv{background:var(--unv-bg);color:var(--unv-ink);border:1px dashed var(--line)}
.unv b{letter-spacing:.03em}

/* tables & lists */
table{width:100%;border-collapse:collapse;font-size:var(--fs-body);line-height:1.4}
.card ul:not(.crisis) li,.card ol:not(.crisis) li{font-size:var(--fs-body);line-height:1.45}
th,td{border-bottom:1px solid var(--line);padding:var(--s2) var(--s1);text-align:left;vertical-align:top;font-variant-numeric:tabular-nums}
th{color:var(--muted);font-weight:600}
td.hl{font-weight:700}
.mono,.trio span{font-family:var(--font-mono)}
tr.hl td{background:var(--gc-soft);font-weight:700}
ol,ul{margin:var(--s1) 0;padding-left:22px}
li{margin:var(--s1) 0}

/* accordion */
details.acc{padding:0;margin:var(--s2) 0}
details.acc>summary{list-style:none;cursor:pointer;padding:var(--s3) var(--s4);font-weight:700;font-size:var(--fs-md);display:flex;align-items:center;gap:var(--s3);min-height:52px;line-height:1.3}

function tickerInit(){

  fast:[26,"h3q2-3 4 0h2l1 2 2-14 2 16 1-4h3q3-5 6 0h1"], peaked:[40,"h8q2-2 4 0h3l1 2 2-16 2 18 1-4h3l3-14 3 14h6"]};
const ECG_OF = {premed:"sinus", ga:"sinus", regional:"slow", paeds:"fast", obs:"sinus", tx:"peaked"};
function ecgStrip(id){ const one = (w, cls) => { const [bw, seg] = ECG_BEAT[ECG_OF[id]];
    const ctg = id === "obs" ? `<path class="ectg" d="M0 31q${w/24} -3 ${w/12} 0${` t${w/12} 0`.repeat(11)}"/>` : "";
    return `<svg class="es ${cls}" viewBox="0 0 ${w} 34" preserveAspectRatio="none" aria-hidden="true"><path d="M0 22${seg.repeat(Math.ceil(w/bw)+1)}"/>${ctg}</svg>`; };
  return one(120, "cm-n") + one(240, "cm-w"); }
const secCounts = g => [g.tabs.length, g.tabs.reduce((a,t) => a + t.cards.filter(c => !(typeof c === "string" && c[0] === "§")).length, 0)];
const FLOW_LEV = {premed:14, ga:22, regional:42, paeds:30, obs:52, tx:64};
function secTile(g, style, tag){ style = style || tileStyle(); tag = tag || "button";
  const act = tag === "button" ? ` data-go="g-${g.id}"` : "", t = `<span class="sqt">${SEC_SHORT[g.id]}</span><span class="sqs">${secSub(g)}</span>`;
  if (style === "monitor") return `<${tag} class="sq mon t-${g.id}"${act}><span class="mhd"><span class="mch">${MON_CH[g.id]}</span><span class="mic">${svg(g.id)}</span></span>${monWave(g.id)}${t}</${tag}>`;
  const i = SEC_ORDER.indexOf(g.id);
  if (style === "ecg") return `<${tag} class="sq sty ecgp t-${g.id}"${act}><span class="chd"><span>II</span><span>25 mm/s · 10 mm/mV</span></span>${ecgStrip(g.id)}${t}</${tag}>`;
  if (style === "pump"){ const [tb, cd] = secCounts(g), mx = Math.max(...SEC_ORDER.map(id => secCounts(GROUPS.find(x => x.id === id))[1]));
    return `<${tag} class="sq sty pump t-${g.id}"${act}><span class="pscr"><span class="ptop"><span>CH ${i+1}</span><span>▮▮▮▯ 100%</span></span><span class="pnm">▶ ${SEC_SHORT[g.id]}</span><span class="prt">${tb} tabs · ${cd} cards</span><span class="pbar"><i style="width:${Math.round(cd/mx*100)}%"></i></span></span><span class="pbt"><em></em><b></b><b></b><b></b></span><span class="sqs">${secSub(g)}</span></${tag}>`; }
  if (style === "flow") return `<${tag} class="sq sty flow t-${g.id}"${act}><span class="ftube" aria-hidden="true">${[10,23,36,49,62,75,88].map(y => `<b style="top:${y}%"></b>`).join("")}<i class="fbob" style="top:${FLOW_LEV[g.id]}%;--fd:${(2.6 + i*0.45).toFixed(2)}s"></i></span><span class="finfo"><span class="fic">${svg(g.id)}</span>${t}<span class="flab">${MON_CH[g.id]}</span></span></${tag}>`;
  if (style === "editorial") return `<${tag} class="sq sty ed t-${g.id}"${act}><span class="enum">0${i+1}</span><span class="ebar"></span>${t}</${tag}>`;
  if (style === "chart") return `<${tag} class="sq chart t-${g.id}"${act}><span class="chd"><span>08:00</span><span>08:15</span><span>08:30</span></span>${chartMarks(g.id)}${t}</${tag}>`;
  return `<${tag} class="sq t-${g.id}"${act}><span class="qi">${svg(g.id)}</span>${t}</${tag}>`; }

setInterval(() => { const c = document.getElementById("clock"); if (c){ c.textContent = clockTxt(); seg1(c.parentElement); } }, 30000);

/* ---------- ETT ---------- */
const ettCalc = (adultOnly, noInputs) => {
  if (adultOnly) S.ettMode = "adult";
  let inputs = adultOnly ? "" : seg("ettMode",[["adult","Adult"],["child","Child / infant / neonate"]]);
  let out = "";
  if (S.ettMode==="adult"){
    inputs += seg("sex",[["F",sxi("F")+" Female"],["M",sxi("M")+" Male"]]) + step("height","Height","cm",130,210,1);
    const h = S.height, depth = r05(4 + h/10);
    const sz = S.sex==="F" ? ["6.0","6.5 – 7.0","7.5"] : ["6.5","7.0 – 7.5","8.0"];
    out = `<div class="result"><div class="row">
      <div><div class="sub">Tube ID (mm)</div><div class="big">${sz[1]}</div>${trio(sz[0],sz[1],sz[2])}</div>
      <div><div class="sub">Oral depth at mouth corner</div><div class="big">${f1(depth)} cm</div>
        <div class="sub">4 + height/10 = 4 + ${h}/10</div></div></div>
      <div class="sub" style="margin-top:8px">Western 21/23 rule would give ${S.sex==="F"?"21":"23"} cm (21/23 is measured at the incisors).</div>
      ${src("Depth: Chula formula (Thai adults; measured at the upper canine ≈ mouth corner). Size: my practice, Malaysian adults.")}</div>`;
  } else {
    inputs += pInputs(true);
    out = ettBlock(paedEtt());
  }
  return noInputs ? out : `<div class="card">${inputs}</div>` + out;
};

  saddle:{name:"Perineal / saddle", level:"S1–S5 (sit 5–10 min)", r:[1.0,1.5]},
  turp:{name:"Urology / TURP", level:"T10", r:[2.0,2.5]},

const rng = (a,b,u="") => a===b ? `${fmt(a)}${u}` : `${fmt(a)} – ${fmt(b)}${u}`;

/* ---------- SPINAL: LSCS dose (used inside Caesarean tab) ---------- */

  const h = Math.round(S.spHt), row = LSCS.find(r => h <= r[0]);
  return step("spHt","Height","cm",140,200,1) + `<div class="result">
    <div class="sub">Heavy bupivacaine 0.5% (height ${row[5]} cm)</div>

    <div class="sub">= ${rng(row[1]*5,row[2]*5)} mg</div>

    <ul><li><b>Morphine 0.1 mg (0.1 mL)</b> — <span class="danger" style="display:inline;padding:1px 6px;font-weight:700">1 mg/mL DILUTED, not 10 mg/mL</span></li>
    <li><b>Fentanyl 10 mcg (0.2 mL</b> of 50 mcg/mL)</li></ul>
    <div class="sub">Total volume: <b>${rng(row[3],row[4])} mL</b></div>
    <table style="margin-top:10px"><tr><th>Height</th><th>Bupi mL</th><th>Total mL</th></tr>
    ${LSCS.map(r=>`<tr class="${r===row?"hl":""}"><td>${r[5]}</td><td>${rng(r[1],r[2])}</td><td>${rng(r[3],r[4])}</td></tr>`).join("")}</table>
    <div class="warn">Obese / big abdomen (polyhydramnios, twins): <b>REDUCE</b> heavy bupivacaine dose (amount: your judgement).<br>Preload unless contraindicated. Left lateral tilt (right side up).</div>
    <div class="sub">Easier to manage hypotension than an inadequate block.</div>
    ${dermLink("T4")}
    ${protoSrc()}</div>`;
};

/* ---------- SPINAL: non-obstetric (own home button) ---------- */
const nonObsCalc = () => {

    <div class="result">
    <div class="sub">3. Heavy bupivacaine 0.5% · ${o.name} · target ${o.level}</div>${dermLink(({saddle:"S1–S4-5",turp:"T10",hernia:"T10",limb:"T10–T12"})[S.spOp], "Target "+o.level.split(" ")[0])}

function neoFluids(){ const neo = isNeo(), bw = bwKg(), r = bw < 0.8 ? 0 : bw <= 1 ? 1 : 2, d = S.pD <= 1 ? 0 : S.pD === 2 ? 1 : S.pD <= 4 ? 2 : 3, w = W();

  const v = NEO_FL[r][1][d], lo = v[0]*w/24, hi = v[1]*w/24;
  return `<h3${neoHl()}>Neonate (local manual)</h3>${neo ? neoaDraft() : ""}<p class="sub">If fluids are running from NICU, continue them. Maintenance mL/kg/day by birth weight and day of life (day 0 counts as day 1):</p>
  <table class="neofl"><tr><th>Birth weight</th><th>Day 1</th><th>Day 2</th><th>Day 3–4</th><th>Day 5+</th></tr>
  ${NEO_FL.map(([lab, vals], i) => `<tr><td>${lab}</td>${vals.map((x, j) => cell(x, i, j)).join("")}</tr>`).join("")}</table>
  ${neo ? `<div class="result"><div class="sub">For birth weight ${sig(bw)} kg, ${neoAgeTxt()}</div><div class="big">${dz(lo,"mL/h")}${hi > lo ? "–"+dz(hi,"mL/h") : ""} mL/h</div><div class="sub">${v[0]===v[1] ? v[0] : v[0]+"–"+v[1]} mL/kg/day × current weight ${sig(w)} kg ÷ 24. Maintenance fluid: D10 in ½ saline.</div></div>` : ""}`; }
pCards.fluids = () => {

  return `<div class="card"><h2>Maintenance (4/2/1)</h2><div class="big">${dz(maint,"mL/h")} mL/h</div>${m0>100?`<div class="sub">capped at 100 mL/h (formula ${sig(m0)})</div>`:""}
  ${step("fastH","Fasting","h",0,24,1)}
  <p class="sub">Deficit = maintenance × fasting hours = <b>${dz(def,"mL")} mL</b>; give ½ in hour 1, ¼ in hours 2 and 3.</p>
  <table><tr><th>Hour</th><th>Maintenance + deficit</th><th>Rate</th></tr>
  <tr><td>1</td><td>${sig(maint)} + ${sig(def/2)}</td><td class="hl">${dz(maint+def/2,"mL/h")} mL/h</td></tr>
  <tr><td>2</td><td>${sig(maint)} + ${sig(def/4)}</td><td class="hl">${dz(maint+def/4,"mL/h")} mL/h</td></tr>

  ${neoFluids()}
  <h3>Insensible loss</h3><table><tr><td>Minor &lt; 1 h</td><td>none</td></tr><tr><td>Minor &gt; 1 h</td><td class="hl">2 mL/kg/h = ${dz(2*w,"mL/h")} mL/h</td></tr>
  <tr><td>Moderate</td><td class="hl">4 mL/kg/h = ${dz(4*w,"mL/h")} mL/h</td></tr><tr><td>Major</td><td class="hl">&gt; 10 mL/kg/h = &gt; ${dz(10*w,"mL/h")} mL/h</td></tr></table>

  ${(()=>{ const g = AGEM()<1?0:1; const h=i=>i===g?' class="hl"':"";

  <h3>Glucose maintenance if high risk of hypoglycaemia</h3><p>HMD2 = 2 mL D50 + 48 mL Hartmann's (2%)</p>
  <p>SD5 = 5 mL D50 + 45 mL Sterofundin = 50 mL of 5%</p>${psrc()}</div>
  <div class="card"><h2>Blood products</h2>${pindDraft()}${neoDraft()}<p>Neonate: Hb &gt; 10–12 g/dL. Colostomy: GXM. Bowel resection = blood loss.</p><button class="homebtn" data-open="3. Fluids: transfusion protocol" data-g="paeds" data-tab="intra">When to transfuse, which product → Transfusion protocol ›</button>
  ${T([R("Max transfusion rate","0.5–1 mL/kg/min",`${dz(30*w,"mL/h")}–${dz(60*w,"mL/h")} mL/h`,"higher rate → hyperkalaemia; start calcium gluconate","IV"),
    R("Packed cells","10–20 mL/kg (4 mL/kg ↑ Hb ≈ 1 g/dL)",pk([10,20],"mL"),null,"IV"),
    DR("FFP",[10,20],"mL","local manual; BSH 15–20 mL/kg",null,"IV"), DR("Platelets",[10,15],"mL","local manual; BSH 10–20 mL/kg; max 1 adult dose",null,"IV"), DR("Cryo",[5,10],"mL",null,null,"IV")])}
  ${(()=>{ const mo=AGEM(), y=S.pY, ebvk = mo<1?(isPreterm()?95:85):mo<12?77.5:y<=12?72.5:67.5, ebv=ebvk*w, abl=S.hbNow>S.hbLow?ebv*(S.hbNow-S.hbLow)/S.hbNow:0, prbc=Math.max(0,4*w*(S.hbTarget-S.hbNow));
    return `<h3>Blood volume &amp; allowable loss</h3><p>EBV ${ebvk} mL/kg (${mo<1?(isPreterm()?"premature 90–100":"term neonate 80–90"):mo<12?"infant 75–80":y<=12?"child 70–75":"adolescent 65–70"}, local manual) = <b>${dz(ebv,"mL")} mL</b></p>
    ${step("hbNow","Hb now","g/dL",4,20,0.5)}${step("hbLow","Lowest acceptable Hb","g/dL",4,14,0.5)}

${psrc()}</div>`;
};

  ${src(INTL + ".")}</div>

const GA_CHECKED = true;

function wts(){
  const w = S.aw, h = S.height, m = S.sex === "M";
  const bmi = w / Math.pow(h/100, 2);
  let ibw = (m ? 50 : 45.5) + 0.91*(h - 152.4); ibw = Math.max(ibw, 30);
  const lbw = m ? 9270*w/(6680 + 216*bmi) : 9270*w/(8780 + 244*bmi);
  const ibwU = Math.min(ibw, w);                       // if actual < ideal, use actual
  const adj = w < ibw ? w : ibw + 0.4*(w - ibw);
  return {tbw:w, ibw:ibwU, ibwRaw:ibw, lbw:Math.min(lbw,w), adj, bmi};
}
const WN = {tbw:"TBW", ibw:"IBW", lbw:"LBW", adj:"AdjBW"};
// dose row: name, per-kg [lo,hi], unit, weight key, concentration per mL (same unit) or null, note, max
function GD(name, per, unit, wk, conc, note, max, rt){
  const W2 = wts(), w = W2[wk], lo = Array.isArray(per)?per[0]:per, hi = Array.isArray(per)?per[1]:per;
  let a = lo*w, b = hi*w, capped = false;
  if (max!=null){ if (a>max){a=max;capped=true;} if (b>max){b=max;capped=true;} }
  const rr = x => conc ? dz(dz(x/conc,"mL", max!=null?max/conc:null)*conc, unit, max) : dz(x, unit, max);
  a = rr(a); b = rr(b);
  const dose = a===b ? `${a} ${unit}` : `${a}–${b} ${unit}`;
  const ml = conc ? (a===b ? `${dz(a/conc,"mL")} mL` : `${dz(a/conc,"mL")}–${dz(b/conc,"mL")} mL`) : "";
  return `<tr class="dz"><td>${name}${note?`<div class="sub">${note}</div>`:""}</td><td class="sub">${Array.isArray(per)?per.join("–"):per} ${unit}/kg<br><b>${WN[wk]} ${sig(w)} kg</b></td><td class="hl">${dose}${RT(rt)}${capped?` <span class="sub">(max ${max})</span>`:""}${ml?`<div class="sub">${ml}</div>`:""}</td></tr>`;
}

const LE_WHO = [["husband","Husband present"],["family","Other family member present"],["interp","Interpreter used"]];
const LE_CHK = [["plt","Platelet count acceptable"],["ac","No anticoagulant within the safe interval"],["site","No infection at the site"],["iv","IV access in place"],["ctg","CTG reviewed"]];
const leOn = k => scv("le", k) === 1;
const cap1 = t => t.replace(/^./, c => c.toUpperCase());
function lepText(){
  const det = S.leLen === "detailed", pres = [leOn("husband") ? "husband" : "", leOn("family") ? "family member" : ""].filter(Boolean);
  const L = [];
  L.push(`Anaesthetic discussion: Labour epidural analgesia was discussed with the patient${pres.length ? `, with her ${andJoin(pres)} present` : ""}, including its purpose, benefits and risks. Risks are grouped as on the MOH anaesthesia consent form:`);
  const C = det ? "drop in blood pressure needing treatment (about 1 in 50), itching, shivering, heavy or weak legs, difficulty passing urine, inadequate pain relief needing extra medicine or re-siting of the catheter (about 1 in 10)"
                : "drop in blood pressure (about 1 in 50), itching, heavy legs, inadequate pain relief needing extra medicine or re-siting (about 1 in 10)";
  const U = det ? "severe headache after accidental dural puncture (about 1 in 100), which may need an epidural blood patch; temporary nerve damage such as a numb patch or weak leg (about 8 in 20,000)"
                : "severe headache after dural puncture (about 1 in 100), temporary nerve damage (about 8 in 20,000)";
  const R = det ? "permanent nerve damage (about 1 in 13,000); epidural abscess (about 1 in 50,000); meningitis (about 1 in 100,000); epidural haematoma (about 1 in 170,000); severe nerve injury including paralysis (about 1 in 250,000); very high block or local anaesthetic toxicity"
                : "permanent nerve damage (about 1 in 13,000), epidural abscess (about 1 in 50,000), meningitis (about 1 in 100,000), epidural haematoma (about 1 in 170,000), paralysis (about 1 in 250,000)";
  if (det) {
    L.push(["Labour epidural analgesia",
      "Purpose: To provide effective pain relief during labour while the mother remains awake and able to push. The epidural can also be topped up to provide anaesthesia for a caesarean section if one is needed.",
      "Procedure: The patient sits or lies on her side, and the lower back is cleaned before an injection is given to numb the skin. A needle is used to place a fine plastic tube (catheter) into the epidural space in the lower back; the needle is then removed and the catheter is taped in place. After a test dose, pain-relieving medicine (local anaesthetic with a small dose of opioid) is given through the catheter by infusion or a patient-controlled pump. Blood pressure and the baby's heart rate are monitored throughout.",
      "Possible side effects and complications:", bands(C, U, R)].join("\n"));
  } else L.push(`Labour epidural analgesia\nPossible side effects and complications:\n${bands(C, U, R)}`);
  if (det) L.push("In a UK national audit of about 320,000 obstetric spinal and epidural procedures (NAP3, 2009), permanent harm occurred in about 1 in 80,000 or fewer, with no cases of paralysis or death.");
  L.push("Also explained: a low-dose epidural does not increase the chance of caesarean section or cause long-term backache. Any effect on instrumental (forceps or vacuum) delivery is small and uncertain, and labour, especially the second stage, may be longer.");
  const chk = LE_CHK.filter(([k]) => leOn(k)).map(x => /^[A-Z]{2}/.test(x[1]) ? x[1] : x[1][0].toLowerCase() + x[1].slice(1));
  if (chk.length) L.push(`Checked: ${chk.join("; ")}.`);

  L.push([langLine("", leOn("interp")), ...dxLines("The patient"), note ? `Specific concerns: ${note}` : ""].filter(Boolean).join("\n"));
  L.push(decisionLine("The patient", "the proposed labour epidural"));
  return plainTxt(L.filter(Boolean).join("\n\n"));
}

const RA_CHECKED = true;
const raDraft = () => RA_CHECKED ? "" : `<div class="warn" style="margin-top:0">DRAFT — from standard sources (NYSORA, ASRA, RA-UK), not yet ticked by you.</div>`;
const RSRC = "NYSORA / RA-UK Plan A blocks / ASRA.";
const LAD = {
  bupi:{n:"Bupi / levobupi", max:2, pmax:2.5, cap:150, concs:["0.25","0.5"]},
  ropi:{n:"Ropivacaine", max:3, pmax:3, cap:225, concs:["0.2","0.375","0.5","0.75"]},
  lido:{n:"Lignocaine plain", max:3, pmax:3, cap:200, concs:["1","2"]},
  lidoA:{n:"Lignocaine + adrenaline", max:7, pmax:7, cap:500, concs:["1","2"]}};
function laWeight(lt){
  if (lt==="p") return {w:W(), why:`paeds weight ${sig(W())} kg`};
  const x = wts(); return x.bmi >= 30 ? {w:x.lbw, why:`LBW ${sig(x.lbw)} kg (BMI ${sig(x.bmi)} ≥ 30)`} : {w:x.tbw, why:`actual weight ${sig(x.tbw)} kg`};
}
function laMaxMg(d, lt){ const {w} = laWeight(lt), D = LAD[d]; return Math.min((lt==="p"?pMaxFor(d):D.max)*w, D.cap); }
const laKey = lt => lt==="p" ? "laP" : "laA";
function laAddBtn(lt, d, conc, ml, sides, label){
  const spec = esc(JSON.stringify({d, c:String(conc), ml:+sig(ml), bi:sides, l:label}));
  return `<button class="addla" data-addla="${spec}" data-lt="${lt}">+ Add ${dz(ml,"mL")} mL ${conc}%${sides===2?" × 2 sides":""} to LA calculator</button>`;
}
function laCalc(lt){
  const list = S[laKey(lt)] || [], D = LAD[S.laD] || LAD.bupi;
  if (!D.concs.includes(S.laC)) S.laC = D.concs[D.concs.length > 2 ? 1 : 0];
  const {why} = laWeight(lt);
  let total = 0;
  const rows = list.map((it,i) => { const mg = it.ml * it.bi * (+it.c) * 10, pct = mg / laMaxMg(it.d, lt) * 100; total += pct;
    return `<tr><td>${esc(it.l||LAD[it.d].n)}<div class="sub">${LAD[it.d].n} ${it.c}% · ${dz(it.ml,"mL")} mL${it.bi===2?" × 2":""}</div></td><td class="hl">${dz(mg,"mg")} mg</td><td class="hl">${Math.round(pct)}%</td><td><button class="rmla" data-rmla="${lt}:${i}" aria-label="Remove">×</button></td></tr>`; }).join("");
  const state = total > 100 ? "over" : total > 80 ? "near" : "ok";
  const maxLine = Object.entries(LAD).map(([k,v]) => `${v.n} ${dz(laMaxMg(k,lt),"mg")} mg`).join(" · ");
  return `<p class="sub">Max for this patient (${why}): ${maxLine}</p>
    <div class="sub">Add a block</div>${seg("laD",Object.entries(LAD).map(([k,v])=>[k,v.n]))}${seg("laC",D.concs.map(c=>[c,c+"%"]))}
    ${step("laMl","Volume","mL",1,60,1)}${seg("laBi",[["1","One side"],["2","Both sides"]])}
    <button class="homebtn" data-addla="form" data-lt="${lt}">+ Add ${S.laMl} mL ${D.n} ${S.laC}%${S.laBi==="2"?" × 2":""}</button>
    ${list.length ? `<div style="overflow-x:auto"><table><tr><th>Block</th><th>Dose</th><th>% max</th><th></th></tr>${rows}</table></div>` : `<p class="sub">No blocks added yet. Use the form above or the "+ Add" button on any block card.</p>`}
    <div class="meter ${state}"><span style="width:${Math.min(total,100)}%"></span></div>
    <div class="${state==="over"?"danger":state==="near"?"warn":"result"}" style="margin-top:var(--s2)"><b>Total: ${Math.round(total)}% of maximum</b>${state==="over"?" — ABOVE MAXIMUM. Reduce volume or concentration.":state==="near"?" — close to maximum.":""}</div>
    ${list.length?`<button class="linkbtn" data-clrla="${lt}">Clear list</button>`:""}
    <p class="sub">Different drugs combine as % of each one's own maximum. Doses apply to one sitting.</p>`;
}

function scorer(id, items, pass, okText){
  const st = (S.sc[id] = S.sc[id] || {});
  const done = items.every(([k]) => st[k] !== undefined), total = items.reduce((a,[k]) => a + (st[k] ?? 0), 0);
  const zero = items.some(([k]) => st[k] === 0);
  const rows = items.map(([k,label,opts]) => `<div class="scrow"><div class="sclab">${label}</div><div class="scopts">${opts.map((t,i) => t===null ? "" :
      `<button class="scopt ${st[k]===2-i?"on":""}" data-score="${id}:${k}:${2-i}"><b>${2-i}</b> ${t}</button>`).join("")}</div></div>`).join("");
  const verdict = !done ? `<div class="result"><div class="sub">Score so far</div><div class="big">${total} / 10</div><div class="sub">Tap every row.</div></div>`
    : total >= pass && !zero ? `<div class="result ok"><div class="big">${total} / 10 ✓</div><div><b>${okText}</b> (≥ ${pass}, no zero)</div></div>`
    : `<div class="danger"><div class="big">${total} / 10</div>Not yet — needs ≥ ${pass} with no zero. Reassess.</div>`;
  return rows + verdict + `<button class="linkbtn" data-screset="${id}">Reset score</button>`;
}

// paper dose: per-kg x weight, capped, drawable; optional conc (unit per mL) adds mL
function pq(w, per, unit, max, conc){
  const one = p => { let v = p*w, c = false; if (max!=null && v > max){ v = max; c = true; }
    v = conc ? dz(dz(v/conc,"mL", max!=null?max/conc:null)*conc, unit, max) : dz(v, unit, max); return [v, c]; };
  const [a, ca] = one(Array.isArray(per)?per[0]:per), [b, cb] = one(Array.isArray(per)?per[1]:per);
  const t = a===b ? `${a} ${unit}` : `${a}–${b} ${unit}`;
  const ml = conc ? (a===b ? ` = ${dz(a/conc,"mL")} mL` : ` = ${dz(a/conc,"mL")}–${dz(b/conc,"mL")} mL`) : "";
  return `<b>${t}</b>${ml}${ca||cb?" (max)":""}`;
}

    <tr><td>Laryngospasm</td><td class="pr-rule">propofol 0.5–1 · sux 0.1–0.5 mg/kg</td><td>${pq(w,[0.5,1],"mg")} · ${pq(w,[0.1,0.5],"mg")} + atropine</td></tr>
    <tr><td>Anaphylaxis</td><td class="pr-rule">IV 1 mcg/kg · IM 10 mcg/kg</td><td>IV ${pq(w,1,"mcg")} · IM ${pq(w,0.01,"mL",0.5)} 1:1000</td></tr>
    <tr><td>Intralipid 20%</td><td class="pr-rule">1.5 mL/kg, then 15 mL/kg/h</td><td>${pq(w,1.5,"mL")} · ${dz(15*w,"mL")} mL/h</td></tr>
    <tr><td>Calcium chloride 10%</td><td class="pr-rule">0.2 mL/kg, max 10</td><td>${pq(w,0.2,"mL",10)}</td></tr></table>
    <div class="pr-small">Arrest doses: RCUK 2021 (2025 update pending).</div></div>
  </div>`;
}

function prTx(){
  const W2 = wts(), w = S.aw, hi = kHigh(), neo = Math.min(0.05*W2.ibw, 5), nor = (lo,h) => `${dz(lo*w*60/80,"mL/h")}–${dz(h*w*60/80,"mL/h")} mL/h`;
  const r = (x, conc, unit) => `<b>${sig(dz(x/conc,"mL")*conc)} ${unit}</b> = ${dz(x/conc,"mL")} mL`;
  const sz = S.sex==="F" ? "6.5–7.0" : "7.0–7.5", depth = f1(r05(4 + S.height/10));
  const flags = [], gain = S.todayWt - S.aw;
  if (S.k >= 5.5) flags.push(`K⁺ ${S.k} ≥ 5.5: dialyse / discuss before induction`); else if (S.k >= 5) flags.push(`K⁺ ${S.k}: dialyse if time or graft risk`);
  if (S.hb < 7) flags.push(`Hb ${S.hb} &lt; 7: discuss transfusion with nephrology`);
  if (S.touched.todayWt && gain > 2) flags.push(`${sig(gain)} kg above dry weight`);
  if (S.touched.hdH && S.hdH > 24) flags.push(`Last HD ${S.hdH} h ago: repeat K⁺`);
  return `${flags.length ? `<div class="pr-flag"><b>Discuss before proceeding:</b> ${flags.join(" · ")}</div>` : ""}
  ${prLine("Baseline BP (target)")}
  <div class="pr-cols">
  ${prChk("1 · Pre-op", ["K⁺, Hb, last HD, UF volume, residual urine checked", "Fistula arm marked and protected", "Omeprazole 20 mg (or ranitidine 150 mg once)", "Cefuroxime 1.5 g sent with patient", "Immunosuppressants handed doctor-to-doctor", "Group &amp; crossmatch sent"])}
  ${prTab("2 · Induction", [
    prRow("Propofol 1%", `1–2 mg/kg LBW ${sig(W2.lbw)}`, pq(W2.lbw,[1,2],"mg",null,10)),
    prRow("Fentanyl", "1–3 mcg/kg LBW", pq(W2.lbw,[1,3],"mcg",null,50)),
    hi ? prRow("Rocuronium RSI", `1.2 mg/kg IBW ${sig(W2.ibw)} (K⁺ ${S.k})`, r(1.2*W2.ibw,10,"mg")) : prRow("Suxamethonium RSI", `1.5 mg/kg TBW (K⁺ ${S.k})`, r(1.5*W2.tbw,50,"mg")+" · single dose"),
    hi ? prRow("Sugammadex", "16 mg/kg TBW — CICO only", r(16*W2.tbw,100,"mg")) : prRow("or rocuronium", "1.2 mg/kg IBW", r(1.2*W2.ibw,10,"mg")),
    prRow("Atracurium", "0.5 mg/kg IBW · top-up 0.1–0.15", pq(W2.ibw,0.5,"mg",null,10)),
    prRow("ETT", "", `<b>${sz}</b> · ${depth} cm at mouth corner · NG 14–16 Fr`),
    prRow("CVC R-IJV", "scan first · height/10", `<b>≈ ${sig(S.height/10)} cm</b> · confirm on CXR`),
    prRow("Art line", "", "<b>Not</b> on the fistula arm")])}
  ${prTab("3 · Intra-op", [
    prRow("Fentanyl 10 mcg/mL", "0.5–2 mcg/kg/h LBW", `<b>${dz(0.05*W2.lbw,"mL/h")}–${dz(0.2*W2.lbw,"mL/h")} mL/h</b>`),
    prRow("Atracurium 10 mg/mL", "0.3–0.6 mg/kg/h", `<b>${dz(0.03*w,"mL/h")}–${dz(0.06*w,"mL/h")} mL/h</b>`),
    prRow("Noradrenaline 4 mg/50 mL", "0.05–0.3 mcg/kg/min", `<b>${nor(0.05,0.3)}</b>`),
    prRow("Fluid", hi ? "K⁺ ≥ 5.5: saline" : "balanced", `<b>${hi?"0.9% saline":"Sterofundin / balanced"}</b> · up to ${dz(30*w,"mL/h")} mL/h`),
    prRow("Urine aim", "&gt; 1 mL/kg/h", `<b>&gt; ${dz(w,"mL/h")} mL/h</b>`)])}
  ${prChk("4 · Before reperfusion", [`Mannitol 20% ${dz(2.5*w,"mL")} mL (${dz(0.5*w,"g")} g) — started after induction, <b>complete</b>`, "Methylprednisolone 500 mg slow — <b>complete</b>", "Thymoglobulin / basiliximab as nephrologist prescribed (light-protected)", "BP at or above baseline before clamps off", "Fully relaxed"])}
  ${prChk("5 · After reperfusion", [`Furosemide ${dz(0.5*w,"mg")}–${dz(w,"mg")} mg (0.5–1 mg/kg)`, "ABG: K⁺, acid–base", "Keep relaxed until retractors out"])}
  ${prTab("6 · End & PACU", [
    prRow("Neostigmine", "0.05 mg/kg IBW, max 5", `<b>${sig(dz(neo/2.5,"mL")*2.5)} mg</b> + glyco <b>${dz(neo*0.2,"mg")} mg</b>`),
    prRow("Paracetamol", "", w<50 ? `<b>${dz(15*w,"mg")} mg</b> 6-hourly` : "<b>1 g</b> 6-hourly"),
    prRow("Tramadol", "renal", "<b>50 mg</b> 12-hourly, max 200 mg/day"),
    prRow("PCA", "", "Fentanyl 10 mcg/mL preferred · <b>no NSAIDs</b>"),
    prRow("PONV", "", "Ondansetron 4 mg · no extra dexamethasone"),
    prRow("PACU", "", "Replace last hour's urine mL for mL · CXR · graft ultrasound")])}
  </div>`;
}

screens.print = (which) => {
  const keys = PR_KEYS[which], miss = keys.filter(isSample);
  const back = PR_BACK[which];
  if (miss.length) return head("Print plan", back) + `<div class="card"><h2>Enter this patient first</h2>
    <p>The sheet still shows sample values for: <b>${[...new Set(miss.map(k=>PR_FIELD[k]))].join(", ")}</b>. A printed sheet with sample doses is not safe.</p>
    <button class="homebtn" data-go="${back}">‹ Back to enter the patient</button></div>` + disc;
  const now = new Date(), dt = now.toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"}) + " " + now.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});
  const W2 = wts();
  const pt = which==="paeds"
    ? `Age <b>${S.pY} y${S.pM?` ${S.pM} m`:""}</b> · Weight <b>${sig(S.pw)} kg</b> ${S.pwEst?"(<b>estimated</b> from age)":"(actual)"}`
    : `${S.sex==="F"?"Female":"Male"} · <b>${S.height} cm</b> · dry weight <b>${sig(S.aw)} kg</b>${S.touched.todayWt?` · today ${sig(S.todayWt)} kg`:""}${S.touched.age?` · ${S.age} y`:""} · BMI ${sig(W2.bmi)} · IBW ${sig(W2.ibw)} · LBW ${sig(W2.lbw)} · <b>K⁺ ${S.k}</b> · <b>Hb ${S.hb}</b>${S.touched.hdH?` · last HD ${S.hdH} h ago`:""}`;
  const wtxt = which==="paeds" ? `${sig(S.pw)} kg` : `${sig(S.aw)} kg dry weight`;
  return head("Print plan", back) + `<div class="card prtools"><p>Check the sheet, then print. On iPhone: <b>Print</b> → choose a printer, or pinch out on the preview → Share → <b>Save to Files</b> for a PDF.</p>
    <button class="homebtn" data-print="1">⎙ Print / Save as PDF</button>
    <p class="sub">Nothing happens from the home-screen app? Open the same page in Safari and print from there. Name and IC go on paper only (sticker box).</p></div>
  <div class="psheet">
    <div class="pr-head"><div><div class="pr-title">${PR_NAME[which]}</div>
      <div class="pr-pt">${pt}</div>
      ${prLine("Procedure")}${prLine("Date")}${prLine("Allergies")}${which==="paeds"?prLine("Fasted since"):prLine("Donor (living / deceased)")}</div>
      <div class="pr-sticker">Patient sticker</div></div>
    ${PRINT_CHECKED ? "" : `<div class="pr-flag">DRAFT sheet — not yet checked by the author.</div>`}
    ${which==="paeds" ? prPaeds() : prTx()}
    <div class="pr-notes"><b>Notes</b>${"<i></i>".repeat(which==="paeds"?3:2)}</div>
    <div class="pr-foot">Printed ${dt} for <b>${wtxt}</b> — recheck all doses if the weight or values change. Induction Card v${APP_VERSION} · values reviewed Nov 2026. Memory aid only — clinical judgement decides.</div>
  </div>` + disc;
};
