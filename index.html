/* Layout: one phone-width column; home = list of section tiles, each section has its own hue. */
:root{
  /* type scale (6 steps) */
  --fs-xs:.8125rem; --fs-sm:.875rem; --fs-body:.9375rem; --fs-base:1rem; --fs-md:1.0625rem; --fs-lg:1.25rem; --fs-xl:1.5rem; --big:clamp(2rem,9vw,2.75rem);
  /* spacing & radius */
  --font-sans:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; --font-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --mon-bg:#0b1517; --mon-ink:#e6f1ef; --mon-muted:#8fa7a3; --mon-grid:rgba(255,255,255,.06); --etco2:#facc15;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --r-sm:10px; --r:14px;
  /* neutrals (slight teal bias) */
  --bg:#f3f6f6; --card:#ffffff; --ink:#14201f; --muted:#5a6866; --line:#dbe3e2; --field:#f3f6f6;
  --accent:#0f766e; --accent-ink:#ffffff; --accent-soft:#e3f3f1; --on:#ffffff;
  --warn-bg:#fff6dc; --warn-ink:#7a4b00; --warn-line:#efc35a;
  --danger-bg:#fde9e9; --danger-ink:#9b1c1c; --danger-line:#f0a3a3;
  --unv-bg:#edf0f2; --unv-ink:#4b5563;
  --emerg-solid:#b42318;
  /* section hues */
  --g-emerg:#b42318; --g-emerg-soft:#fde9e9;
  --g-obs:#be185d;   --g-obs-soft:#fce7f3;
  --g-tx:#6d28d9;    --g-tx-soft:#ede9fe;
  --g-paeds:#15803d; --g-paeds-soft:#dcfce7;
  --g-spinal:#0e7490; --g-spinal-soft:#cffafe;
  --g-airway:#b45309; --g-airway-soft:#fef3c7;
  --g-values:#5a6866; --g-values-soft:#eceff0;
  --gc:var(--accent); --gc-soft:var(--accent-soft);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1514; --card:#162120; --ink:#e4eeec; --muted:#9db0ad; --line:#2a3836; --field:#0e1514;
    --accent:#2dd4bf; --accent-ink:#04201c; --accent-soft:#11302c; --on:#0e1514;
    --warn-bg:#2e2410; --warn-ink:#f5cf7a; --warn-line:#6b5420;
    --danger-bg:#3a1414; --danger-ink:#ffb4b4; --danger-line:#7a2a2a;
    --unv-bg:#1f2a29; --unv-ink:#a8b8b5;
    --g-emerg:#ff9b93; --g-emerg-soft:#3a1414;
    --g-obs:#f472b6;   --g-obs-soft:#3a1028;
  --g-tx:#a78bfa;    --g-tx-soft:#251a40;
    --g-paeds:#4ade80; --g-paeds-soft:#0c2e1a;
    --g-spinal:#22d3ee; --g-spinal-soft:#08303a;
    --g-airway:#fbbf24; --g-airway-soft:#3a2a06;
    --g-values:#9db0ad; --g-values-soft:#1f2a29;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1514; --card:#162120; --ink:#e4eeec; --muted:#9db0ad; --line:#2a3836; --field:#0e1514;
  --accent:#2dd4bf; --accent-ink:#04201c; --accent-soft:#11302c; --on:#0e1514;
  --warn-bg:#2e2410; --warn-ink:#f5cf7a; --warn-line:#6b5420;
  --danger-bg:#3a1414; --danger-ink:#ffb4b4; --danger-line:#7a2a2a;
  --unv-bg:#1f2a29; --unv-ink:#a8b8b5;
  --g-emerg:#ff9b93; --g-emerg-soft:#3a1414;
  --g-obs:#f472b6;   --g-obs-soft:#3a1028;
  --g-tx:#a78bfa;    --g-tx-soft:#251a40;
  --g-paeds:#4ade80; --g-paeds-soft:#0c2e1a;
  --g-spinal:#22d3ee; --g-spinal-soft:#08303a;
  --g-airway:#fbbf24; --g-airway-soft:#3a2a06;
  --g-values:#9db0ad; --g-values-soft:#1f2a29;
  color-scheme:dark;
}
[data-group="emerg"]{--gc:var(--g-emerg);--gc-soft:var(--g-emerg-soft)}
[data-group="obs"]{--gc:var(--g-obs);--gc-soft:var(--g-obs-soft)}
[data-group="tx"]{--gc:var(--g-tx);--gc-soft:var(--g-tx-soft)}
[data-group="paeds"]{--gc:var(--g-paeds);--gc-soft:var(--g-paeds-soft)}
[data-group="spinal"]{--gc:var(--g-spinal);--gc-soft:var(--g-spinal-soft)}
[data-group="airway"],[data-group="ga"]{--gc:var(--g-airway);--gc-soft:var(--g-airway-soft)}
[data-group="regional"]{--gc:var(--g-spinal);--gc-soft:var(--g-spinal-soft)}

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:400 var(--fs-base)/1.5 var(--font-sans);-webkit-text-size-adjust:100%}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:640px;margin:0 auto;padding-block:0 var(--s5);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit}
p{margin:var(--s2) 0}
h1,h2,h3{text-wrap:balance}
:focus-visible{outline:3px solid var(--gc);outline-offset:2px}

/* header */
header{display:flex;align-items:center;gap:var(--s2);padding:var(--s3) 0}
header h1{font-size:var(--fs-lg);font-weight:700;margin:0;flex:1;display:flex;align-items:center;gap:var(--s2);line-height:1.2;min-width:0}
.hico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--gc-soft);color:var(--gc);flex:none}
.hico svg{width:22px;height:22px}
.iconbtn{background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);min-width:44px;height:44px;padding:0 var(--s3);cursor:pointer;font-size:var(--fs-sm);font-weight:600;white-space:nowrap}
.draft,.checked{border-radius:var(--r-sm);padding:var(--s2) var(--s3);font-size:var(--fs-xs);text-align:center;margin-bottom:var(--s3);line-height:1.35}
.draft{background:var(--danger-bg);color:var(--danger-ink);border:1px solid var(--danger-line);font-weight:700}
.checked{background:var(--accent-soft);color:var(--ink)}

/* home tiles */
.label{font-size:var(--fs-xs);font-weight:700;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin:var(--s4) 2px var(--s2)}
.tiles{display:grid;gap:var(--s2)}
.tile{--t:var(--accent);--t-soft:var(--accent-soft);display:flex;align-items:center;gap:var(--s3);width:100%;text-align:left;background:var(--card);
  border:1px solid var(--line);border-radius:var(--r);padding:var(--s3);cursor:pointer;color:var(--ink)}
.tile .ico{width:52px;height:52px;border-radius:var(--r);display:grid;place-items:center;background:var(--t-soft);color:var(--t);flex:none}
.tile .ico svg{width:30px;height:30px}
.tile .txt{flex:1;min-width:0}
.tile .tt{display:block;font-size:var(--fs-lg);font-weight:700;line-height:1.2}
.tile .ts{display:block;font-size:var(--fs-sm);color:var(--muted);margin-top:2px;line-height:1.35}
.tile .chev{color:var(--muted);font-size:var(--fs-xl);line-height:1}
.t-obs{--t:var(--g-obs);--t-soft:var(--g-obs-soft)} .t-paeds{--t:var(--g-paeds);--t-soft:var(--g-paeds-soft)}
.t-spinal,.t-regional{--t:var(--g-spinal);--t-soft:var(--g-spinal-soft)} .t-airway,.t-ga{--t:var(--g-airway);--t-soft:var(--g-airway-soft)}
.t-values{--t:var(--g-values);--t-soft:var(--g-values-soft)} .t-tx,.qbtn.t-tx,.sq.t-tx{--t:var(--g-tx);--t-soft:var(--g-tx-soft)}
.txck{display:flex;flex-direction:column;gap:6px}.txci{display:flex;gap:10px;align-items:center;text-align:left;min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--card);color:var(--ink);font:inherit;font-size:var(--fs-sm);cursor:pointer}
.txci .box{flex:0 0 22px;height:22px;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center;font-weight:700;color:var(--on)}.txci.on .box{background:var(--gc);border-color:var(--gc)}.txci.on{color:var(--muted)}
.grid2 .sq:last-child:nth-child(odd){grid-column:1/-1}
.qbtn.t-obs,.sq.t-obs{--t:var(--g-obs);--t-soft:var(--g-obs-soft)} .qbtn.t-paeds,.sq.t-paeds{--t:var(--g-paeds);--t-soft:var(--g-paeds-soft)}
.qbtn.t-ga,.sq.t-ga{--t:var(--g-airway);--t-soft:var(--g-airway-soft)} .sq.t-regional{--t:var(--g-spinal);--t-soft:var(--g-spinal-soft)}
.tile.t-emerg{background:var(--emerg-solid);border-color:var(--emerg-solid);color:#fff}
.tile.t-emerg .ico{background:rgba(255,255,255,.16);color:#fff}
.tile.t-emerg .ts,.tile.t-emerg .chev{color:rgba(255,255,255,.88)}

/* search */
.searchbox{position:relative}
.searchbox svg{position:absolute;left:12px;top:14px;width:20px;height:20px;color:var(--muted)}
.search{width:100%;height:48px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:var(--fs-base);padding:0 var(--s3) 0 40px}
#results:not(:empty){margin-top:var(--s2);background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);padding:0 var(--s3)}
.hit{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:var(--s3) 0;font-weight:600;font-size:var(--fs-base);cursor:pointer}
.hit:last-child{border-bottom:0}
.hit small{display:block;color:var(--muted);font-weight:400;font-size:var(--fs-xs);margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:var(--s2)}
.chip{padding:var(--s2) var(--s3);border-radius:999px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:var(--fs-sm);font-weight:600;text-align:left}

/* generic buttons kept for in-card links */
.homebtn{display:block;box-sizing:border-box;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:var(--r-sm);
  padding:var(--s3);font-size:var(--fs-base);font-weight:700;cursor:pointer;margin:var(--s2) 0}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:var(--s4);margin:var(--s3) 0}
.card h2{font-size:var(--fs-md);font-weight:700;margin:0 0 var(--s2);line-height:1.3}
.card h3{font-size:var(--fs-sm);font-weight:700;color:var(--gc);margin:var(--s4) 0 var(--s1);letter-spacing:.01em}
.hint{font-size:var(--fs-sm);color:var(--muted);margin:var(--s4) 2px var(--s1)}

/* controls */
.seg{display:flex;gap:var(--s2);flex-wrap:wrap;margin:var(--s2) 0 var(--s3)}
.seg button{flex:1 1 auto;min-height:44px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--card);cursor:pointer;padding:0 var(--s3);font-size:var(--fs-sm);font-weight:600}
.seg button[aria-pressed="true"]{background:var(--gc);color:var(--on);border-color:var(--gc);font-weight:700}
.emtabs{margin-top:0;flex-wrap:nowrap}
.emtabs button{flex:1 1 0;padding:0 var(--s1);min-width:0}
.emtabs button{min-height:48px;font-size:var(--fs-base)}
.emtabs.six{flex-wrap:wrap}@media (min-width:700px){.emtabs.six{flex-wrap:nowrap}.emtabs.five.six button{flex:1 1 0}}.emtabs.five.six button{flex:1 1 30%;font-size:var(--fs-sm);padding:0 var(--s1)}.acchead{margin:var(--s4) 2px var(--s1)}.rellink{display:block;width:calc(100% - 2*var(--s4));box-sizing:border-box;text-align:left;margin-top:var(--s3);padding:var(--s2) var(--s3);border:1px dashed var(--line);border-radius:var(--r-sm);background:none;color:var(--muted);font:inherit;font-size:var(--fs-sm);font-weight:600;cursor:pointer}.emtabs.five{gap:4px}.emtabs.five button{font-size:var(--fs-xs);padding:0 2px;letter-spacing:-.01em}
.step{display:flex;align-items:center;gap:var(--s2);margin:var(--s2) 0}
.step label{flex:1;font-weight:600;font-size:var(--fs-base);min-width:0}
.step button{width:48px;height:48px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--card);font-size:var(--fs-xl);line-height:1;cursor:pointer}
.step input{font-family:var(--font-mono);width:80px;height:48px;text-align:center;font-size:var(--fs-lg);font-weight:700;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--field);color:var(--ink);font-variant-numeric:tabular-nums}
.step .unit{width:30px;color:var(--muted);font-size:var(--fs-sm)}

/* results */
.result{background:var(--gc-soft);border-radius:var(--r);padding:var(--s4);margin:var(--s3) 0}
.big{font-family:var(--font-mono);font-size:var(--big);font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:var(--fs-sm);line-height:1.4}
.row{display:flex;gap:var(--s4);flex-wrap:wrap}
.row>div{flex:1 1 140px;min-width:0}
.trio{display:flex;gap:var(--s2);margin-top:var(--s2)}
.trio span{flex:1;text-align:center;border:1px solid var(--line);border-radius:var(--r-sm);padding:var(--s1) 0;background:var(--card);color:var(--muted);font-size:var(--fs-sm);font-variant-numeric:tabular-nums}
.trio span.main{border:2px solid var(--gc);color:var(--ink);font-weight:800}
.src{color:var(--muted);font-size:var(--fs-xs);margin-top:var(--s3);line-height:1.4}
.warn,.danger,.unv{border-radius:var(--r-sm);padding:var(--s2) var(--s3);margin:var(--s2) 0;font-size:var(--fs-sm);line-height:1.45}
.warn{background:var(--warn-bg);color:var(--warn-ink);border:1px solid var(--warn-line)}
.danger{background:var(--danger-bg);color:var(--danger-ink);border:1px solid var(--danger-line);font-weight:400}
.unv{background:var(--unv-bg);color:var(--unv-ink);border:1px dashed var(--line)}
.unv b{letter-spacing:.03em}

/* tables & lists */
table{width:100%;border-collapse:collapse;font-size:var(--fs-body);line-height:1.4}
.card ul:not(.crisis) li,.card ol:not(.crisis) li{font-size:var(--fs-body);line-height:1.45}
th,td{border-bottom:1px solid var(--line);padding:var(--s2) var(--s1);text-align:left;vertical-align:top;font-variant-numeric:tabular-nums}
th{color:var(--muted);font-weight:600}
td.hl{font-weight:700}
.mono,b.dose,.trio span{font-family:var(--font-mono)}
tr.hl td{background:var(--gc-soft);font-weight:700}
ol,ul{margin:var(--s1) 0;padding-left:22px}
li{margin:var(--s1) 0}

/* accordion */
details.acc{padding:0;margin:var(--s2) 0}
details.acc>summary{list-style:none;cursor:pointer;padding:var(--s3) var(--s4);font-weight:700;font-size:var(--fs-md);display:flex;align-items:center;gap:var(--s3);min-height:52px;line-height:1.3}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary .st{flex:1;min-width:0}
details.acc>summary::after{content:"›";color:var(--muted);font-size:var(--fs-xl);line-height:1;transition:transform .15s}
details.acc[open]>summary::after{transform:rotate(90deg)}
details.acc[open]>summary{border-bottom:1px solid var(--line)}
details.acc>:not(summary){margin-left:var(--s4);margin-right:var(--s4)}
details.acc>table,details.acc>.linkbtn{width:calc(100% - 2*var(--s4))}
details.acc[open]{padding-bottom:var(--s3)}
.stepno{min-width:34px;height:28px;padding:0 var(--s2);border-radius:8px;background:var(--gc-soft);color:var(--gc);font-weight:800;font-size:var(--fs-sm);display:inline-grid;place-items:center;flex:none;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion: reduce){details.acc>summary::after{transition:none}}

/* crisis */
ol.crisis{padding-left:26px;margin:var(--s2) 0}
ol.crisis li{margin:var(--s2) 0;font-size:var(--fs-md);line-height:1.45;padding-left:2px}
ol.crisis li::marker{font-weight:800;color:var(--g-emerg)}
b.dose{font-weight:800}
.emlinks{padding:var(--s3) var(--s4)}
.emlink{display:block;box-sizing:border-box;text-align:left;margin:var(--s2) 0;padding:var(--s3);border-radius:var(--r-sm);border:1px solid var(--danger-line);background:var(--danger-bg);color:var(--danger-ink);font-weight:700;font-size:var(--fs-sm);cursor:pointer}

.themebtn{min-width:44px;width:44px;padding:0;font-size:var(--fs-lg)}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s2)}
.qbtn,.sq{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--s1);background:var(--card);border:1px solid var(--line);border-radius:var(--r);cursor:pointer;color:var(--ink);text-align:center}
.qbtn{padding:var(--s3) var(--s1);font-size:var(--fs-sm);font-weight:700;min-height:88px}
.qi{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--t-soft);color:var(--t)}
.qi svg{width:26px;height:26px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:var(--s2)}

const PSRC = "My paeds notes (Jan 2024).";
const sig = x => Number(Number(x).toPrecision(3));

// per-kg dose: per = number or [lo,hi]; returns "x unit" or "x – y unit", capped at max
function pk(per, unit, max){
  const w = W(), lo = Array.isArray(per)?per[0]:per, hi = Array.isArray(per)?per[1]:per;
  let a = lo*w, b = hi*w, capped = false;
  if (max!=null){ if (a>max){a=max;capped=true;} if (b>max){b=max;capped=true;} }
  const t = a===b ? `${sig(a)} ${unit}` : `${sig(a)} – ${sig(b)} ${unit}`;
  return capped ? `${t} <span class="sub">(max ${max} ${unit} applied)</span>` : t;
}
const perTxt = (per, unit) => (Array.isArray(per)?`${per[0]}–${per[1]}`:per) + ` ${unit}/kg`;

const R = (name, rule, res, note) => `<tr><td>${name}${note?`<div class="sub">${note}</div>`:""}</td><td class="sub">${rule}</td><td class="hl">${res}</td></tr>`;

const PBUP = () => pMaxFor("bupi");
function laLine(){ const w=W(), b=pMaxFor("bupi"), r=pMaxFor("ropi"), l=pMaxFor("lido"); return `<div class="lamax"><b>LA max for ${sig(w)} kg${AGEM()<4?" (&lt; 4 months: 15% lower)":""}:</b> bupi / levobupi ${b} mg/kg = <b>${sig(b*w)} mg</b> (${sig(b*w/2.5)} mL of 0.25%) · ropi ${r} mg/kg = <b>${sig(r*w)} mg</b> · lignocaine ${l} mg/kg = ${sig(l*w)} mg (7 with adrenaline = ${sig(7*w)} mg). <b>Doses from different blocks add up</b> — use "+ add" and the LA dose calculator (Blocks › card 1).</div>`; }
// LA row: ml = [lo,hi] mL/kg, mgml = mg per mL, max = mg/kg, capml = absolute mL cap
function LAR(name, ml, mgml, max, note, capml){
  const w = W(); let a = ml[0]*w, b = ml[1]*w, cap = false;
  if (capml!=null){ if (a>capml){a=capml;cap=true;} if (b>capml){b=capml;cap=true;} }

  return `<tr class="${over?"over":""}"><td>${name}${note?`<div class="sub">${note}</div>`:""}${add}</td><td class="sub">${ml[0]===ml[1]?ml[0]:ml.join("–")} mL/kg · ${sig(mgkg)} mg/kg</td><td class="hl">${a===b?sig(a):sig(a)+"–"+sig(b)} mL${cap?` <span class="sub">(max ${capml} mL)</span>`:""}${over?`<div class="danger" style="margin:4px 0 0;font-weight:700">Above max ${max} mg/kg</div>`:""}</td></tr>`;
}

function paedEtt(){
  const w = W(), mo = AGEM(), y = S.pY;
  let plain, plainTxt, cuffed = null, depth, depthRule, sizeRule, conv = false;
  if (mo >= 24){
    plain = floor05(y/4 + 4); cuffed = floor05(y/4 + 3.5);
    sizeRule = "> 1 y: plain age/4 + 4, cuffed age/4 + 3.5 (rounded down to 0.5)";
    depth = y/2 + 12; depthRule = "age/2 + 12";
  } else if (mo >= 12){
    plain = 4.5; cuffed = 3.5;
    sizeRule = "1 y: 4.5 plain; cuffed (Microcuff) 8 months–2 y 3.5";
    depth = 12; depthRule = "1 y: 12 cm";
  } else {
    if (w < 1){ plain = 2.5; plainTxt = "2.5"; sizeRule = "< 1 kg: 2.5 plain"; }
    else if (w < 2){ plain = 2.5; plainTxt = "2.5 – 3.0"; sizeRule = "1–2 kg: 2.5–3.0 plain (gap in notes, agreed)"; }
    else if (w < 3.5){ plain = 3.0; sizeRule = "> 2 kg: 3.0 plain"; }
    else if (mo < 4){ plain = 3.5; plainTxt = "3.5"; sizeRule = "> 3.5 kg: 3.5 plain (neonate 3.0–3.5)"; }
    else if (mo < 8){ plain = 4.0; sizeRule = "4 months: 4.0 plain"; }
    else { plain = 4.0; plainTxt = "4.0 – 4.5"; sizeRule = "8 months: 4.0–4.5 plain"; }
    if (w > 5){ cuffed = mo < 8 ? 3.0 : 3.5; sizeRule += "; cuffed (Microcuff): term–8 months 3.0, 8 months–2 y 3.5"; }
    if (mo < 1){ depth = w < 1.5 ? 7 : w < 2.5 ? 8 : 9; depthRule = "Premature ~1 kg 7 cm, ~2 kg 8 cm; term 9 cm"; }
    else { depth = 3*plain; depthRule = "3 × ETT (term 9 cm → 1 y 12 cm)"; }
  }
  const useCuff = cuffed!==null && w > 5;
  return {w, mo, y, plain, plainTxt: plainTxt || f1(plain), cuffed, useCuff, depth, depthRule, sizeRule, conv};
}

pCards.fluids = () => {

function pick(id, rows){ // rows: [key,label,[opt0,opt1,opt2]] scored 0/1/2

const sumOf = (id, rows) => rows.reduce((a,[k]) => a + ((S.sc[id]||{})[k] ?? 0), 0);

function pEndo(){ const w = W(), m = (k,c) => `${sig(Math.min(k*w,c))} mg`;

/* Pre-op */

  <div class="txck">${STB.map(([k,l])=>tog("stb",k,l)).join("")}</div>
  <div class="${v[0]}" style="margin-top:var(--s2)"><b>${n} / 5 — ${v[1]}.</b> ${v[2]}</div>${reset("stb")}
  <p class="sub">Also: tonsil size, neck circumference, baseline SpO₂ in sleep. OSA = more sensitive to opioids → multimodal, opioid-sparing.</p>

pCards.urti = () => `<div class="card"><h2>URTI &amp; asthma: go or delay</h2>${p3Draft()}
  <table><tr><th>Mild URTI</th><td>Clear runny nose ± dry cough → <b>may proceed with caution</b></td></tr>

/* Post-op: pain */
const FLACC = [["f","Face",["No particular expression / smile","Occasional grimace, withdrawn","Frequent quivering chin, clenched jaw"]],["l","Legs",["Normal / relaxed","Uneasy, restless, tense","Kicking, legs drawn up"]],
  ["a","Activity",["Lying quietly, moves easily","Squirming, shifting, tense","Arched, rigid or jerking"]],["c","Cry",["No cry","Moans, whimpers, occasional complaint","Crying steadily, screams"]],
  ["co","Consolability",["Content, relaxed","Reassured by touch / talk","Difficult to console"]]];
pCards.pscore = () => { const mo = AGEM(), y = S.pY, t = sumOf("flacc",FLACC), done = doneOf("flacc",FLACC);

  return `<div class="card"><h2>Paeds pain scores</h2>${p3Draft()}
  <table><tr><th>Tool</th><th>Who</th><th>Scale</th></tr>
  <tr${h(0)}><td>NIPS</td><td>Neonates (term &amp; preterm)</td><td>0–7 (mild 1–2, moderate 3–4, severe 5–7)</td></tr>
  <tr${h(1)}><td>FLACC</td><td>1 month – 4 y; non-verbal</td><td>0–10</td></tr>
  <tr${h(2)}><td>Faces (FPS-R)</td><td>4–7 y</td><td>0–10</td></tr>
  <tr${h(3)}><td>Numerical</td><td>≥ 7 y</td><td>0–10</td></tr>

  <div class="${!done?"result":t>=7?"danger":t>=4?"warn":"result ok"}"><div class="big">${t} / 10</div>${done?(t===0?"No pain":t<=3?"Mild":t<=6?"Moderate":"Severe"):"Tap every row."}</div>${reset("flacc")}
  <h3>NIPS (neonate)</h3><p class="sub">Face 0–1 · cry 0–2 · breathing 0–1 · arms 0–1 · legs 0–1 · arousal 0–1.</p>

pCards.mtp = () => { const w = W(), pk2 = w<20 ? "1 unit adult PC + 1 unit adult FFP" : w<=40 ? "2 units adult PC + 2 units adult FFP" : "4 units adult PC + 4 units adult FFP";

  <li><b>Activate</b> if haemorrhagic shock not responding to 20 mL/kg: blood loss &gt; 10% blood volume/min, ≥ 20 mL/kg PRBC in 2 h, or anticipated &gt; 50% blood volume in 3 h. Specialist activates; call blood bank.</li>
  <li><b>Tranexamic acid</b> ${B("15 mg/kg = "+wk(w,15,"mg",1000))} IV/IO (within 3 h of injury), then ${B("2 mg/kg/h = "+wk(w,2,"mg"))}/h.</li>
  <li>Send crossmatch, FBC, coag, RP, ABG, lactate, ionised Ca.</li>
  <li>Pack for ${sig(w)} kg: <b>${pk2}</b> (1st pack group O Rh+ / AB plasma; then group-specific + cryo + platelets).</li>
  <li>Give warmed PC and plasma in ${B("10 mL/kg = "+wk(w,10,"mL"))} aliquots, ratio 1 : 1. Platelets ${B("10 mL/kg")} (max 4 random units); cryo 1 unit / 10 kg or 10 mL/kg (max 10 units).</li>
  <li><b>Calcium:</b> CaCl 10% ${B("0.2 mL/kg = "+wk(w,0.2,"mL",10))} or Ca gluconate 10% ${B("0.5 mL/kg = "+wk(w,0.5,"mL",20))}.</li>
  <li>Control source · warm · correct acidosis · fibrinogen concentrate ${B("40 mg/kg = "+wk(w,40,"mg"))} if fibrinogen &lt; 1.5–2 g/L.</li>

  <table><tr><th>Target</th><td>Hb ≥ 8 g/dL · platelets ≥ 75 (≥ 100 head injury) · PT/APTT &lt; 1.5 × normal · fibrinogen &gt; 1.5 g/L · iCa &gt; 1.0 · pH &gt; 7.35 · T &gt; 36 °C</td></tr>

  <div class="${box[0]}" style="margin-top:var(--s2)"><b>${box[1]}</b> (${y<3?"age &lt; 3":`age ≥ 3 + ${n} factor${n===1?"":"s"}`}). ${box[2]}.</div>${reset("pponv")}

/* ---------- EMERGENCIES (crisis cards, DRAFT from published guidelines) ---------- */
const CRISIS_CHECKED = true;
const UPD_CHECKED = true;

const newerFlag = (name, yr, cur) => `<div class="newer"><b>⟳ Newer guideline published:</b> ${name} (${yr}). This card still follows ${cur} until it is updated from the full text.</div>`;
const crisisDraft = () => CRISIS_CHECKED ? "" : `<div class="warn" style="margin-top:0">DRAFT — from published guidelines, not yet ticked by you.</div>`;

const B = x => `<b class="dose">${x}</b>`;
const crisis = (title, steps, srcTxt, extra="") =>
  `<div class="card"><h2>${title}</h2>${crisisDraft()}<ol class="crisis">${steps.map(s=>`<li>${s}</li>`).join("")}</ol>${extra}${src(srcTxt)}</div>`;

const HK_CARD = () => `<div class="card"><h2>Hyperkalaemia</h2>${TX_CHECKED ? "" : `<div class="warn" style="margin-top:0">DRAFT — UK Kidney Association hyperkalaemia guideline, checked against two sources. Not yet ticked by you.</div>`}<ol class="crisis">

  <li>Transplant: K⁺ rises at reperfusion; use saline rather than K⁺-containing balanced fluid when K⁺ is high. Avoid suxamethonium.</li>
  <li>Cardiac arrest: ALS + calcium, insulin–glucose; consider dialysis during CPR.</li></ol>
  ${src("UK Kidney Association hyperkalaemia guideline 2023 (updated 2026); RCUK ALS 2025.")}</div>`;

const GA_CHECKED = true;

function wts(){
  const w = S.aw, h = S.height, m = S.sex === "M";
  const bmi = w / Math.pow(h/100, 2);
  let ibw = (m ? 50 : 45.5) + 0.91*(h - 152.4); ibw = Math.max(ibw, 30);
  const lbw = m ? 9270*w/(6680 + 216*bmi) : 9270*w/(8780 + 244*bmi);
  const ibwU = Math.min(ibw, w);                       // if actual < ideal, use actual
  const adj = w < ibw ? w : ibw + 0.4*(w - ibw);
  return {tbw:w, ibw:ibwU, ibwRaw:ibw, lbw:Math.min(lbw,w), adj, bmi};
}
const WN = {tbw:"TBW", ibw:"IBW", lbw:"LBW", adj:"AdjBW"};
// dose row: name, per-kg [lo,hi], unit, weight key, concentration per mL (same unit) or null, note, max
function GD(name, per, unit, wk, conc, note, max){
  const W2 = wts(), w = W2[wk], lo = Array.isArray(per)?per[0]:per, hi = Array.isArray(per)?per[1]:per;
  let a = lo*w, b = hi*w, capped = false;
  if (max!=null){ if (a>max){a=max;capped=true;} if (b>max){b=max;capped=true;} }
  const dose = a===b ? `${sig(a)} ${unit}` : `${sig(a)}–${sig(b)} ${unit}`;
  const ml = conc ? (a===b ? `${sig(a/conc)} mL` : `${sig(a/conc)}–${sig(b/conc)} mL`) : "";
  return `<tr><td>${name}${note?`<div class="sub">${note}</div>`:""}</td><td class="sub">${Array.isArray(per)?per.join("–"):per} ${unit}/kg<br><b>${WN[wk]} ${sig(w)} kg</b></td><td class="hl">${dose}${capped?` <span class="sub">(max ${max})</span>`:""}${ml?`<div class="sub">${ml}</div>`:""}</td></tr>`;
}
const GT = rows => `<div style="overflow-x:auto"><table><tr><th>Drug</th><th>Rule · weight used</th><th>Dose</th></tr>${rows.join("")}</table></div>`;

const IOA_CHECKED = true;

gaCards.opioid = () => {
  const W2 = wts(), x = (S.sc.ioa = S.sc.ioa || {}), on = k => x[k] === 1, old = S.age >= 65, obese = W2.bmi >= 30;
  const ofa = on("ofa"), renal = on("renal"), liver = on("liver"), osa = on("osa"), tol = on("tol");

  const paraW = obese ? W2.adj : W2.tbw, para = paraW < 50 ? `15 mg/kg = <b>${sig(15*paraW)} mg</b>` : "<b>1 g</b>";
  const lmax = laMaxMg("bupi","a"), infMl = lmax/2.5;
  const mods = [old && `<b>Age ${S.age}:</b> opioid doses halved below; dexmedetomidine — watch bradycardia`,
    obese && `<b>BMI ${sig(W2.bmi)}:</b> opioids on IBW / LBW; paracetamol on AdjBW ${sig(W2.adj)} kg`,
    renal && "<b>Kidney:</b> no NSAID; avoid morphine → fentanyl; magnesium only with levels / reduced",

    osa && "<b>OSA:</b> opioid-sparing plan advised (switch above); monitored bed if opioids needed",
    tol && "<b>Opioid-tolerant:</b> continue usual opioid (or equivalent); add ketamine; expect higher needs"].filter(Boolean);
  return `<div class="card"><h2>5. Intra-op analgesia</h2>${ioaDraft()}
  <div class="txck">${t("ofa","<b>Opioid-sparing / opioid-free plan</b> (OSA, obese, PONV-prone, opioid-intolerant)")}</div>
  <h3>Patient factors</h3><div class="txck">${IOA_MOD.map(([k,l])=>t(k,l)).join("")}</div>
  ${mods.length ? `<div class="warn">${mods.join("<br>")}</div>` : `<p class="sub">Elderly (≥ 65) and obese (BMI ≥ 30) are set from the patient box.</p>`}
  ${ofa ? `<div class="result"><b>Opioid-sparing plan</b><ol style="margin:6px 0 0"><li>Base: paracetamol + ${renal?"(no NSAID)":"NSAID"} + dexamethasone</li><li>Regional block or wound infiltration</li><li>Dexmedetomidine + ketamine${renal?"":" + magnesium"} ± lignocaine (not within 4 h of a block)</li><li>Rescue: fentanyl 0.25–0.5 mcg/kg only</li></ol></div>` : ""}
  <h3>1. Base — every case unless contraindicated</h3>

  <tr><th>Dexamethasone</th><td>0.1 mg/kg = <b>${sig(Math.min(0.1*W2.ibw,8))} mg</b> (usually 8 mg; IBW) — analgesia + PONV; caution diabetes</td></tr></table>

    GD("Fentanyl (induction)",[1*opF,2*opF],"mcg","lbw",50),
    GD("Fentanyl (top-up)",[0.5*opF,1*opF],"mcg","lbw",50),

    GD("Tramadol IV",[1,2],"mg","ibw",50,"max 100 mg; caution seizures, SSRIs",100)])}
  <p class="sub"><b>On remifentanil:</b> give morphine 0.1 mg/kg IBW = <b>${renal?"— (fentanyl instead)":sig(0.1*W2.ibw*opF)+" mg"}</b> or fentanyl 1–2 mcg/kg = <b>${sig(W2.lbw*opF)}–${sig(2*W2.lbw*opF)} mcg</b> ≈ 30 min before stopping remi.</p>
  <h3>3. Adjuncts (bolus → infusion, mL/h)</h3>

  <tr><th>Lignocaine IV<div class="sub">2% = 20 mg/mL</div></th><td>${liver?"<b>Reduce / avoid (liver).</b> ":""}1.5 mg/kg IBW over 10 min = <b>${sig(1.5*W2.ibw)} mg</b> (${sig(1.5*W2.ibw/20)} mL), then ≤ 1.5 mg/kg/h = <b>≤ ${sig(1.5*W2.ibw/20)} mL/h</b>, ≤ 24 h. <b>Not within 4 h of a nerve block</b> (or 4 h after stopping); counts toward LA toxicity</td></tr>
  <tr><th>Magnesium<div class="sub">100 mg/mL (5 g / 50 mL)</div></th><td>${renal?"<b>Kidney: reduce / check levels.</b> ":""}30–50 mg/kg IBW over 15–20 min = <b>${sig(30*W2.ibw)}–${sig(Math.min(50*W2.ibw,4000))} mg</b>, then 10–15 mg/kg/h = <b>${sig(10*W2.ibw/100)}–${sig(15*W2.ibw/100)} mL/h</b>. Potentiates NMB — monitor TOF</td></tr>
  <tr><th>Dexmedetomidine<div class="sub">4 mcg/mL (200 mcg / 50 mL)</div></th><td>0.5–1 mcg/kg over 10 min = <b>${sig(0.5*W2.ibw)}–${sig(W2.ibw)} mcg</b>, then 0.2–0.7 mcg/kg/h = <b>${sig(0.2*W2.ibw/4)}–${sig(0.7*W2.ibw/4)} mL/h</b>. Bradycardia, hypotension; slower wake-up</td></tr>
  <tr><th>Clonidine<div class="sub">150 mcg/mL</div></th><td>1–2 mcg/kg IBW slow = <b>${sig(Math.min(W2.ibw,150))}–${sig(Math.min(2*W2.ibw,150))} mcg</b> (max 150 mcg); hypotension, sedation</td></tr></table>
  <h3>4. Regional / wound infiltration</h3>
  <p>Bupivacaine / levobupivacaine 0.25%: max for this patient <b>${sig(lmax)} mg = ${sig(infMl)} mL</b> ${laAddBtn("a","bupi","0.25",+sig(infMl),1,"Wound infiltration")}<br><span class="sub">Includes all other LA given (blocks, IV lignocaine).</span></p>
  <h3>By operation (PROSPECT)</h3>
  <table><tr><th>Operation</th><th>Block / infiltration (+ base drugs)</th></tr>
  <tr><td>Lap cholecystectomy</td><td>Port-site infiltration; no routine block</td></tr>
  <tr><td>Laparotomy (open abdominal)</td><td>Thoracic epidural, or rectus sheath / TAP; wound catheter</td></tr>
  <tr><td>Inguinal hernia (open)</td><td>Ilioinguinal / iliohypogastric block or wound infiltration</td></tr>
  <tr><td>Hysterectomy</td><td>Lap: port-site infiltration · open: wound infiltration or TAP; intrathecal morphine if spinal</td></tr>
  <tr><td>Total knee</td><td>Adductor canal block + periarticular infiltration (LIA)</td></tr>
  <tr><td>Total hip</td><td>LIA, or fascia iliaca / PENG; intrathecal morphine if spinal</td></tr>

const RA_CHECKED = true;
const raDraft = () => RA_CHECKED ? "" : `<div class="warn" style="margin-top:0">DRAFT — from standard sources (NYSORA, ASRA, RA-UK), not yet ticked by you.</div>`;
const RSRC = "NYSORA / RA-UK Plan A blocks / ASRA.";
const LAD = {
  bupi:{n:"Bupi / levobupi", max:2, pmax:2.5, cap:150, concs:["0.25","0.5"]},
  ropi:{n:"Ropivacaine", max:3, pmax:3, cap:225, concs:["0.2","0.375","0.5","0.75"]},
  lido:{n:"Lignocaine plain", max:3, pmax:3, cap:200, concs:["1","2"]},
  lidoA:{n:"Lignocaine + adrenaline", max:7, pmax:7, cap:500, concs:["1","2"]}};
function laWeight(lt){
  if (lt==="p") return {w:W(), why:`paeds weight ${sig(W())} kg`};
  const x = wts(); return x.bmi >= 30 ? {w:x.lbw, why:`LBW ${sig(x.lbw)} kg (BMI ${sig(x.bmi)} ≥ 30)`} : {w:x.tbw, why:`actual weight ${sig(x.tbw)} kg`};
}
function laMaxMg(d, lt){ const {w} = laWeight(lt), D = LAD[d]; return Math.min((lt==="p"?pMaxFor(d):D.max)*w, D.cap); }
const laKey = lt => lt==="p" ? "laP" : "laA";
function laAddBtn(lt, d, conc, ml, sides, label){
  const spec = esc(JSON.stringify({d, c:String(conc), ml:+sig(ml), bi:sides, l:label}));
  return `<button class="addla" data-addla="${spec}" data-lt="${lt}">+ Add ${sig(ml)} mL ${conc}%${sides===2?" × 2 sides":""} to LA calculator</button>`;
}
function laCalc(lt){
  const list = S[laKey(lt)] || [], D = LAD[S.laD] || LAD.bupi;
  if (!D.concs.includes(S.laC)) S.laC = D.concs[D.concs.length > 2 ? 1 : 0];
  const {why} = laWeight(lt);
  let total = 0;
  const rows = list.map((it,i) => { const mg = it.ml * it.bi * (+it.c) * 10, pct = mg / laMaxMg(it.d, lt) * 100; total += pct;
    return `<tr><td>${esc(it.l||LAD[it.d].n)}<div class="sub">${LAD[it.d].n} ${it.c}% · ${sig(it.ml)} mL${it.bi===2?" × 2":""}</div></td><td class="hl">${sig(mg)} mg</td><td class="hl">${Math.round(pct)}%</td><td><button class="rmla" data-rmla="${lt}:${i}" aria-label="Remove">×</button></td></tr>`; }).join("");
  const state = total > 100 ? "over" : total > 80 ? "near" : "ok";
  const maxLine = Object.entries(LAD).map(([k,v]) => `${v.n} ${sig(laMaxMg(k,lt))} mg`).join(" · ");
  return `<p class="sub">Max for this patient (${why}): ${maxLine}</p>
    <div class="sub">Add a block</div>${seg("laD",Object.entries(LAD).map(([k,v])=>[k,v.n]))}${seg("laC",D.concs.map(c=>[c,c+"%"]))}
    ${step("laMl","Volume","mL",1,60,1)}${seg("laBi",[["1","One side"],["2","Both sides"]])}
    <button class="homebtn" data-addla="form" data-lt="${lt}">+ Add ${S.laMl} mL ${D.n} ${S.laC}%${S.laBi==="2"?" × 2":""}</button>
    ${list.length ? `<div style="overflow-x:auto"><table><tr><th>Block</th><th>Dose</th><th>% max</th><th></th></tr>${rows}</table></div>` : `<p class="sub">No blocks added yet. Use the form above or the "+ Add" button on any block card.</p>`}
    <div class="meter ${state}"><span style="width:${Math.min(total,100)}%"></span></div>
    <div class="${state==="over"?"danger":state==="near"?"warn":"result"}" style="margin-top:var(--s2)"><b>Total: ${Math.round(total)}% of maximum</b>${state==="over"?" — ABOVE MAXIMUM. Reduce volume or concentration.":state==="near"?" — close to maximum.":""}</div>
    ${list.length?`<button class="linkbtn" data-clrla="${lt}">Clear list</button>`:""}
    <p class="sub">Different drugs combine as % of each one's own maximum. Doses apply to one sitting.</p>`;
}

  <tr><th>Cautions</th><td>${o.caut}</td></tr></table>

}

/* ---------- ANTIBIOTIC PROPHYLAXIS (adult + paeds) — DRAFT: Malaysian NAG 2019 / ASHP-IDSA 2013 ---------- */
const ABX_CHECKED = true;
const abxDraft = () => ABX_CHECKED ? "" : `<div class="warn" style="margin-top:0">DRAFT — Malaysian National Antimicrobial Guideline 2019 / ASHP-IDSA 2013, not yet ticked by you. Follow local policy.</div>`;
// adult: fixed dose or per-kg; paeds: per kg with max (mg)
const ABX = {
  cefazolin:{n:"Cefazolin", a:w=>w>=120?"3 g":"2 g", p:[30,2000], re:"4 h"},
  cefuroxime:{n:"Cefuroxime", a:()=> "1.5 g", p:[50,1500], re:"4 h"},
  unasyn:{n:"Unasyn (ampicillin–sulbactam)", a:()=> "3 g", p:[75,3000], pnote:"50 mg/kg ampicillin component", re:"2 h"},
  augmentin:{n:"Augmentin IV (amoxicillin–clavulanate)", a:()=> "1.2 g", p:[30,1200], re:"2 h"},
  metronidazole:{n:"Metronidazole", a:()=> "500 mg", p:[15,500], re:"—"},
  gentamicin:{n:"Gentamicin", a:null, p:[2.5,null], re:"—"},
  clindamycin:{n:"Clindamycin", a:()=> "900 mg", p:[10,900], re:"6 h"},
  vancomycin:{n:"Vancomycin", a:null, p:[15,2000], re:"—", note:"infuse over ≥ 60 min, start 60–120 min before incision"},
  azithromycin:{n:"Azithromycin", a:()=> "500 mg", p:[10,500], re:"—"}};
function abxDose(k, paeds){
  const d = ABX[k];
  if (paeds){ const w = W(), mg = Math.min(d.p[0]*w, d.p[1] ?? Infinity); return `${sig(mg)} mg <span class="sub">(${d.p[0]} mg/kg${d.p[1]?`, max ${d.p[1]>=1000?d.p[1]/1000+" g":d.p[1]+" mg"}`:""}${d.pnote?`; ${d.pnote}`:""})</span>`; }
  const x = wts();
  if (k==="gentamicin"){ const dw = x.tbw > 1.2*x.ibwRaw ? x.adj : x.tbw; return `${sig(5*dw)} mg <span class="sub">(5 mg/kg ${x.tbw > 1.2*x.ibwRaw ? "AdjBW" : "TBW"} ${sig(dw)} kg)</span>`; }
  if (k==="vancomycin"){ return `${sig(Math.min(15*x.tbw,2000))} mg <span class="sub">(15 mg/kg TBW, max 2 g)</span>`; }
  return d.a(x.tbw);
}
const ABX_SP = {
  general:{n:"General / upper GI", first:[["cefazolin"]], allergy:[["clindamycin","gentamicin"]], note:"Low-risk laparoscopic procedures may need none."},
  hpb:{n:"HPB / biliary", first:[["cefazolin"],["unasyn"]], allergy:[["clindamycin","gentamicin"]], note:"Low-risk elective lap chole: none. Biliary obstruction, stents, Whipple: add metronidazole or use Unasyn."},
  colorectal:{n:"Colorectal / appendix", first:[["cefazolin","metronidazole"],["unasyn"]], allergy:[["clindamycin","gentamicin"],["metronidazole","gentamicin"]], note:"Perforation / peritonitis = treatment course, not prophylaxis."},
  uro:{n:"Urology", first:[["cefazolin"],["gentamicin"]], allergy:[["gentamicin"],["clindamycin","gentamicin"]], note:"Bowel opened (cystectomy, conduit): cefazolin + metronidazole. Treat a positive urine culture before surgery."},
  gynae:{n:"Gynae (hysterectomy)", first:[["cefazolin"]], allergy:[["clindamycin","gentamicin"]], note:"Add metronidazole if bowel involved or per local policy."},
  lscs:{n:"LSCS", first:[["cefazolin"]], allergy:[["clindamycin","gentamicin"]], note:"Give before incision. In labour or ruptured membranes: add azithromycin 500 mg."},
  ortho:{n:"Ortho", first:[["cefazolin"]], allergy:[["vancomycin"],["clindamycin"]], note:"MRSA colonised: add vancomycin. Open fracture: start ASAP; add gentamicin for type III. Arthroplasty: may continue ≤ 24 h."},
  dental:{n:"Dental / maxfax / head & neck", first:[["cefazolin","metronidazole"],["unasyn"],["augmentin"]], allergy:[["clindamycin"]], note:"Clean-contaminated (mucosa breached). Routine dental extraction or clean neck surgery (thyroid, parotid): usually none."},
  clean:{n:"Clean (hernia, breast)", first:[["cefazolin"]], allergy:[["clindamycin"],["vancomycin"]], note:"Without mesh or implant and low risk: usually none."},
  nvc:{n:"Neuro / vascular / cardiac", first:[["cefazolin"],["cefuroxime"]], allergy:[["vancomycin"],["clindamycin"]], note:"MRSA colonised: add vancomycin."}};
function abxCard(paeds){
  if (!ABX_SP[S.abxSp]) S.abxSp = "general";
  const sp = ABX_SP[S.abxSp];
  const opt = list => list.map((combo,i) => `<div class="abxopt">${i?`<span class="or">or</span>`:""}${combo.map(k=>`<div class="abxrow"><span>${ABX[k].n}</span><b>${abxDose(k,paeds)}</b></div>`).join("")}</div>`).join("");
  const used = [...new Set([...sp.first.flat(), ...sp.allergy.flat()])];
  const extra = S.abxSp==="lscs" ? `<div class="abxrow"><span>+ Azithromycin (labour / ROM)</span><b>${abxDose("azithromycin",paeds)}</b></div>` : "";
  return `${seg("abxSp", Object.entries(ABX_SP).map(([k,v])=>[k,v.n]))}
    <h3>First-line</h3>${opt(sp.first)}${extra}
    <h3>Penicillin allergy</h3>${opt(sp.allergy)}
    <div class="warn">${sp.note}</div>
    <h3>Timing</h3><ul><li>IV within <b>60 min before incision</b> (vancomycin: start 60–120 min before)</li>
      <li>Redose: ${used.filter(k=>ABX[k].re!=="—").map(k=>`${ABX[k].n.split(" (")[0]} every ${ABX[k].re}`).join(" · ") || "single dose"}; and after blood loss &gt; ${paeds?"25 mL/kg":"1.5 L"}</li>
      <li>Stop within 24 h (most cases: single dose)</li></ul>
    ${paeds ? pEndo() : `<details class="endo"><summary>Endocarditis prophylaxis (high-risk cardiac only)</summary>
      <p class="sub">Prosthetic valve, previous endocarditis, some congenital heart disease — for dental work breaching gingiva.</p>
      <table><tr><td>Amoxicillin PO</td><td class="hl">${paeds?`${sig(Math.min(50*W(),2000))} mg (50 mg/kg)`:"2 g"}</td></tr>
      <tr><td>Ampicillin IV</td><td class="hl">${paeds?`${sig(Math.min(50*W(),2000))} mg (50 mg/kg)`:"2 g"}</td></tr>
      <tr><td>Cefazolin IV (allergy, not anaphylaxis)</td><td class="hl">${paeds?`${sig(Math.min(50*W(),1000))} mg (50 mg/kg)`:"1 g"}</td></tr>
      <tr><td>Azithromycin (severe allergy)</td><td class="hl">${paeds?`${sig(Math.min(15*W(),500))} mg (15 mg/kg)`:"500 mg"}</td></tr></table>
      <p class="sub">30–60 min before. AHA 2021 (clindamycin no longer recommended).</p></details>`}
    ${src("Malaysian National Antimicrobial Guideline 2019; ASHP/IDSA/SIS/SHEA 2013; AHA 2021 · latest available, checked Nov 2026")}`;
}

/* ---------- DERMATOMES (schematic) — DRAFT: ASIA/ISNCSCI 2019 key sensory points ---------- */
const DERM_CHECKED = true;
const DERM_LEVELS = ["C2","C3","C4","C5","C6","C7","C8","T1","T2","T3","T4","T5","T6","T7","T8","T9","T10","T11","T12","L1","L2","L3","L4","L5","S1","S2","S3","S4-5"];
const DERM_INFO = {C2:"Occipital protuberance",C3:"Supraclavicular fossa",C4:"Top of acromioclavicular joint",C5:"Lateral antecubital fossa",
  C6:"Thumb",C7:"Middle finger",C8:"Little finger",T1:"Medial antecubital fossa",T2:"Apex of axilla",T3:"3rd intercostal space",
  T4:"Nipple line",T5:"Between nipple and xiphoid",T6:"Xiphisternum",T7:"Lower costal margin (upper)",T8:"Lower costal margin",T9:"Above umbilicus",
  T10:"Umbilicus",T11:"Between umbilicus and groin",T12:"Inguinal ligament (midpoint)",L1:"Upper anterior thigh / groin",L2:"Mid anterior thigh",
  L3:"Knee (medial femoral condyle)",L4:"Medial malleolus / medial leg",L5:"Dorsum of foot / big toe",S1:"Lateral heel / lateral foot",
  S2:"Popliteal fossa / posterior thigh",S3:"Ischial tuberosity",["S4-5"]:"Perianal"};
const dermRegion = l => l[0]==="C" ? "c" : l[0]==="T" ? "t" : l[0]==="L" ? "l" : "s";
const dermIdx = l => DERM_LEVELS.indexOf(l);
function dermExpand(v){ if (!v) return []; const [a,b] = String(v).split("–"); const i = dermIdx(a), j = b ? dermIdx(b) : i; return i<0 ? [] : DERM_LEVELS.slice(i, (j<0?i:j)+1); }
// torso outline (front and back identical)
const TORSO = [[60,58],[68,100],[72,150],[66,172]];
function tx(y){ for (let i=0;i<TORSO.length-1;i++){ const [x1,y1]=TORSO[i],[x2,y2]=TORSO[i+1]; if (y>=y1&&y<=y2) return x1+(x2-x1)*(y-y1)/(y2-y1); } return TORSO[TORSO.length-1][0]; }
function tband(y1,y2){ const ys=[y1,...TORSO.map(p=>p[1]).filter(y=>y>y1&&y<y2),y2]; const L=ys.map(y=>[tx(y),y]), R=ys.slice().reverse().map(y=>[200-tx(y),y]); return [...L,...R]; }
const pts = a => a.map(p=>p.join(",")).join(" ");
const mir = a => a.map(([x,y])=>[200-x,y]);
const TRUNK = {C4:[58,66],T2:[66,78],T3:[78,86],T4:[86,96],T5:[96,104],T6:[104,114],T7:[114,122],T8:[122,130],T9:[130,138],T10:[138,150],T11:[150,158],T12:[158,166]};
// limb shapes (viewer-left side, mirrored for the other side)
const FRONT_LIMB = {
  C5:[[58,62],[44,70],[34,120],[43,121],[50,95],[60,76]], T2:[[60,76],[50,95],[43,121],[52,122],[64,92]],
  C6:[[34,120],[28,170],[24,204],[29,206],[36,171],[43,121]], T1:[[43,121],[38,150],[47,150],[52,122]],
  C8:[[38,150],[36,171],[44,171],[47,150]], C7:[[29,206],[36,171],[38,206]], C8b:[[36,171],[44,171],[42,205],[38,206]],
  L1:[[66,172],[100,182],[100,188],[67,180]], L2:[[67,180],[100,188],[97,205],[68,200]], L3:[[68,200],[97,205],[96,242],[70,240]],
  L5:[[70,240],[83,240],[84,290],[73,290]], L4:[[83,240],[96,242],[93,290],[84,290]], L5f:[[73,290],[93,290],[95,302],[74,302]], S1f:[[69,290],[73,290],[74,302],[68,302]]};
const BACK_LIMB = {
  C5:FRONT_LIMB.C5, T2:FRONT_LIMB.T2, C6:FRONT_LIMB.C6, T1:FRONT_LIMB.T1, C8:FRONT_LIMB.C8, C7:FRONT_LIMB.C7, C8b:FRONT_LIMB.C8b,
  L1:[[66,166],[100,166],[100,172],[66,172]], L2:[[66,172],[86,172],[86,178],[66,178]], L3:[[66,178],[84,178],[80,190],[67,190]],
  S3:[[84,174],[100,174],[100,192],[80,192]], S2:[[67,190],[100,192],[96,240],[70,240]], S1:[[70,240],[84,240],[84,302],[68,302]], L4:[[84,240],[96,242],[93,290],[84,290]]};
const FRONT_DOTS = {C3:[82,61],C4:[64,62],C5:[39,118],C6:[25,203],C7:[33,205],C8:[41,203],T1:[50,123],T2:[62,82],T3:[84,82],T4:[84,91],T5:[85,100],T6:[86,109],T7:[86,118],T8:[86,126],T9:[86,134],T10:[86,144],T11:[86,154],T12:[78,165],L1:[80,178],L2:[86,194],L3:[92,236],L4:[90,286],L5:[84,297]};
const BACK_DOTS = {C2:[100,32],S1:[73,298],S2:[83,236],S3:[92,186],["S4-5"]:[100,186]};
function dermSVG(view){
  const on = new Set(dermExpand(S.derm)), any = on.size>0;
  const cls = l => `band r-${dermRegion(l)} ${dermIdx(l)%2?"alt":""} ${any?(on.has(l)?"on":"off"):""}`;
  const limb = view==="F" ? FRONT_LIMB : BACK_LIMB;
  let g = "";
  g += `<ellipse class="body" cx="100" cy="28" rx="18" ry="22"/><rect class="body" x="91" y="46" width="18" height="14"/>`;
  g += `<polygon class="body" points="${pts(tband(58,172))}"/>`;
  const armL=[[58,62],[44,70],[34,120],[28,170],[24,204],[42,206],[44,171],[52,122],[64,92]], legL=[[66,172],[100,182],[96,242],[93,290],[95,302],[68,302],[73,290],[70,240],[67,180]];
  [armL,legL].forEach(a=>{ g += `<polygon class="body" points="${pts(a)}"/><polygon class="body" points="${pts(mir(a))}"/>`; });
  if (view==="B") g += `<path class="${cls("C2")}" data-l="C2" d="M82 34 Q100 52 118 34 L118 44 Q100 54 82 44Z"/>`;
  g += `<rect class="${cls("C3")}" data-l="C3" x="91" y="46" width="18" height="12"/>`;
  Object.entries(TRUNK).forEach(([l,[a,b]]) => g += `<polygon class="${cls(l)}" data-l="${l}" points="${pts(tband(a,b))}"/>`);
  if (view==="F") g += `<polygon class="${cls("L1")}" data-l="L1" points="${pts([[66,166],[134,166],[134,172],[100,182],[66,172]])}"/>`;
  Object.entries(limb).forEach(([k,a]) => { const l = k.replace(/[bf]$/,""); g += `<polygon class="${cls(l)}" data-l="${l}" points="${pts(a)}"/><polygon class="${cls(l)}" data-l="${l}" points="${pts(mir(a))}"/>`; });
  if (view==="B") g += `<circle class="${cls("S4-5")}" data-l="S4-5" cx="100" cy="186" r="5"/>`;
  const dots = view==="F" ? FRONT_DOTS : BACK_DOTS;
  Object.entries(dots).forEach(([l,[x,y]]) => g += `<circle class="kp ${on.has(l)?"on":""}" cx="${x}" cy="${y}" r="${on.has(l)?3.2:2}"/>`);
  return `<figure class="dfig"><svg viewBox="16 0 168 306" role="img" aria-label="${view==="F"?"Front":"Back"} dermatome schematic">${g}</svg><figcaption>${view==="F"?"Front":"Back"}</figcaption></figure>`;
}
const DERM_SURG = [["LSCS","T4"],["Upper abdominal","T4–T6"],["Lower abdominal / inguinal hernia","T8–T10"],["TURP / vaginal / cervix","T10"],["Testes","T10"],["Hip / knee","T10–L1"],["Foot / ankle","L2"],["Perineal / haemorrhoids (saddle)","S1–S4-5"]];

  ${src("ASIA/ISNCSCI 2019; Bromage 1965; Miller's Anesthesia; OAA.")}`;
}

function scorer(id, items, pass, okText){
  const st = (S.sc[id] = S.sc[id] || {});
  const done = items.every(([k]) => st[k] !== undefined), total = items.reduce((a,[k]) => a + (st[k] ?? 0), 0);
  const zero = items.some(([k]) => st[k] === 0);
  const rows = items.map(([k,label,opts]) => `<div class="scrow"><div class="sclab">${label}</div><div class="scopts">${opts.map((t,i) => t===null ? "" :
      `<button class="scopt ${st[k]===2-i?"on":""}" data-score="${id}:${k}:${2-i}"><b>${2-i}</b> ${t}</button>`).join("")}</div></div>`).join("");
  const verdict = !done ? `<div class="result"><div class="sub">Score so far</div><div class="big">${total} / 10</div><div class="sub">Tap every row.</div></div>`
    : total >= pass && !zero ? `<div class="result ok"><div class="big">${total} / 10 ✓</div><div><b>${okText}</b> (≥ ${pass}, no zero)</div></div>`
    : `<div class="danger"><div class="big">${total} / 10</div>Not yet — needs ≥ ${pass} with no zero. Reassess.</div>`;
  return rows + verdict + `<button class="linkbtn" data-screset="${id}">Reset score</button>`;
}

/* ---------- ANONYMOUS CASES (phone only, 36 h) ---------- */
const CASE_TTL = 36*3600*1000, CASE_MAX = 6;
function validCase(c){ return c && typeof c==="object" && /^\d{1,16}$/.test(String(c.id)) && /^Case [1-6]$/.test(c.label) && (c.sex==="F"||c.sex==="M")
  && Number.isFinite(c.y) && c.y>=0 && c.y<=100 && Number.isFinite(c.m) && c.m>=0 && c.m<=11 && Number.isFinite(c.h) && c.h>=30 && c.h<=210
  && Number.isFinite(c.w) && c.w>=0.4 && c.w<=250 && Number.isFinite(c.created) && typeof (c.nick||"")==="string" && (c.nick||"").length<=12; }
function getCases(){ const now = Date.now(); let all = store.get("cases",[]); if (!Array.isArray(all)) all = []; const live = all.filter(c => validCase(c) && now - c.created < CASE_TTL && c.created <= now + 60000); if (live.length !== all.length) store.set("cases", live); return live; }
const caseName = c => c.nick ? `${esc(c.label)} · ${esc(c.nick)}` : esc(c.label);
const caseAge = c => c.y < 1 ? `${c.m} m` : c.y < 16 && c.m ? `${c.y} y ${c.m} m` : `${c.y} y`;
const caseLine = c => `${c.sex==="F"?"♀":"♂"} ${sig(c.w)} kg · ${c.h} cm · ${caseAge(c)}`;
function activeCase(){ const id = store.get("active", null); return getCases().find(c => c.id === id) || null; }
function applyCase(c){
  ["sex","height","aw","age","morWt"].forEach(k=>S.touched[k]=true); if (c.y<16) ["pw","pY","pM"].forEach(k=>S.touched[k]=true); if (c.sex==="F") S.touched.spHt=true;
  S.sex = c.sex; S.height = c.h; S.aw = c.w; S.age = Math.max(16, c.y); S.morWt = c.w;
  if (c.y < 16){ S.pw = c.w; S.pY = c.y; S.pM = c.m; S.pHt = c.h; }
  if (c.sex === "F") S.spHt = Math.min(200, Math.max(140, c.h));
}
const SAMPLE_BY = {emerg:{adult:["aw"], paeds:["pw","pY"]}, ga:{"*":["height","aw"]}, regional:{"*":["height","aw"]}, paeds:{"*":["pw","pY"]}, obs:{lscs:["spHt"], post:["morWt"]}, tx:{pre:["aw","height","k","hb"], ind:["aw","height","k"], intra:["aw","k","hb"], post:["aw","height"], don:["aw"]}};
function sampleWarn(keys){ const k = keys.filter(isSample); if (!k.length) return "";
  const names = {k:"K⁺", hb:"Hb", height:"height", aw:"weight", pw:"weight", pY:"age", spHt:"height", morWt:"weight"};
  return `<div class="samplewarn"><b>Sample values</b> — ${[...new Set(k.map(x=>names[x]))].join(" and ")} not entered. Enter the patient or tap a case.</div>`; }
function activeBar(){ const c = activeCase(); return c ? `<button class="activebar" data-go="cases"><span>Active: <b>${caseName(c)}</b> · ${caseLine(c)}</span><span class="sub">change ›</span></button>` : ""; }
function caseStrip(){
  const cs = getCases(), act = store.get("active", null);
  return `<div class="label">Today's list</div><div class="chips">${cs.map(c => `<button class="chip ${c.id===act?"on":""}" data-case="${c.id}">${caseName(c)} · ${c.sex==="F"?"♀":"♂"} ${sig(c.w)} kg</button>`).join("")}
    ${cs.length < CASE_MAX ? `<button class="chip add" data-go="cases">+ Add case</button>` : ""}${cs.length ? `<button class="chip ghost" data-go="cases">Edit</button>` : ""}</div>`;
}
screens.cases = () => {
  const cs = getCases(), act = store.get("active", null), now = Date.now();
  const list = cs.length ? cs.map(c => { const left = Math.max(0, Math.round((CASE_TTL - (now - c.created))/3600000));
    return `<div class="card casecard ${c.id===act?"on":""}"><div><b>${caseName(c)}</b>${c.id===act?` <span class="pill">active</span>`:""}<div class="sub">${caseLine(c)} · deletes in ${left} h</div></div>
      <div class="caseact"><button class="iconbtn" data-case="${c.id}">${c.id===act?"✓ In use":"Use"}</button><button class="iconbtn" data-delcase="${c.id}" aria-label="Delete">Delete</button></div></div>`; }).join("")
    : `<p class="sub">No cases yet.</p>`;
  const form = cs.length >= CASE_MAX ? `<p class="sub">Maximum ${CASE_MAX} cases. Delete one to add another.</p>` : `<div class="card"><h2>Add case ${cs.length+1}</h2>
    <label class="sub" for="cNick">Nickname (optional, max 12)</label>
    <input id="cNick" class="search" style="padding-left:12px" maxlength="12" autocomplete="off" placeholder="e.g. Bed 4, LSCS am" value="${esc(S.cNick||"")}">
    <div class="warn">No names, IC or MRN — anonymous only.</div>
    ${seg("cSex",[["F","♀ Female"],["M","♂ Male"]])}${step("cY","Age","y",0,100,1)}${S.cY<16?step("cM","+ months","m",0,11,1):""}${step("cH","Height","cm",30,210,1)}${step("cW","Weight","kg",0.5,250,0.5)}
    <button class="homebtn primary" data-savecase="1">Save case</button></div>`;
  return head("Today's list","home") + `<p class="sub">Saved on this phone only. Each case deletes itself 36 h after it is added.</p>` + list + form + disc;
};
screens.values = () => {
  const ticks = store.get("ticks",{});
  let i=0, total=0, done=0;
  const body = VALUES.map(([sec,items]) => `<div class="card vs"><h2>${sec}</h2>${items.map(t=>{const id="v"+(i++); total++; if(ticks[id])done++;
    return `<label><input type="checkbox" data-tick="${id}" ${ticks[id]?"checked":""}><span>${esc(t)}</span></label>`;}).join("")}</div>`).join("");
  return head("Values sheet","home") + `<div class="card"><p>Tick each line you agree with. Tell Claude about anything that needs changing.
    When everything is ticked, tell Claude and the DRAFT banner will be replaced by the check date.</p>
    <p class="sub">Ticked: <b>${done} / ${total}</b> (saved on this phone only)</p></div>` + body + disc;
};

  if (d.lscs){ S.spOp="lscs"; S.open=null; location.hash="#g-spinal"; window.scrollTo(0,0); return; }
  if (d.go){ S.open = null; S.openSet = new Set(); S.txck = {}; location.hash = "#"+d.go; window.scrollTo(0,0); return; }
  if (d.savename){ const v = cleanName(S.dname ?? doctorName()); store.set("doctor", v || "Dr X"); S.dname = undefined; location.hash = "#home"; return; }
  if (d.case){ const c = getCases().find(x=>x.id===d.case); if (c){ store.set("active", c.id); applyCase(c); } if ((location.hash||"#home")==="#cases") render(); else render(); return; }
  if (d.delcase){ const cs = getCases().filter(x=>x.id!==d.delcase); store.set("cases", cs); if (store.get("active",null)===d.delcase) store.set("active", null); render(); return; }
  if (d.savecase){ const cs = getCases(); if (cs.length >= CASE_MAX) return;
    const used = cs.map(c=>+c.label.replace("Case ","")); let n = 1; while (used.includes(n)) n++;
    const nick = (S.cNick||"").trim().slice(0,12);
    const c = {id: String(Date.now()), label: "Case "+n, nick, sex:S.cSex, y:+S.cY, m:+S.cY<16?+S.cM:0, h:+S.cH, w:+S.cW, created: Date.now()};
    cs.push(c); store.set("cases", cs); store.set("active", c.id); applyCase(c); S.cNick = ""; render(); return; }
  if (d.addla){ const lt = d.lt, k = laKey(lt); S[k] = S[k] || [];
    const it = d.addla==="form" ? {d:S.laD, c:S.laC, ml:+S.laMl, bi:+S.laBi, l:LAD[S.laD].n} : JSON.parse(d.addla);
    S[k].push(it); b.textContent = "✓ Added"; setTimeout(render, 350); return; }
  if (d.rmla){ const [lt,i] = d.rmla.split(":"); S[laKey(lt)].splice(+i,1); render(); return; }
  if (d.clrla){ S[laKey(d.clrla)] = []; render(); return; }
  if (d.apf!==undefined){ S.apfel = (S.apfel||0) ^ (1<<(+d.apf)); render(); return; }
  if (d.goTab){ const [gid,tid] = d.goTab.split(":"); const og = GROUPS.find(x=>x.id===gid); if (og) S[og.tabKey]=tid; S.open=null; const tg="#g-"+gid; if (location.hash===tg) render(); else location.hash=tg; window.scrollTo(0,0); return; }
  if (d.setw){ S.pw = parseFloat(d.setw); render(); return; }
  if (d.seg){ S.touched[d.seg]=true; S[d.seg] = d.val; render(); return; }
  if (d.step){ S.touched[d.step]=true; const k=d.step, st=parseFloat(d.d); let v=parseFloat(S[k])||0; v=clamp(Math.round((v+st)*10)/10, +d.min, +d.max); S[k]=v; render(); return; }
  if (d.tick!==undefined){ const t=store.get("ticks",{}); t[d.tick]=b.checked; store.set("ticks",t); render(); return; }
  if (b.hasAttribute("data-theme-toggle")){ const cur=store.get("theme","auto"); const nxt = cur==="auto"?"dark":cur==="dark"?"light":"auto"; store.set("theme",nxt); applyTheme(); render(); }
});
document.addEventListener("change", e => {
  const el = e.target; if (!el.dataset || !el.dataset.in) return;
  const k = el.dataset.in; let v = parseFloat(el.value.replace(",", "."));
  if (!isNaN(v) && +S[k] === v && S.touched[k]) return;
  S.touched[k]=true;
  if (isNaN(v)) v = S[k];
  S[k] = clamp(v, +el.dataset.min, +el.dataset.max); render();
});
function applyTheme(){ const t=store.get("theme","auto"); if (t==="auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", t); }
window.addEventListener("hashchange", render);
let wideNow = isWide(); window.addEventListener("resize", () => { if (isWide() !== wideNow){ wideNow = isWide(); render(); } });
document.addEventListener("keydown", e => {
  const tag = (e.target.tagName||"").toLowerCase(), typing = tag==="input" || tag==="textarea";
  if (e.key === "/" && !typing){ e.preventDefault(); if ((location.hash||"#home") !== "#home" && location.hash !== ""){ location.hash = "#home"; setTimeout(()=>{ const q=$("#q"); if(q) q.focus(); }, 50); } else { const q=$("#q"); if(q) q.focus(); } return; }
  if (e.key === "Escape"){ if (typing){ e.target.blur(); return; }
    const open = document.querySelectorAll("details.acc[open]"); if (open.length){ open[open.length-1].open = false; return; }
    if ((location.hash||"#home") !== "#home") location.hash = "#home"; return; }
  if (!typing && /^[1-6]$/.test(e.key)){ const tabs = document.querySelectorAll(".emtabs button"); const b = tabs[+e.key-1]; if (b) b.click(); }
});
applyTheme(); { const c = activeCase(); if (c) applyCase(c); } render();
if ("serviceWorker" in navigator && (location.protocol==="https:" || location.hostname==="localhost" || location.hostname==="127.0.0.1")) {
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register("sw.js").catch(()=>{});
  navigator.serviceWorker.addEventListener("controllerchange", () => { if (!hadController || document.getElementById("updbar")) return;
    const bar = document.createElement("button"); bar.id = "updbar"; bar.className = "updbar"; bar.textContent = "Update downloaded — tap to load the new version";
    bar.addEventListener("click", () => location.reload()); document.body.appendChild(bar); });
}
